// ================= CONECTAR WHATSAPP (Cadastro incorporado da Meta) =================
const META_APP_ID = '1658120649115593';
const META_CONFIG_ID = '1422937496496428';
function carregarSdkMeta() {
  if (window.FB) return Promise.resolve();
  return new Promise((ok, falha) => {
    window.fbAsyncInit = function () {
      FB.init({ appId: META_APP_ID, autoLogAppEvents: true, xfbml: false, version: 'v25.0' });
      ok();
    };
    const sc = document.createElement('script');
    sc.src = 'https://connect.facebook.net/pt_BR/sdk.js'; sc.async = true; sc.defer = true; sc.crossOrigin = 'anonymous';
    sc.onerror = () => falha(new Error('sdk'));
    document.body.appendChild(sc);
  });
}

async function conectarWhatsapp(siteId) {
  const st = $('wa-status');
  st.style.color = 'var(--tx2)'; st.textContent = 'Abrindo a janela da Meta…';
  try { await carregarSdkMeta(); } catch (_) { st.textContent = 'Não consegui carregar o login da Meta. Desative bloqueadores e tente de novo.'; st.style.color = 'var(--alerta)'; return; }

  let sessao = null;
  const ouvir = (ev) => {
    if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
    try {
      const d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
      if (d && d.type === 'WA_EMBEDDED_SIGNUP') {
        if (String(d.event || '').startsWith('FINISH')) sessao = d.data || {};
        else if (d.event === 'CANCEL') sessao = { cancelado: true, etapa: d.data?.current_step };
        else if (d.event === 'ERROR') sessao = { erro: d.data?.error_message };
      }
    } catch (_) {}
  };
  window.addEventListener('message', ouvir);

  // o SDK da Meta não aceita função async direto no callback
  FB.login((resp) => { (async () => {
    const code = resp && resp.authResponse && resp.authResponse.code;
    // espera até 8s a Meta mandar o número e a conta
    for (let i = 0; i < 16 && !sessao; i++) await new Promise((r) => setTimeout(r, 500));
    window.removeEventListener('message', ouvir);
    if (!code || sessao?.cancelado) { st.textContent = 'Conexão cancelada.'; return; }
    if (sessao?.erro) { st.textContent = 'A Meta informou um erro: ' + sessao.erro; st.style.color = 'var(--alerta)'; return; }
    st.textContent = 'Finalizando a conexão…';
    const r = await chamarAdmin({ acao: 'conectar_whatsapp', site_id: siteId, code, waba_id: sessao?.waba_id, phone_number_id: sessao?.phone_number_id });
    if (!r.ok) { st.textContent = r.erro || 'Erro ao conectar.'; st.style.color = 'var(--alerta)'; return; }
    toast('WhatsApp conectado! As novas conversas vão chegar no Radar.');
    const { data: sites } = await sb.from('sites').select('id, nome, logo_path, pixel_id, allowed_origins, whatsapp_phone_number_id, whatsapp_waba_id, whatsapp_conectado_em, creditos_mensal, rotina_followup_dias, rotina_reativacao_dias, auto_lembrete, lembrete_horas, lembrete_modelo, auto_followup, followup_modelo, auto_reativacao, reativacao_modelo').eq('ativo', true).order('nome');
    estado.sites = sites || [];
    telaConfig();
  })(); }, {
    config_id: META_CONFIG_ID,
    response_type: 'code',
    override_default_response_type: true,
    extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' },
  });
}

function carregarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((ok, falha) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(); }; sc.onerror = falha; document.head.appendChild(sc); });
}
async function textoDoPdf(buf) {
  await carregarPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise; const linhas = [];
  for (let p = 1; p <= Math.min(pdf.numPages, 10); p++) {
    const tc = await (await pdf.getPage(p)).getTextContent(); const porY = new Map();
    tc.items.forEach((it) => { const y = Math.round(it.transform[5] / 3); if (!porY.has(y)) porY.set(y, []); porY.get(y).push([it.transform[4], it.str]); });
    [...porY.entries()].sort((a, b) => b[0] - a[0]).forEach(([, its]) => linhas.push(its.sort((a, b) => a[0] - b[0]).map((x) => x[1]).join(' ')));
  }
  return linhas.join('\n');
}
async function lerArquivoServicos(f) {
  if (!f) return;
  $('sv-status').style.color = 'var(--tx2)'; $('sv-status').textContent = 'Lendo…';
  try {
    if (/\.xlsx?$/i.test(f.name)) {
      await carregarSheetJS();
      const wb = XLSX.read(await f.arrayBuffer());
      const linhas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      usarServicosLidos(servicosDasLinhas(linhas), 'do arquivo');
    } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
      usarServicosLidos(servicosDoTexto(await textoDoPdf(await f.arrayBuffer())), 'do PDF');
    } else if (/^image\//.test(f.type)) {
      $('sv-status').style.color = 'var(--alerta)'; $('sv-status').textContent = 'Foto da tabela ainda não dá pra ler. Mande em Excel, PDF ou cole o texto.';
    } else {
      const txt = await f.text(); const linhas = lerCSV(txt);
      const l1 = servicosDasLinhas(linhas); usarServicosLidos(l1.length ? l1 : servicosDoTexto(txt), 'do arquivo');
    }
  } catch (_) { $('sv-status').style.color = 'var(--alerta)'; $('sv-status').textContent = 'Não consegui ler esse arquivo.'; }
}
async function iniciarServicos(siteId) {
  const { data } = await sb.from('servicos').select('nome, valor').eq('site_id', siteId).order('ordem');
  if (!$('sv-lista')) return;
  estado.servicosEdit = (data || []).map((s) => ({ nome: s.nome, valor: Number(s.valor) }));
  desenharServicos();
  const drop = $('sv-drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('arrastando'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('arrastando'); }));
  drop.addEventListener('drop', (e) => lerArquivoServicos(e.dataTransfer?.files?.[0]));
  $('sv-arq').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; lerArquivoServicos(f); });
  $('sv-ler').addEventListener('click', () => { const t = $('sv-txt').value; const l = servicosDasLinhas(lerCSV(t)); usarServicosLidos(l.length ? l : servicosDoTexto(t), 'da lista colada'); });
  $('sv-add').addEventListener('click', () => { estado.servicosEdit.push({ nome: '', valor: '' }); desenharServicos(); const ins = $('sv-lista').querySelectorAll('[data-sv="nome"]'); ins[ins.length - 1]?.focus(); });
  $('sv-salvar').addEventListener('click', () => salvarServicos(siteId));
}
async function salvarServicos(siteId) {
  const itens = []; const ruins = [];
  (estado.servicosEdit || []).forEach((s) => {
    const nome = String(s.nome || '').trim(); let v = String(s.valor ?? '').replace(/r\$|\s/gi, ''); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
    if (!nome && !v) return; const n = Number(v);
    if (!nome || !(n >= 0) || v === '') { ruins.push(nome || '(sem nome)'); return; }
    itens.push({ nome, valor: (Math.round(n * 100) / 100).toFixed(2) });
  });
  if (ruins.length) { $('sv-status').style.color = 'var(--alerta)'; $('sv-status').textContent = `Confira nome e valor de: ${ruins.join(', ')}`; return false; }
  $('sv-status').style.color = 'var(--tx2)'; $('sv-status').textContent = 'Salvando…';
  const { data, error } = await sb.rpc('salvar_servicos', { p_site: siteId, p_itens: itens });
  if (error) { $('sv-status').style.color = 'var(--alerta)'; $('sv-status').textContent = 'Não consegui salvar. Tente de novo.'; return false; }
  if (estado.cacheServicos) delete estado.cacheServicos[siteId];
  $('sv-status').style.color = 'var(--verde-claro)'; $('sv-status').textContent = `✓ ${data} ${data === 1 ? 'serviço salvo' : 'serviços salvos'}`;
  return true;
}

function desenharFunil() {
  const codigos = new Set(estado.eventos.map((e) => e.codigo));
  const opcoesEvento = (atual) => {
    const personalizado = atual && !codigos.has(atual);
    return `<option value="" ${!atual ? 'selected' : ''}>Nenhum (não envia)</option>` +
      estado.eventos.map((e) => `<option value="${esc(e.codigo)}" ${atual === e.codigo ? 'selected' : ''}>${esc(e.nome_pt)} (${esc(e.codigo)})</option>`).join('') +
      `<option value="__personalizado" ${personalizado ? 'selected' : ''}>Evento personalizado…</option>`;
  };
  $('cf-funil').innerHTML = estado.funilEdit.map((e, i) => {
    const cor = COR[e.temperatura] || COR.frio;
    const personalizado = e.evento_meta && !codigos.has(e.evento_meta);
    if (!e._k) e._k = 'k' + Math.random().toString(36).slice(2, 8);
    const nAqui = (estado.contatos || []).filter((c) => e.id && c.etapa_id === e.id).length;
    const pals = String(e.palavras_txt || '').split(',').map((x) => x.trim()).filter(Boolean);
    const EVB = [['', 'Não avisar', '—'], ['Lead', 'Virou interessado', 'Lead'], ['Schedule', 'Agendou', 'Schedule'], ['Purchase', 'Comprou', 'Purchase']];
    const nomeEv = (EVB.find(([k]) => k && k === e.evento_meta) || [])[1] || e.evento_meta;
    const resumo = `${e.evento_meta ? `<span class="selo">Meta: ${esc(nomeEv)}</span>` : '<span class="selo leve">Não avisa a Meta</span>'}${e.valor_padrao ? `<span class="selo leve">R$ ${esc(String(e.valor_padrao))}</span>` : ''}${pals.slice(0, 2).map((p) => `<span class="selo leve">${esc(p)}</span>`).join('')}${pals.length > 2 ? `<span class="selo leve">+${pals.length - 2}</span>` : ''}`;
    return `<div class="etapa-ed fx-card${e._aberto ? ' aberto' : ''}" data-pos="${i}" data-k="${e._k}">
      <div class="fx-cab">
        <span class="arrastar" data-alca="${i}" title="Arraste pra mudar a ordem" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg></span>
        <span class="fx-bola" style="background:${cor.c}"></span>
        <button type="button" class="fx-abrir" data-acao="abrir" data-i="${i}" aria-expanded="${!!e._aberto}"><b>${esc(e.nome || 'Nova etapa')}</b><span class="fx-resumo">${resumo}</span></button>
        <span class="fx-qtd">${nAqui} aqui</span>

function semAcentoJs(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

  const pv = $('cf-funil-previa');

    const qtd = l.map((e) => (estado.contatos || []).filter((c) => { const et = estado.etapas.find((x) => x.id === c.etapa_id); const pos = l.findIndex((y) => y.id && y.id === et?.id); return pos >= l.indexOf(e); }).length);
    pv.innerHTML = `<h3 style="margin:0 0 4px; font-size:15px">Prévia no Resultados</h3><div style="font-size:12px; color:var(--tx3); margin-bottom:10px">atualiza enquanto você edita</div>` + l.map((e, i) => {
      const larg = n > 1 ? 100 - (i * 44) / (n - 1) : 100;
      return `${i ? `<div style="text-align:center; font-size:12px; color:var(--tx3); padding:5px 0">↓ ${qtd[i]} de ${qtd[i - 1]}</div>` : ''}<div style="display:flex; justify-content:center"><div class="etapa-funil" style="width:${larg}%; background:${tons[Math.min(i, tons.length - 1)]}; cursor:default"><span style="font-size:14px; font-weight:600">${esc(e.nome || '…')}</span><span style="font-size:20px; font-weight:600">${qtd[i]}</span></div></div>`;
    }).join('');
  }
}
// nova ordem: redesenha e salva sozinho, avisando na tela
// uma gravação por vez; se mexer de novo enquanto grava, grava a última ordem logo depois
let _arrastandoFunil = false;
let _tSalvarOrdem = null, _funilVersao = 0, _gravandoFunil = false, _regravar = false;
function ordemMudou() {
  _funilVersao++;
  desenharFunil();
  const st = $('cf-funil-status'); if (st) { st.style.color = 'var(--tx2)'; st.textContent = 'Nova ordem… salvando'; }
  clearTimeout(_tSalvarOrdem);
  _tSalvarOrdem = setTimeout(gravarOrdem, 600);
}
async function gravarOrdem() {
  if (_gravandoFunil) { _regravar = true; return; }
  _gravandoFunil = true;
  const v = _funilVersao;
  const ok = await salvarFunil({ silencioso: true, versao: v });
  _gravandoFunil = false;
  if (_regravar || v !== _funilVersao) { _regravar = false; return gravarOrdem(); }
  const st2 = $('cf-funil-status');
  if (ok && st2) { st2.style.color = 'var(--verde-claro)'; st2.textContent = '✓ Ordem salva'; setTimeout(() => { if (st2.textContent === '✓ Ordem salva') st2.textContent = ''; }, 4000); }
}

function confirmarRemocao(etapa) {

  return window.confirm(`${qtd} ${qtd === 1 ? 'contato está' : 'contatos estão'} em "${etapa.nome}". Ao salvar, ${qtd === 1 ? 'ele volta' : 'eles voltam'} pra primeira etapa. Remover mesmo assim?`);
}

async function salvarFunil(op = {}) {
  $('cf-funil-status').textContent = 'Salvando…'; $('cf-funil-status').style.color = 'var(--tx2)';
  const etapas = estado.funilEdit.map((e) => ({
    id: e.id, nome: e.nome, temperatura: e.temperatura, evento_meta: e.evento_meta || null,
    valor_padrao: e.valor_padrao, palavras_chave: String(e.palavras_txt || '').split(',').map((p) => p.trim()).filter(Boolean),
  }));
  const r = await chamarAdmin({ acao: 'salvar_funil', site_id: estado.site, etapas });
  if (!r.ok) { $('cf-funil-status').textContent = r.erro || 'Erro ao salvar.'; $('cf-funil-status').style.color = 'var(--alerta)'; return false; }
  const { data } = await sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem');
  estado.etapas = data || [];
  if (op.silencioso) {
    // só troca pela versão do servidor se ninguém mexeu enquanto gravava (senão a lista "voltava")
    // etapas novas ganharam id no servidor: liga pelo nome pra não criar de novo
    const usados = new Set(estado.funilEdit.filter((e) => e.id).map((e) => e.id));
    estado.funilEdit.filter((e) => !e.id).forEach((e) => { const s2 = estado.etapas.find((x) => !usados.has(x.id) && x.nome === e.nome.trim()); if (s2) { e.id = s2.id; usados.add(s2.id); } });
    if (op.versao === _funilVersao && !_arrastandoFunil) {
      const chaves = Object.fromEntries(estado.funilEdit.filter((e) => e.id).map((e) => [e.id, e._k]));
      estado.funilEdit = estado.etapas.map((e) => ({ ...e, _k: chaves[e.id], palavras_txt: (e.palavras_chave || []).join(', ') }));
      desenharFunil();
    }
    return true;
  }
  const { data: cts } = await sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000);
  estado.contatos = cts || [];
  telaConfig();
  toast('Funil salvo.');
  return true;
}

// ================= SELECT PRÓPRIO (troca o menu nativo, sem azul) =================
function melhorarSelect(sel) {
  if (sel.dataset.enh || sel.multiple || sel.closest('.sel')) return;
  sel.dataset.enh = '1';
  const caixa = document.createElement('div');
  caixa.className = 'sel' + (sel.style.width === 'auto' ? ' auto' : '');
  sel.parentNode.insertBefore(caixa, sel);
  caixa.appendChild(sel);
  sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
  const bt = document.createElement('button');
  bt.type = 'button'; bt.className = 'sel-bt'; bt.setAttribute('aria-haspopup', 'listbox'); bt.setAttribute('aria-expanded', 'false');
  const rotulo = sel.id && document.querySelector(`label[for="${sel.id}"]`);
  const nomeAcess = sel.getAttribute('aria-label') || (rotulo && rotulo.textContent.trim()) || '';
  if (rotulo) { rotulo.addEventListener('click', (ev) => { ev.preventDefault(); bt.focus(); }); }
  caixa.appendChild(bt);
  const lista = document.createElement('ul');
  lista.className = 'sel-lista oculto'; lista.setAttribute('role', 'listbox');
  if (nomeAcess) lista.setAttribute('aria-label', nomeAcess);
  caixa.appendChild(lista);
  let foco = -1;
  const texto = () => {
    const o = sel.options[sel.selectedIndex];
    bt.innerHTML = `<span>${esc(o ? o.textContent : '')}</span>`;
    bt.setAttribute('aria-label', (nomeAcess ? nomeAcess + ': ' : '') + (o ? o.textContent : ''));
    bt.disabled = sel.disabled;
  };
  const montar = () => {
    lista.innerHTML = [...sel.options].map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}">${esc(o.textContent)}</li>`).join('');
  };
  const fechar = () => { caixa.classList.remove('aberto'); lista.classList.add('oculto'); bt.setAttribute('aria-expanded', 'false'); };
  const abrir = () => {
    document.querySelectorAll('.sel.aberto').forEach((x) => x !== caixa && x._fechar && x._fechar());
    montar(); foco = sel.selectedIndex; marcarFoco();
    caixa.classList.add('aberto'); lista.classList.remove('oculto'); bt.setAttribute('aria-expanded', 'true');
  };
  const marcarFoco = () => {
    lista.querySelectorAll('li').forEach((li, i) => li.classList.toggle('foco', i === foco));
    const li = lista.querySelector('li.foco'); if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
  };
  const escolher = (i) => {
    if (i < 0 || i >= sel.options.length) return;
    const mudou = sel.selectedIndex !== i;
    sel.selectedIndex = i; texto(); fechar(); bt.focus();
    if (mudou) sel.dispatchEvent(new Event('change', { bubbles: true }));
  };
  caixa._fechar = fechar;
  bt.addEventListener('click', () => (caixa.classList.contains('aberto') ? fechar() : abrir()));
  lista.addEventListener('mousedown', (ev) => ev.preventDefault());
  lista.addEventListener('click', (ev) => { const li = ev.target.closest('li'); if (li) escolher(Number(li.dataset.i)); });
  bt.addEventListener('keydown', (ev) => {
    const aberto = caixa.classList.contains('aberto');
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!aberto) { abrir(); return; }
      foco = Math.max(0, Math.min(sel.options.length - 1, foco + (ev.key === 'ArrowDown' ? 1 : -1))); marcarFoco();
    } else if ((ev.key === 'Enter' || ev.key === ' ') && aberto) { ev.preventDefault(); escolher(foco); }
    else if (ev.key === 'Escape' && aberto) { ev.preventDefault(); fechar(); }
    else if (ev.key === 'Tab' && aberto) fechar();
  });
  sel.addEventListener('change', texto);
  // quando o código troca as opções ou o valor por fora
  new MutationObserver(texto).observe(sel, { childList: true, subtree: true, attributes: true });
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(sel, 'value', { configurable: true, get() { return desc.get.call(this); }, set(v) { const i = [...this.options].findIndex((op) => op.value === String(v)); if (i >= 0) this.selectedIndex = i; else desc.set.call(this, v); texto(); } });
  texto();
}
document.addEventListener('click', (ev) => { if (!ev.target.closest('.sel')) document.querySelectorAll('.sel.aberto').forEach((x) => x._fechar && x._fechar()); });
document.querySelectorAll('select').forEach(melhorarSelect);
new MutationObserver((muts) => {
  for (const m of muts) m.addedNodes.forEach((n) => {
    if (n.nodeType !== 1) return;
    if (n.tagName === 'SELECT') melhorarSelect(n); else n.querySelectorAll && n.querySelectorAll('select').forEach(melhorarSelect);
  });
}).observe(document.body, { childList: true, subtree: true });


// ================= TEMA (escuro padrão / claro opcional) =================
function aplicarTema(t) {
  if (t === 'claro') document.documentElement.dataset.tema = 'claro'; else delete document.documentElement.dataset.tema;
  const txt = document.getElementById('bt-tema-txt'); if (txt) txt.textContent = t === 'claro' ? 'Tema escuro' : 'Tema claro';
  const bt = document.getElementById('bt-tema'); if (bt) bt.setAttribute('aria-label', t === 'claro' ? 'Mudar pro tema escuro' : 'Mudar pro tema claro');
  try { localStorage.setItem('radar-tema', t); } catch (_) {}
}
aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'claro' : 'escuro');
document.getElementById('bt-tema').addEventListener('click', () => aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro'));

// ================= NAVEGAÇÃO =================
document.querySelectorAll('[data-tela]').forEach((b) => b.addEventListener('click', () => {
  estado.tela = b.dataset.tela;
  if (estado.novoCliente) { estado.novoCliente = false; carregar(); }
  document.querySelectorAll('[data-tela]').forEach((x) => x.classList.toggle('ativo', x === b));
  desenhar();
}));
$('sel-site').addEventListener('change', (e) => { estado.site = e.target.value; estado.aberto = null; estado.novoCliente = false; carregar(); });
$('sel-periodo').addEventListener('change', () => {
  if ($('sel-periodo').value === 'custom' && !$('per-de').value) {
    const hoje = new Date(); const ini = new Date(Date.now() - 29 * 864e5);
    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    $('per-de').value = iso(ini); $('per-ate').value = iso(hoje);
  }
  desenhar();
});
['per-de', 'per-ate'].forEach((id) => $(id).addEventListener('change', desenhar));
document.querySelectorAll('[data-per]').forEach((b) => b.addEventListener('click', () => { $('sel-periodo').value = b.dataset.per; $('sel-periodo').dispatchEvent(new Event('change')); }));
document.querySelectorAll('[data-ic]').forEach((el) => { el.innerHTML = icone(el.dataset.ic, 18); });
$('bt-atualizar').innerHTML = icone('atualizar', 18); $('bt-sair').innerHTML = icone('sair', 16);
$('quem-av').addEventListener('click', () => $('quem-arq').click());
$('quem-arq').addEventListener('change', async (ev) => {
  const f = ev.target.files[0]; ev.target.value = ''; const path = await enviarFoto(f, 'perfil');
  if (path && estado.perfil) { estado.perfil.foto_path = path; $('quem-av').innerHTML = fotoHTML(path, estado.perfil.nome, 34) + '<span class="eu-cam" aria-hidden="true">' + icone('camera', 10) + '</span>'; toast('Sua foto foi atualizada'); }
});
$('bt-atualizar').addEventListener('click', carregar);
setInterval(() => { if (!document.hidden && estado.perfil && !['config', 'links', 'conversas', 'modelos', 'rotina'].includes(estado.tela)) carregar(); }, 30000);

iniciar();
