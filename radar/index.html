<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Radar</title>
<script>try { if (localStorage.getItem('radar-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (_) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #050607; --card: rgba(20, 22, 26, 0.65); --card-solido: #121417; --side: rgba(12, 14, 16, 0.78);
    --line: rgba(255, 255, 255, 0.09); --line2: rgba(255, 255, 255, 0.06);
    --tx: #F4F6F5; --tx2: #A6B0AA; --tx3: #85908A;
    --verde: #10B981; --verde-claro: #34D399; --verde-bg: rgba(16, 185, 129, 0.12); --verde-bd: rgba(16, 185, 129, 0.38);
    --frio: #8FB3A1; --frio-bg: rgba(143, 179, 161, 0.10); --frio-bd: rgba(143, 179, 161, 0.30);
    --morno: #34D399; --morno-bg: rgba(52, 211, 153, 0.12); --morno-bd: rgba(52, 211, 153, 0.38);
    --quente: #A7F3D0; --quente-bg: rgba(16, 185, 129, 0.26); --quente-bd: rgba(110, 231, 183, 0.65);
    --alerta: #F3F6F4; --alerta-bg: rgba(255, 255, 255, 0.08); --alerta-bd: rgba(255, 255, 255, 0.35);
    --campo: rgba(255, 255, 255, 0.04); --campo-bd: rgba(255, 255, 255, 0.13);
    --bolha-saida: rgba(16, 185, 129, 0.16); --bolha-entrada: rgba(255, 255, 255, 0.06);
    --vidro: blur(14px);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--tx); font-family: 'Geist', system-ui, sans-serif; font-size: 14px; min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(16, 185, 129, 0.10), transparent 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(16, 185, 129, 0.07), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1, h2, .num, .logo span { font-family: 'Geist', system-ui, sans-serif; letter-spacing: -0.025em; }
  .num, table, .tab { font-variant-numeric: tabular-nums; }
  code, .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  button, input, select, textarea { font: inherit; }
  ::selection { background: #10B981; color: #050807; }
  input, textarea, select { accent-color: #10B981; }
  .oculto { display: none !important; }
  a { color: var(--verde-claro); }

  /* foco: verde, nunca azul */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--verde-claro); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, .sel-bt:focus-visible {
    outline: none; border-color: #10B981 !important; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22);
  }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.45); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-ic { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, #34D399, #059669); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(16,185,129,.35); }
  .logo-ic svg { stroke: #04130C; }
  .logo span { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; }
  .logo span::after { content: '.'; color: var(--verde); }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--tx2); }
  input[type=email], input[type=password], input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; background: var(--campo); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 11px 13px; color: var(--tx);
  }
  input::placeholder, textarea::placeholder { color: #6E7973; }
  option { background: #121417; color: var(--tx); }
  .btn { background: var(--verde); color: #04130C; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; min-height: 44px; box-shadow: 0 0 0 1px rgba(52,211,153,.35), 0 8px 24px rgba(16,185,129,.18); }
  .btn:hover { background: var(--verde-claro); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-sec { background: rgba(255,255,255,.04); color: var(--tx); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .btn-sec:hover { border-color: var(--verde-bd); background: var(--verde-bg); }
  .btn-sec:disabled { opacity: .45; cursor: default; }
  .erro { color: var(--alerta); font-weight: 600; font-size: 13px; min-height: 18px; }

  /* app */
  #app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 248px; background: var(--side); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; }
  nav .menu { display: flex; flex-direction: column; gap: 4px; }
  nav .menu button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--tx2); font-weight: 500; cursor: pointer; text-align: left; }
  nav .menu button:hover { color: var(--tx); background: rgba(255,255,255,.04); }
  nav .menu button.ativo { background: var(--verde-bg); border-color: var(--verde-bd); color: var(--verde-claro); font-weight: 700; }
  nav .rodape { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--tx2); }
  main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; }
  .topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .topo h1 { margin: 0; font-size: 28px; }
  .topo p { margin: 4px 0 0; color: var(--tx2); }
  .card { background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .card h2 { margin: 0 0 14px; font-size: 17px; }
  .linha { display: flex; flex-wrap: wrap; gap: 16px; }
  .kpi { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(52, 211, 153, 0.45); }
  .kpi .rot { color: var(--tx2); font-size: 13px; }
  .kpi .num { font-size: 32px; font-weight: 700; }
  .kpi .obs { color: var(--tx3); font-size: 12px; }
  .vazio { color: var(--tx3); padding: 18px 0; }

  /* select próprio (sem o azul do navegador) */
  .sel { position: relative; width: 100%; }
  .sel.auto { width: auto; }
  .sel > select { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
  .sel-bt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--campo); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 11px 13px; color: var(--tx); cursor: pointer; text-align: left; }
  .sel-bt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-bt::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--verde-claro); border-bottom: 2px solid var(--verde-claro); transform: rotate(45deg) translateY(-3px); flex-shrink: 0; }
  .sel.aberto .sel-bt { border-color: #10B981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22); }
  .sel-lista { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); min-width: 180px; max-height: 280px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: rgba(14, 16, 19, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .sel-lista li { padding: 9px 11px; border-radius: 8px; cursor: pointer; color: var(--tx); }
  .sel-lista li[aria-selected="true"] { background: rgba(16, 185, 129, 0.16); color: var(--verde-claro); font-weight: 600; }
  .sel-lista li.foco, .sel-lista li:hover { background: rgba(16, 185, 129, 0.10); }

  /* funil */
  .funil-linha { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .funil-nome { width: 160px; flex-shrink: 0; display: flex; flex-direction: column; }
  .funil-nome b { font-size: 14px; } .funil-nome small { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .funil-trilho { flex: 1; min-width: 0; background: rgba(255,255,255,.03); border-radius: 10px; height: 44px; display: flex; justify-content: center; }
  .funil-barra { height: 44px; border-radius: 10px; border: 1px solid; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 90px; }
  .funil-barra .num { font-size: 20px; font-weight: 700; }
  .barra-origem { margin-bottom: 12px; }
  .barra-origem .t { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .barra-origem .tr { height: 8px; border-radius: 4px; background: var(--line2); }
  .barra-origem .f { height: 8px; border-radius: 4px; }
  .arrastar { cursor: grab; color: var(--tx3); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; user-select: none; }
  .arrastar:hover { color: var(--verde-claro); background: var(--verde-bg); }
  .etapa-ed.arrastando { opacity: .5; }
  .etapa-ed.alvo { outline: 2px dashed var(--verde-claro); outline-offset: 3px; }

  /* conversas */
  .conv { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .conv-lista { flex: 1 1 260px; max-width: 330px; padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
  .conv-lista .busca { padding: 12px; border-bottom: 1px solid var(--line); }
  .conv-lista .itens { overflow-y: auto; }
  .conv-item { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line2); padding: 12px 14px; cursor: pointer; color: inherit; }
  .conv-item:hover { background: rgba(255,255,255,.03); }
  .conv-item.ativo { background: var(--verde-bg); box-shadow: inset 3px 0 0 var(--verde); }
  .av { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .conv-item .meio { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .conv-item .nome { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .conv-item .nome small { color: var(--tx3); font-weight: 400; font-size: 11px; }
  .conv-item .orig { font-size: 11px; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
  .bol { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chat { flex: 2 1 380px; min-width: 0; padding: 0; display: flex; flex-direction: column; max-height: 76vh; }
  .chat-topo { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-msgs { padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .bolha { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
  .bolha small { display: block; font-size: 10.5px; color: var(--tx3); text-align: right; margin-top: 4px; }
  .bolha.entrada { align-self: flex-start; background: var(--bolha-entrada); border-bottom-left-radius: 4px; }
  .bolha.saida { align-self: flex-end; background: var(--bolha-saida); border-color: rgba(16,185,129,.28); border-bottom-right-radius: 4px; }
  .bolha.saida small b { color: var(--verde-claro); font-weight: 600; }
  .tarefa { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--line2); }
  .tarefa .info { flex: 1 1 240px; min-width: 0; }
  .tarefa .info b { display: block; }
  .tarefa .info small { color: var(--tx3); font-size: 12px; }
  .tarefa .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .tarefa .acoes button { padding: 7px 10px; font-size: 13px; min-height: 36px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
  .barra { height: 10px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; }
  .barra > div { height: 100%; background: linear-gradient(90deg, #059669, #34D399); border-radius: 999px; box-shadow: 0 0 12px rgba(52,211,153,.5); }
  dialog.modal { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(520px, 94vw); background: rgba(16, 18, 21, 0.96); color: var(--tx); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  dialog.modal::backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
  .modal .corpo { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .previa { white-space: pre-wrap; background: var(--bolha-saida); border: 1px solid rgba(16,185,129,.28); border-radius: 12px; padding: 10px 12px; }
  .creditos { margin: 4px 0 0; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); font-size: 12px; color: var(--tx3); display: flex; flex-direction: column; gap: 6px; }
  .creditos .cab { display: flex; justify-content: space-between; align-items: center; color: var(--tx2); font-size: 13px; }
  .creditos .cab span { font-size: 11px; font-weight: 700; color: var(--verde-claro); background: var(--verde-bg); border: 1px solid var(--verde-bd); border-radius: 999px; padding: 2px 8px; }
  .creditos .val { font-family: 'Geist', sans-serif; font-variant-numeric: tabular-nums; color: var(--tx3); }
  .creditos .val b { font-size: 22px; color: var(--verde-claro); letter-spacing: -0.025em; }
  .creditos.baixo .val b { color: var(--alerta); }
  .creditos.baixo .cab span { color: var(--alerta); background: var(--alerta-bg); border-color: var(--alerta-bd); }
  .creditos.baixo .barra > div { background: var(--alerta); box-shadow: none; }
  .responder { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
  .responder { flex-wrap: wrap; }
  .responder textarea { flex: 1 1 100%; order: -1; resize: none; min-height: 42px; max-height: 140px; }
  .responder #resp-enviar { margin-left: auto; }
  .detalhe { flex: 1 1 280px; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .dl { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line2); }
  .dl span:first-child { color: var(--tx3); } .dl span:last-child { text-align: right; word-break: break-word; }
  .etapas-bt { display: flex; flex-wrap: wrap; gap: 8px; }
  .etapas-bt button { border: 1px solid; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .hist { font-size: 12px; color: var(--tx2); display: flex; flex-direction: column; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 4px 10px; }
  pre, .codigo { background: #050507 !important; color: #A7F3D0 !important; border: 1px solid var(--line) !important; }

  /* crm */
  .crm { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .col { flex: 1 1 250px; min-width: 0; min-height: 180px; transition: outline-color .15s; background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .col-topo { border: 1px solid; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .col-topo b { display: block; } .col-topo small { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .col-topo .num { font-size: 22px; font-weight: 700; }
  .ccard { background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .ccard .n { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .ccard .n small { color: var(--tx3); font-weight: 400; }
  .ccard .o { font-size: 12px; color: var(--tx2); }
  .ccard .sel-bt, .ccard select { padding: 7px 10px; font-size: 13px; }
  .card:has(.sel-lista:not(.oculto)), .linha:has(.sel-lista:not(.oculto)) { position: relative; z-index: 45; }
  .origem-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .origem-tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .origem-tile .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx2); }
  .origem-tile .t i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .origem-tile b { font-size: 24px; letter-spacing: -0.02em; } .origem-tile small { color: var(--tx3); font-size: 12px; }
  .visao { display: flex; flex-direction: column; gap: 10px; }
  .visao .item { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .visao .item .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--verde-bg); color: var(--verde-claro); display: flex; align-items: center; justify-content: center; }
  .visao .item b { font-size: 22px; display: block; } .visao .item span { font-size: 12px; color: var(--tx2); }
  .grafico { position: relative; }
  .grafico svg { width: 100%; height: 240px; display: block; overflow: visible; }
  .grafico .dica { position: absolute; pointer-events: none; background: var(--card-solido, rgba(16,18,21,.97)); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35); white-space: nowrap; z-index: 5; }
  html[data-tema="claro"] .grafico .dica { background: #fff; }
  .legenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--tx2); margin-top: 8px; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; } .legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chave { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .chave button { background: transparent; border: 0; color: var(--tx2); font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .chave button[aria-pressed="true"] { background: var(--verde-bg); color: var(--verde-claro); font-weight: 700; }
  .fid-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .fid-grade > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .fid-grade b { font-size: 24px; line-height: 1.2; } .fid-grade span { font-size: 13px; color: var(--tx2); } .fid-grade small { font-size: 12px; color: var(--tx3); }
  #cf-funil.ordenando .etapa-ed > :not(:first-child) { display: none; }
  #cf-funil.ordenando .etapa-ed { padding: 10px 12px !important; }
  #cf-funil.ordenando .etapa-ed button { display: none; }
  .voando-etapa > :not(:first-child) { display: none; }
  .voando-etapa button { display: none; }
  .vis-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .vis-resumo > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
  .vis-resumo b { font-size: 16px; } .vis-resumo span { font-size: 11px; color: var(--tx3); }
  .vis-lista { display: flex; flex-direction: column; margin-top: 8px; max-height: 260px; overflow-y: auto; }
  .vis-item { display: grid; grid-template-columns: 78px 1fr; gap: 2px 10px; font-size: 13px; padding: 8px 0; border-top: 1px solid var(--line2); align-items: center; }
  .vis-item .vis-data { grid-row: span 2; color: var(--tx2); }
  .vis-acoes { display: flex; gap: 6px; justify-content: flex-start; grid-column: 2; }
  .btn-sec.mini { padding: 3px 10px; min-height: 28px; font-size: 12px; }
  .etapa-funil { border: 0; border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #04130C; font: inherit; cursor: pointer; text-align: left; transition: transform .15s, box-shadow .15s; }
  .etapa-funil:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16,185,129,.25); }
  .etapa-funil.aberta { box-shadow: 0 0 0 2px var(--verde-claro); }
  .etapa-funil .seta { font-size: 14px; opacity: .7; }

  /* ===== Fase 1 · base visual nova ===== */
  :root { --solido: #0D1012; --solido-2: #111417; --mono: 'Geist Mono', ui-monospace, monospace; }
  html[data-tema="claro"] { --solido: #FFFFFF; --solido-2: #F7FAF8; }
  html { -webkit-tap-highlight-color: transparent; scrollbar-color: rgba(255,255,255,.16) transparent; scrollbar-width: thin; }
  html[data-tema="claro"] { scrollbar-color: rgba(15,26,19,.2) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(52,211,153,.45); }
  /* preenchimento automático do Chrome sem amarelo/azul */
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, textarea:-webkit-autofill, select:-webkit-autofill {
    -webkit-text-fill-color: var(--tx); caret-color: var(--tx);
    -webkit-box-shadow: 0 0 0 1000px var(--solido) inset; box-shadow: 0 0 0 1000px var(--solido) inset;
    transition: background-color 9999s ease-out 0s;
  }
  input[type=date]::-webkit-calendar-picker-indicator, input[type=time]::-webkit-calendar-picker-indicator, input[type=datetime-local]::-webkit-calendar-picker-indicator { filter: invert(72%) sepia(39%) saturate(530%) hue-rotate(104deg) brightness(95%); cursor: pointer; opacity: .9; }
  html[data-tema="claro"] input::-webkit-calendar-picker-indicator { filter: none; }
  input[type=checkbox], input[type=radio], input[type=range], progress { accent-color: #10B981; }
  [draggable="true"] { -webkit-user-drag: element; }
  /* números, códigos e valores */
  .kpi .num, .num, .col-topo .num, .creditos .val, .fid-grade b, .vis-resumo b, .origem-tile b, .visao .item b, .etapa-funil span[style*="font-size:24px"] { font-family: 'Geist', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
  code, .mono, pre, .codigo, input[type=number], .conv-item .nome small, .bolha small { font-variant-numeric: tabular-nums; }
  code, .mono, pre, .codigo { font-family: var(--mono); }
  /* vidro calibrado: sólido onde se lê muito, vidro nos destaques */
  .card { background: var(--solido); backdrop-filter: none; -webkit-backdrop-filter: none; border-color: rgba(255,255,255,.07); box-shadow: none; }
  #tela-dashboard > .card, #tela-dashboard .linha > .card, .detalhe, .vidro, .login-box {
    background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-color: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 20px 60px rgba(0,0,0,.28);
  }
  .ccard { background: var(--solido-2); backdrop-filter: none; -webkit-backdrop-filter: none; }
  dialog.modal { background: rgba(14,16,19,.88); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 30px 80px rgba(0,0,0,.6); }
  .topo { border-bottom: 1px solid rgba(255,255,255,.07); }
  .topo h1 { font-weight: 700; letter-spacing: -0.025em; }
  html[data-tema="claro"] .card, html[data-tema="claro"] .ccard { border-color: var(--line); }
  html[data-tema="claro"] dialog.modal { background: rgba(255,255,255,.96); }
  /* transições discretas */
  .btn, .btn-sec, nav .menu button, .conv-item, .etapa-funil, .abas button, .chave button { transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s, transform .15s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }


  /* ===== Fase 2 · componentes ===== */

function icone(nome, tam = 14) { return `<span class="ic" style="width:${tam}px; height:${tam}px" aria-hidden="true">${IC[nome] || IC.outro}</span>`; }

function icLugar(l) { const t = (l || '').toLowerCase(); return t.includes('insta') ? 'instagram' : t.includes('face') ? 'facebook' : t.includes('google') ? 'google' : null; }

function toast(msg) {

  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('oculto'), 3500);

function quando(iso) {

  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })

}

  return d.length >= 10 ? `(${d.slice(0, 2)}) ${d.slice(2, -4)}-${d.slice(-4)}` : t;
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

// ================= LOGIN =================
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('bt-entrar').disabled = true; $('erro-login').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
  $('bt-entrar').disabled = false;
  if (error) { $('erro-login').textContent = 'E-mail ou senha incorretos.'; return; }
  iniciar();
});
$('bt-sair').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!perfil) {
    $('login').classList.remove('oculto');
    $('erro-login').textContent = 'Seu usuário ainda não tem acesso ao Radar. Fale com o Jota.';
    await sb.auth.signOut(); return;
  }
  estado.perfil = perfil;
  $('quem').textContent = perfil.papel === 'admin' ? 'Administrador' : 'Cliente';
  $('quem-nome').textContent = perfil.nome || '';
  $('quem-av').innerHTML = fotoHTML(perfil.foto_path, perfil.nome, 34) + '<span class="eu-cam" aria-hidden="true">' + icone('camera', 10) + '</span>';

  const { data: sites } = await sb.from('sites').select('id, nome, logo_path, pixel_id, allowed_origins, whatsapp_phone_number_id, whatsapp_waba_id, whatsapp_conectado_em, creditos_mensal, rotina_followup_dias, rotina_reativacao_dias, auto_lembrete, lembrete_horas, lembrete_modelo, auto_followup, followup_modelo, auto_reativacao, reativacao_modelo').eq('ativo', true).order('nome');
  estado.sites = sites || [];
  const sel = $('sel-site');
  sel.innerHTML = (sites || []).map((s) => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  if (perfil.papel !== 'admin') $('bloco-cliente').classList.add('oculto');
  else $('menu-config').classList.remove('oculto');
  estado.site = perfil.papel === 'admin' ? (sites?.[0]?.id ?? null) : perfil.site_id;
  sel.value = estado.site || '';

  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  await carregar();
}

// ================= FOTOS (logo do cliente e foto do usuário) =================
function fotoURL(path) { return `${SUPABASE_URL}/storage/v1/object/public/fotos/${path}`; }
function iniciais(nome) { const p = String(nome || '?').trim().split(/\s+/).filter((x) => !/^(de|da|do|dos|das|e)$/i.test(x)); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); }
function fotoHTML(path, nome, tam) {
  return path ? `<img src="${esc(fotoURL(path))}" alt="" width="${tam}" height="${tam}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit">`
    : `<span style="font-size:${Math.round(tam * 0.36)}px">${esc(iniciais(nome))}</span>`;
}
async function quadradaJPG(f) {
  const img = await createImageBitmap(f);
  const lado = Math.min(img.width, img.height); const t = Math.min(512, lado);
  const cv = document.createElement('canvas'); cv.width = t; cv.height = t;
  cv.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, t, t);
  return await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.88));
}
async function enviarFoto(f, tipo, siteId) {
  if (!f) return null;
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('Use uma imagem JPG, PNG ou WEBP.'); return null; }
  let blob; try { blob = await quadradaJPG(f); } catch (_) { toast('Não consegui ler essa imagem.'); return null; }
  const { data: { session } } = await sb.auth.getSession();
  const path = tipo === 'site' ? `site/${siteId}/logo-${Date.now()}.jpg` : `u/${session.user.id}/foto-${Date.now()}.jpg`;
  const up = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (up.error) { toast('Não salvou a imagem: ' + up.error.message); return null; }
  const { error } = await sb.rpc('salvar_foto', { p_tipo: tipo, p_site: siteId || null, p_path: path });
  if (error) { toast('Não salvou a imagem: ' + error.message); return null; }
  return path;
}
function mostrarLogoTopo() {
  const el = $('topo-logo'); if (!el) return;
  const site = (estado.sites || []).find((x) => x.id === estado.site);
  el.innerHTML = site ? fotoHTML(site.logo_path, site.nome, 44) : '';
  el.classList.toggle('oculto', !site);
}

// ================= DADOS =================
async function carregar() {
  if (estado.novoCliente) { desenhar(); return; }
  if (!estado.site) { $('tela-dashboard').innerHTML = '<div class="card vazio">Nenhum cliente cadastrado ainda.</div>'; return; }
  const nomeSite = $('sel-site').selectedOptions[0]?.textContent ?? '';
  $('subtitulo').textContent = nomeSite;
  mostrarLogoTopo();

  const [{ data: etapas }, { data: contatos }] = await Promise.all([
    sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem'),
    sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000),
  ]);
  estado.etapas = etapas || [];
  estado.contatos = contatos || [];
  const { data: links } = await sb.from('links').select('*').eq('site_id', estado.site).order('criado_em', { ascending: false });
  estado.links = links || [];

// importar a lista de clientes do mês (CSV, Excel ou colado)
function lerCSV(txt) {
  const sep = (txt.split('\n')[0].match(/;/g) || []).length > (txt.split('\n')[0].match(/,/g) || []).length ? ';' : (txt.includes('\t') ? '\t' : ',');
  const linhas = []; let lin = [], campo = '', aspas = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (aspas) { if (ch === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (ch === '"') aspas = false; else campo += ch; continue; }
    if (ch === '"') aspas = true; else if (ch === sep) { lin.push(campo); campo = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; lin.push(campo); linhas.push(lin); lin = []; campo = ''; }
    else campo += ch;
  }
  if (campo || lin.length) { lin.push(campo); linhas.push(lin); }
  return linhas.filter((l) => l.some((x) => String(x).trim()));
}

  return {
    telefone: achar(/tel|cel|fone|whats|contato/, (v) => v.replace(/\D/g, '').length >= 10 && v.replace(/\D/g, '').length <= 13),
    data: achar(/data|dia|atendid|agend/, (v) => /^\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}/.test(v)),
    valor: achar(/valor|total|preco|pago|r\$/, (v) => /^r?\$?\s?\d+([.,]\d{2})?$/i.test(v.trim())),
    nome: achar(/nome|cliente/),
    servico: achar(/servi|procedimento|produto/),
  };
}

async function tempoResposta(lista) {
  const el = $('tm-resp'); if (!el) return;
  const ids = lista.map((c) => c.id); if (!ids.length) { el.textContent = '—'; return; }
  const msgs = [];
  for (let i = 0; i < ids.length; i += 150) {
    const { data } = await sb.from('mensagens').select('contato_id, direcao, criado_em').in('contato_id', ids.slice(i, i + 150)).order('criado_em').limit(5000);
    msgs.push(...(data || []));
  }
  const por = {}; msgs.forEach((m) => { (por[m.contato_id] = por[m.contato_id] || []).push(m); });
  const qual = telaDashboard._segunda ? 1 : 0; const tempos = [];
  Object.values(por).forEach((ms) => {
    ms.sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
    const i0 = ms.findIndex((m) => m.direcao === 'entrada'); if (i0 < 0) return;
    const resp = ms.slice(i0 + 1).filter((m) => m.direcao === 'saida')[qual];
    if (resp) tempos.push(new Date(resp.criado_em) - new Date(ms[i0].criado_em));
  });
  if (!$('tm-resp')) return;
  $('tm-resp').textContent = tempos.length ? duracao(tempos.reduce((a, b) => a + b, 0) / tempos.length) : '—';
  $('tm-resp').title = `${tempos.length} ${tempos.length === 1 ? 'conversa respondida' : 'conversas respondidas'}`;
}

function etapaVenda() { const e = estado.etapas; return e.find((x) => x.evento_meta === 'Purchase') || e[e.length - 1] || null; }
async function carregarVendas() {

    .filter((v) => dentro(porVenda ? v.venda : v.c.criado_em))
    .sort((a, b) => new Date(b.venda) - new Date(a.venda));
  const valor = Number(ev.valor_padrao) || 0;
  const dt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  box.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px">
      <h2 style="margin:0">${esc(ev.nome)} (${vendas.length})${valor ? ` <small style="color:var(--tx2); font-weight:500">· R$ ${(valor * vendas.length).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</small>` : ''}</h2>

function filtroConv() { return telaConversas._f || (telaConversas._f = { per: 'tudo', de: '', ate: '', origem: '', link: '', camp: '', criativo: '', etapa: '' }); }
function noPeriodoConv(c, f) {
  if (f.per === 'tudo') return true;
  const t = new Date(c.ultima_msg_em || c.atualizado_em || c.criado_em).getTime();
  const agora = new Date(); const ini0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); };
  if (f.per === 'hoje') return t >= ini0(agora);
  if (f.per === 'mes') return t >= new Date(agora.getFullYear(), agora.getMonth(), 1).getTime();
  if (f.per === 'custom') return (!f.de || t >= new Date(f.de + 'T00:00:00').getTime()) && (!f.ate || t <= new Date(f.ate + 'T23:59:59').getTime());
  return t >= Date.now() - Number(f.per) * 864e5;
}
function listaConversas(base) {
  const busca = (telaConversas._busca || '').toLowerCase();

    if (busca && !((c.nome || '').toLowerCase().includes(busca) || c.telefone.includes(busca.replace(/\D/g, '') || busca))) return false;
    if (!noPeriodoConv(c, f)) return false;
    const tqs = toquesDe(c);
    if (f.origem && grupoDe(c).k !== f.origem && !tqs.some((t) => grupoToque(t).k === f.origem)) return false;
    if (f.link && c.link_id !== Number(f.link) && !tqs.some((t) => t.link_id === Number(f.link))) return false;
    if (f.camp && (c.campanha || '') !== f.camp) return false;
    if (f.criativo && (c.anuncio_titulo || '') !== f.criativo && !tqs.some((t) => (t.anuncio_titulo || '') === f.criativo)) return false;
    if (f.etapa && c.etapa_id !== Number(f.etapa)) return false;
    return true;
  }).sort((a, b) => (esperando(b) - esperando(a)) || (new Date(b.ultima_msg_em || b.atualizado_em) - new Date(a.ultima_msg_em || a.atualizado_em)));

const POR_PAGINA = 50;
function comMarcadores(msgs, c) {
  const tqs = toquesDe(c).slice().reverse().filter((t) => Math.abs(new Date(t.criado_em) - new Date(c.criado_em)) >= 120000);
  let i = 0; let out = '';
  const marca = (t) => `<div class="marcador-toque">${logoGrupo(grupoToque(t), 18)}<span>${new Date(t.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} · ${t.da_base ? 'cliente da base voltou' : 'voltou'} por <b>${esc(descToque(t))}</b></span></div>`;
  for (const m of msgs) {
    while (i < tqs.length && new Date(tqs[i].criado_em) <= new Date(m.criado_em)) { if (msgs[0] && new Date(tqs[i].criado_em) >= new Date(msgs[0].criado_em)) out += marca(tqs[i]); i++; }
    out += bolhaHTML(m);
  }
  return out;
}
function bolhaHTML(m) {
  const quando = new Date(m.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const rotulo = m.direcao === 'entrada' ? 'Recebido · grátis'
    : m.tipo === 'template' ? '<b>Modelo enviado pelo Radar</b>'
    : m.tipo === 'celular' ? 'Respondido pelo celular · grátis'
    : '<b>Enviado pelo Radar</b> · 1 crédito';
  const midia = m.midia_path ? `<div class="midia" data-path="${esc(m.midia_path)}" data-mime="${esc(m.midia_mime || '')}" data-nome="${esc(m.midia_nome || '')}"><span style="font-size:12px; color:var(--tx3)">Carregando ${rotuloMidia(m)}…</span></div>` : '';
  const txt = m.texto ? esc(m.texto) : (m.midia_path ? '' : esc('[' + rotuloMidia(m) + ']'));
  return `<div class="bolha ${m.direcao}" data-msg="${m.id}">${midia}${txt}<small>${quando} · ${rotulo}</small></div>`;
}
function rotuloMidia(m) { return { image: 'foto', video: 'vídeo', audio: 'áudio', document: 'arquivo', sticker: 'figurinha' }[m.tipo] || m.tipo || 'mídia'; }
const _urlMidia = {};
async function carregarMidias() {
  const pend = [...document.querySelectorAll('.midia[data-path]:not([data-ok])')];
  if (!pend.length) return;
  pend.forEach((el) => el.setAttribute('data-ok', '1'));
  const faltam = [...new Set(pend.map((el) => el.dataset.path).filter((x) => !_urlMidia[x]))];
  if (faltam.length) {
    const { data } = await sb.storage.from('midia').createSignedUrls(faltam, 3600);
    (data || []).forEach((x) => { if (x.signedUrl) _urlMidia[x.path] = x.signedUrl; });
  }
  pend.forEach((el) => {
    const url = _urlMidia[el.dataset.path]; const mime = el.dataset.mime || '';
    if (!url) { el.innerHTML = '<span style="font-size:12px; color:var(--tx3)">Arquivo indisponível</span>'; return; }
    if (mime.startsWith('image/')) el.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Foto da conversa" loading="lazy"></a>`;
    else if (mime.startsWith('video/')) el.innerHTML = `<video src="${url}" controls preload="metadata"></video>`;
    else if (mime.startsWith('audio/')) el.innerHTML = `<audio src="${url}" controls preload="metadata"></audio>`;
    else el.innerHTML = `<a href="${url}" target="_blank" rel="noopener">📄 ${esc(el.dataset.nome || 'Abrir arquivo')}</a>`;
  });
}

async function abrirConversa(id, semMarcar) {

// ---------- jornada do lead (linha do tempo) ----------
function eventosJornada(c, hist, primEnt, primSai, vis) {
  const ev = [];
  const g = grupoDe(c);
  const meta = (t) => `<span class="jr-meta">${icone('ok', 12)} ${esc(t)}</span>`;
  const deOnde = [c.anuncio_titulo, c.campanha].filter(Boolean).map(esc).join(' · ');
  ev.push({ t: c.criado_em, tipo: 'origem', g, tit: `Chegou por ${g.nome}`, desc: deOnde || (c.lugar ? esc(c.lugar) : '') });
  if (primEnt) ev.push({ t: primEnt.criado_em, tipo: 'msg', tit: 'Primeira mensagem', desc: primEnt.texto ? `“${esc(String(primEnt.texto).slice(0, 120))}”` : esc('[' + (primEnt.tipo || 'mídia') + ']') });
  if (primEnt && primSai && new Date(primSai.criado_em) >= new Date(primEnt.criado_em)) {
    ev.push({ t: primSai.criado_em, tipo: 'msg', tit: `Respondido em ${duracaoCurta(new Date(primSai.criado_em) - new Date(primEnt.criado_em))}`, desc: '' });
  }
  toquesDe(c).forEach((t) => { if (Math.abs(new Date(t.criado_em) - new Date(c.criado_em)) < 120000) return; ev.push({ t: t.criado_em, tipo: 'origem', g: grupoToque(t), tit: `Voltou por ${descToque(t)}`, desc: t.da_base ? 'Já era cliente da base' : '' }); });
  hist.filter((h) => h.motivo !== 'novo contato').forEach((h) => { const e = estado.etapas.find((x) => x.id === h.etapa_id); ev.push({ t: h.criado_em, tipo: 'etapa', tit: `Etapa: ${esc(e?.nome ?? '—')}`, desc: esc(h.motivo || ''), extra: h.enviado_meta ? meta(`${e?.evento_meta || 'Evento'} enviado à Meta`) : '' }); });
  if (c.lembrete_enviado_em) ev.push({ t: c.lembrete_enviado_em, tipo: 'msg', tit: 'Lembrete automático', desc: '' });
  vis.forEach((v) => {
    const t = (v.data ? v.data + 'T12:00:00' : v.criado_em);
    if (v.status === 'veio') ev.push({ t, tipo: 'ok', dia: true, tit: `Veio${v.valor != null ? ' · ' + brl(v.valor) : ''}`, desc: esc(v.servico || ''), extra: v.meta_enviado ? meta('Purchase enviado à Meta') : '' });
    else if (v.status === 'faltou') ev.push({ t, tipo: 'falta', dia: true, tit: 'Faltou', desc: esc(v.servico || '') });
    else ev.push({ t, tipo: 'agenda', dia: true, tit: 'Horário agendado', desc: esc(v.servico || '') });
  });
  const ordem = { origem: 0, msg: 1 };
  return ev.sort((a, b) => (new Date(a.t) - new Date(b.t)) || ((ordem[a.tipo] ?? 2) - (ordem[b.tipo] ?? 2)));
}
function jornadaLista(ev) {
  const fmt = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' ·');
  const bola = (e) => {
    if (e.tipo === 'origem') return `<span class="jr-dot" style="background:${e.g.fundo}; color:${e.g.cor}; ${e.g.borda ? 'border:1px solid var(--line);' : ''}">${icone(e.g.ic, 14)}</span>`;
    if (e.tipo === 'ok') return `<span class="jr-dot ok">${icone('ok', 14)}</span>`;
    if (e.tipo === 'msg') return `<span class="jr-dot msg">${icone('whatsapp', 13)}</span>`;
    if (e.tipo === 'falta') return `<span class="jr-dot falta">✕</span>`;
    return `<span class="jr-dot etapa">${icone('seta', 12)}</span>`;
  };
  return `<ol class="jornada">${ev.map((e) => `<li>${bola(e)}<div class="jr-corpo"><div class="jr-cab"><b>${e.tit}</b><span class="jr-hora">${e.dia ? new Date(e.t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : fmt(e.t)}</span></div>${e.desc ? `<div class="jr-desc">${e.desc}</div>` : ''}${e.extra || ''}</div></li>`).join('')}</ol>`;
}
function jornadaHTML(ev, tudo) {
  if (tudo || ev.length <= 8) return jornadaLista(ev) + (ev.length > 8 ? '<button class="btn-sec" data-jornada="resumo" type="button" style="width:100%; margin-top:12px">Mostrar resumo</button>' : '');
  const inicio = ev.slice(0, 3), fim = ev.slice(-4), meio = ev.length - 7;
  return `<div class="jr-rot">Como chegou</div>${jornadaLista(inicio)}
    <div class="jr-meio"><span></span>${meio} ${meio === 1 ? 'evento' : 'eventos'} no meio<span></span></div>
    <div class="jr-rot">Mais recentes</div>${jornadaLista(fim)}
    <button class="btn-sec" data-jornada="tudo" type="button" style="width:100%; margin-top:12px">Ver jornada completa · ${ev.length} eventos</button>`;
}
function duracaoCurta(ms) {
  const min = Math.max(0, Math.round(ms / 60000));
  if (min < 60) return `${min} min`;
  if (min < 1440) return `${Math.floor(min / 60)}h ${String(min % 60).padStart(2, '0')}min`;
  const d = Math.floor(min / 1440); return `${d} ${d === 1 ? 'dia' : 'dias'}`;
}
// ---------- toques (chegou ou voltou por anúncio/link) ----------
function toquesDe(c) { return (estado.toques || []).filter((t) => t.contato_id === c.id).sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em)); }
function toqueBase(c) { return toquesDe(c).find((t) => t.da_base) || null; }
function grupoToque(t) { return GRUPOS.find((g) => g.k === (t.tipo === 'anuncio' ? 'anuncio_meta' : t.tipo === 'link' ? 'link' : 'site')) || GRUPOS[0]; }
function descToque(t) {
  if (t.tipo === 'anuncio') return t.anuncio_titulo ? `anúncio “${t.anuncio_titulo}”` : 'anúncio da Meta';
  if (t.tipo === 'link') return `link ${(estado.links || []).find((l) => l.id === t.link_id)?.nome ? '“' + (estado.links || []).find((l) => l.id === t.link_id).nome + '”' : 'rastreável'}`;
  return 'site';
}

// ---------- histórico de idas ao estabelecimento ----------
const brl = (v) => 'R$ ' + (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function chamarVisitas(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return { erro: 'Faça login de novo.' }; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/radar-visitas`, {
      method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY }, body: JSON.stringify(corpo),
    });
    return await res.json().catch(() => ({ erro: 'Resposta inválida.' }));
  } catch (_) { return { erro: 'Sem conexão. Tente de novo.' }; }
}
async function desenharVisitas(contatoId) {

  const total = veio.reduce((a, v) => a + (Number(v.valor) || 0), 0);
  const antes = c ? veio.filter((v) => v.data < String(c.criado_em).slice(0, 10)).length : 0;
  const hoje = hojeISO();

    <div class="vis-resumo">
      <div><b>${veio.length}</b><span>${veio.length === 1 ? 'vez' : 'vezes'} que veio</span></div>
      <div><b>${brl(total)}</b><span>gastou no total</span></div>

    <div class="vis-lista">${vs.length ? vs.map((v) => { const [t, cor] = ST[v.status]; const pendente = v.status === 'agendado' && v.data <= hoje;
      return `<div class="vis-item"><span class="vis-data">${v.data.split('-').reverse().join('/')}</span>
        <span style="color:${cor}; font-weight:600">${t}${pendente ? ' · confirmar' : ''}</span>
        <span style="color:var(--tx2)">${v.valor != null ? brl(v.valor) : (v.status === 'veio' ? '<span class="selo leve">sem valor · espera a lista</span>' : '')}${v.valor_origem === 'conversa' ? ' <span class="selo alerta-leve" title="Valor tirado da conversa. Confira na reunião de alinhamento.">da conversa · conferir</span>' : v.valor_origem === 'servico' ? ' <span class="selo alerta-leve" title="Estimado pela tabela de serviços. Confira na reunião de alinhamento.">pela tabela · conferir</span>' : ''}${v.servico ? ' · ' + esc(v.servico) : ''}</span>
        <span class="vis-acoes">${v.status === 'agendado' ? `<button class="btn-sec mini" data-vis-veio="${v.id}">Veio</button><button class="btn-sec mini" data-vis-faltou="${v.id}">Faltou</button>` : ''}<button class="btn-sec mini" data-vis-del="${v.id}" aria-label="Apagar">✕</button></span></div>`; }).join('')
      : '<div style="font-size:13px; color:var(--tx3)">Nenhuma ida registrada ainda. Marque um agendamento acima, registre aqui ou importe a lista do mês em Resultados.</div>'}</div>
    <details style="margin-top:8px"><summary style="cursor:pointer; font-size:13px; color:var(--verde-claro)">+ Registrar ida</summary>
      <div class="linha" style="margin-top:8px; align-items:flex-end">
        <div style="flex:1 1 130px"><label for="vi-data">Dia</label><input id="vi-data" type="date" value="${hoje}"></div>
        <div style="flex:1 1 110px"><label for="vi-valor">Valor (R$)</label><input id="vi-valor" type="text" inputmode="decimal" placeholder="45,00"></div>
        <div style="flex:1 1 120px"><label for="vi-status">Como foi</label><select id="vi-status"><option value="veio">Veio</option><option value="faltou">Faltou</option><option value="agendado">Agendado</option></select></div>
        <button class="btn-sec" id="vi-ok" type="button">Salvar</button>
      </div></details>`;
  const depois = async (r) => { if (!r.ok) { toast(r.erro || 'Não salvou.'); return; } await recarregarContato(contatoId); desenharVisitas(contatoId); };
  box.querySelectorAll('[data-vis-veio]').forEach((b) => b.addEventListener('click', async () => {

async function recarregarContato(id) {

// anima os cards que mudaram de lugar (FLIP)
function flip(nos, mudar) {
  const antes = new Map(nos.map((n) => [n, n.getBoundingClientRect()]));
  mudar();
  antes.forEach((r, n) => {
    if (!n.isConnected) return;
    const d = n.getBoundingClientRect(); const dx = r.left - d.left, dy = r.top - d.top;
    if (!dx && !dy) return;
    n.style.transition = 'none'; n.style.transform = `translate(${dx}px, ${dy}px)`;
    n.getBoundingClientRect();
    n.style.transition = 'transform 220ms cubic-bezier(.2,.8,.2,1)'; n.style.transform = '';
    setTimeout(() => { n.style.transition = ''; }, 240);
  });
}

function arrastavel(card) {
  card.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || ev.target.closest('select, .sel, button, a, input')) return;
    if (ev.pointerType !== 'mouse' && !ev.target.closest('.alca')) return;
    const x0 = ev.clientX, y0 = ev.clientY; let voando = null, dx = 0, dy = 0, origem = card.closest('.col');
    const todos = () => [...document.querySelectorAll('#crm .ccard:not(.voando)')];
    const mover = (e) => {
      if (!voando) {
        if (Math.hypot(e.clientX - x0, e.clientY - y0) < 6) return;
        const r = card.getBoundingClientRect(); dx = x0 - r.left; dy = y0 - r.top;
        voando = card.cloneNode(true); voando.classList.add('voando');
        Object.assign(voando.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
        document.body.appendChild(voando); card.classList.add('fantasma');

      }
      e.preventDefault();
      voando.style.left = (e.clientX - dx) + 'px'; voando.style.top = (e.clientY - dy) + 'px';
      const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('#crm .col');
      document.querySelectorAll('#crm .col').forEach((c) => c.classList.toggle('alvo', c === col && c !== origem));
      if (!col) return;
      const irmaos = [...col.querySelectorAll('.ccard:not(.fantasma):not(.voando)')];
      const depois = irmaos.find((n) => { const r = n.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      const ref = depois || col.querySelector('.col-vazio');
      if (card.nextElementSibling === ref && card.parentElement === col) return;
      flip(todos(), () => { col.insertBefore(card, ref); });
    };
    const soltar = (e) => {
      window.removeEventListener('pointermove', mover); window.removeEventListener('pointerup', soltar); window.removeEventListener('pointercancel', soltar);
      document.querySelectorAll('#crm .col').forEach((c) => c.classList.remove('alvo'));
      if (!voando) return;
      const destino = card.closest('.col'); const r = card.getBoundingClientRect();
      voando.style.transition = 'left 200ms ease, top 200ms ease, transform 200ms ease';
      voando.style.left = r.left + 'px'; voando.style.top = r.top + 'px'; voando.style.transform = 'none';
      setTimeout(() => { voando.remove(); card.classList.remove('fantasma'); }, 210);
      if (destino && destino !== origem) {
        const id = Number(card.dataset.card), etapaId = Number(destino.dataset.etapa);
        [origem, destino].forEach((c) => { const n = c.querySelectorAll('.ccard').length; c.querySelector('[data-conta]').textContent = n; c.querySelector('.col-vazio').classList.toggle('oculto', n > 0); });
        moverEtapa(id, etapaId, { local: true });
      }
    };
    window.addEventListener('pointermove', mover); window.addEventListener('pointerup', soltar); window.addEventListener('pointercancel', soltar);
  });
}

function dddPadrao() {
  const n = {}; (estado.contatos || []).forEach((c) => { let k = String(c.chave_tel || ''); if (!k) { k = String(c.telefone || '').replace(/\D/g, ''); if (k.length >= 12 && k.startsWith('55')) k = k.slice(2); } if (k.length >= 10) n[k.slice(0, 2)] = (n[k.slice(0, 2)] || 0) + 1; });
  return Object.entries(n).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
}
function dinheiro(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
// pergunta quanto o cliente gastou (opcional). Devolve número, null (em branco) ou undefined (cancelou)
// valores em dinheiro citados na conversa (mesma regra do servidor)
function precosNoTexto(texto) {
  const re = /r\$\s*(\d{1,4}(?:[.,]\d{3})*(?:[.,]\d{1,2})?)|\b(\d{2,4}(?:[.,]\d{1,2})?)\s*(?:reais|real|conto|contos|pila)\b/gi;
  const out = [];
  for (const m of String(texto || '').matchAll(re)) { let t = m[1] ?? m[2]; if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const n = Number(t); if (n >= 10 && n <= 5000) out.push(Math.round(n * 100) / 100); }
  return out;
}
const STOP_SV = new Set(['de', 'do', 'da', 'dos', 'das', 'com', 'mais', 'para', 'pra', 'um', 'uma', 'no', 'na', 'em', 'ou', 'kit', 'combo', 'quero', 'agendar', 'marcar', 'hoje', 'amanha', 'horario', 'fazer', 'queria', 'gostaria', 'tem', 'vaga', 'quanto', 'valor', 'preco', 'fica', 'por', 'favor', 'bom', 'boa', 'dia', 'tarde', 'noite']);
function semAcentoSv(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function tokensSv(t) { return semAcentoSv(t).split(/[^a-z0-9]+/).filter((w) => w.length >= 3 && !STOP_SV.has(w) && !/^\d+$/.test(w)).map((w) => (w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w)); }
// estima o valor pelos serviços citados num texto (tabela de serviços do cliente)
function estimarServico(servicos, texto) {
  const msg = new Set(tokensSv(texto));
  if (!msg.size || !servicos || !servicos.length) return null;
  const sv = servicos.map((s) => ({ nome: s.nome, valor: Number(s.valor) || 0, tk: [...new Set(tokensSv(s.nome))] })).filter((s) => s.tk.length && s.valor > 0);
  const base = new Set(sv.map((s) => s.tk[0]));
  const usados = new Set(); let total = 0; const itens = [];
  const cheios = sv.filter((s) => s.tk.length >= 2 && s.tk.every((w) => msg.has(w))).sort((a, b) => b.tk.length - a.tk.length);
  for (const s of cheios) {
    if (s.tk.some((w) => usados.has(w))) continue;
    const iguais = cheios.filter((x) => x.tk.length === s.tk.length && x.tk.every((w) => s.tk.includes(w)));
    total += iguais.reduce((a, x) => a + x.valor, 0) / iguais.length; itens.push(s.nome);
    s.tk.forEach((w) => usados.add(w));
  }
  for (const k of base) {
    if (!msg.has(k) || usados.has(k)) continue;
    const cand = sv.filter((s) => s.tk.includes(k) && s.tk.every((w) => w === k || !base.has(w)));
    if (!cand.length) continue;
    total += cand.reduce((a, x) => a + x.valor, 0) / cand.length;
    itens.push(cand.length > 1 ? `${k} (média de ${cand.length})` : cand[0].nome);
    usados.add(k);
  }
  return total > 0 ? { valor: Math.round(total * 100) / 100, itens } : null;
}

// lê a tabela de serviços de um texto (uma linha por serviço: "Corte social ..... R$ 40,00")
function servicosDoTexto(txt) {
  const out = [];
  for (const l of String(txt || '').split(/\r?\n/)) {
    const m = l.match(/^(.*?[a-zA-ZÀ-ú].*?)[\s.:;|\-–—_]*(?:r\$\s*)?(\d{1,5}(?:[.,]\d{3})*(?:[.,]\d{1,2})?)\s*(?:reais)?\s*$/i);
    if (!m) continue;
    const nome = m[1].replace(/r\$\s*$/i, '').replace(/[\s.:;|\-–—_]+$/, '').trim(); let v = m[2]; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
    const n = Number(v); if (nome && n > 0 && n <= 100000) out.push({ nome: nome.slice(0, 120), valor: Math.round(n * 100) / 100 });
  }
  return out;
}
function servicosDasLinhas(linhas) {
  const out = [];
  for (const l of linhas) {
    const cel = l.map((x) => String(x ?? '').trim());
    const nome = cel.find((x) => /[a-zA-ZÀ-ú]{2,}/.test(x) && !/^r\$/i.test(x));
    let valor = null;
    for (let i = cel.length - 1; i >= 0; i--) { const m = cel[i].replace(/r\$|\s|reais/gi, '').match(/^\d{1,5}(?:[.,]\d{3})*(?:[.,]\d{1,2})?$/); if (m) { let v = m[0]; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); valor = Number(v); break; } }
    if (nome && valor > 0 && valor <= 100000) out.push({ nome: nome.slice(0, 120), valor: Math.round(valor * 100) / 100 });
  }
  return out;
}
async function servicosDoSite(siteId) {

// sugestão de valor: 1º valor em R$ combinado na conversa; 2º serviços citados pelo cliente × tabela de serviços
async function sugestaoValor(contatoId) {
  const v = await valorDaConversa(contatoId);
  if (v) return { valor: v, texto: `Achei <b>${dinheiro(v)}</b> na conversa.` };
  try {
    const sv = await servicosDoSite(estado.site); if (!sv.length) return null;
    const desde = new Date(Date.now() - 45 * 864e5).toISOString();
    const { data } = await sb.from('mensagens').select('texto, direcao').eq('contato_id', contatoId).eq('direcao', 'entrada').not('texto', 'is', null).gte('criado_em', desde).order('criado_em', { ascending: false }).limit(80);
    for (const m of data || []) { const e = estimarServico(sv, m.texto); if (e) return { valor: e.valor, texto: `Ele pediu <b>${esc(e.itens.join(' + '))}</b>: pela tabela de serviços, <b>${dinheiro(e.valor)}</b>.` }; }
  } catch (_) { /* sem sugestão */ }
  return null;
}
async function valorDaConversa(contatoId) {
  try {
    const desde = new Date(Date.now() - 45 * 864e5).toISOString();
    const { data } = await sb.from('mensagens').select('texto').eq('contato_id', contatoId).not('texto', 'is', null).gte('criado_em', desde).order('criado_em', { ascending: false }).limit(80);
    for (const m of data || []) {
      const tot = String(m.texto).match(/total[^0-9r$]{0,15}(r\$\s*\d[\d.,]*|\d[\d.,]*\s*(?:reais|real))/i);
      if (tot) { const p = precosNoTexto(tot[1]); if (p.length) return p[0]; }
      const p = precosNoTexto(m.texto);
      if (!p.length || new Set(p).size > 2) continue;
      return p[p.length - 1];
    }
  } catch (_) { /* sem sugestão */ }
  return null;
}

async function moverEtapa(contatoId, etapaId, op = {}) {
  const alvoE = estado.etapas.find((x) => x.id === etapaId);

  const ordAtual = estado.etapas.find((x) => x.id === cAtual?.etapa_id)?.ordem ?? 0;

  if (valor === undefined && alvoE?.evento_meta === 'Purchase' && alvoE.ordem > ordAtual) {
    valor = await pedirValor(alvoE.nome, Number(alvoE.valor_padrao) || 0, await sugestaoValor(contatoId));
    if (valor === undefined) { if (op.local) telaCRM(); else desenhar(); return; }
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return; }

      body: JSON.stringify({ contato_id: contatoId, etapa_id: etapaId, valor: valor ?? null }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) { toast(j.erro || 'Não foi possível mudar a etapa.'); if (op.local) telaCRM(); return; }
    toast(j.enviado_meta ? (valor ? `Etapa atualizada e venda de ${dinheiro(valor)} enviada à Meta.` : 'Etapa atualizada e evento enviado à Meta.')
      : j.aguardando_valor ? 'Etapa atualizada. A venda vai pra Meta quando a lista do mês trouxer o valor.' : 'Etapa atualizada.');
    if (op.local) {
      const c = estado.contatos.find((x) => x.id === contatoId); if (c) c.etapa_id = etapaId;
      const velho = document.querySelector(`#crm [data-card="${contatoId}"]`); const e = estado.etapas.find((x) => x.id === etapaId);
      if (velho && c && e) {
        const tmp = document.createElement('div'); tmp.innerHTML = cardCRM(c, estado.etapas, e).trim();
        const novo = tmp.firstElementChild; velho.replaceWith(novo); arrastavel(novo);
        const s2 = novo.querySelector('select'); s2.addEventListener('change', () => { if (s2.value) moverEtapa(contatoId, Number(s2.value)); });
      }
      return;
    }
    await carregar();
  } catch (_) { toast('Sem conexão. Tente de novo.'); if (op.local) telaCRM(); }
}

// ================= ROTINA =================
const TIPO_TAREFA = {
  follow_up: { t: 'Follow-up', c: 'var(--morno)', bg: 'var(--morno-bg)' },
  reativacao: { t: 'Reativação', c: 'var(--frio)', bg: 'var(--frio-bg)' },
  manual: { t: 'Manual', c: 'var(--tx2)', bg: 'rgba(255,255,255,.07)' },
};
function hojeISO() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function diasDesde(iso) { return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }

async function telaRotina() {
  const hoje = hojeISO();
  const inicioHoje = new Date(hoje + 'T00:00:00').toISOString();
  const [{ data: abertas }, { data: feitasHoje }] = await Promise.all([
    sb.from('tarefas').select('*').eq('site_id', estado.site).eq('status', 'aberta').lte('vence_em', hoje).order('vence_em').limit(500),
    sb.from('tarefas').select('id, status').eq('site_id', estado.site).neq('status', 'aberta').gte('concluida_em', inicioHoje).limit(1000),
  ]);
  const { data: futuras } = await sb.from('tarefas').select('*').eq('site_id', estado.site).eq('status', 'aberta').gt('vence_em', hoje).order('vence_em').limit(100);
  if (estado.tela !== 'rotina') return;
  const lista = abertas || [];
  const ids = [...new Set([...lista, ...(futuras || [])].map((t) => t.contato_id).filter(Boolean))];
  const ultimaEntrada = {};
  if (ids.length) {
    const { data: msgs } = await sb.from('mensagens').select('contato_id, criado_em').eq('direcao', 'entrada').in('contato_id', ids).order('criado_em', { ascending: false }).limit(2000);
    (msgs || []).forEach((m) => { if (!ultimaEntrada[m.contato_id]) ultimaEntrada[m.contato_id] = m.criado_em; });
  }
  estado.ultimaEntrada = ultimaEntrada;
  const feitas = (feitasHoje || []).filter((t) => t.status === 'feita').length;
  const puladas = (feitasHoje || []).filter((t) => t.status === 'pulada').length;
  const total = lista.length + feitas + puladas;
  const pctFeito = total ? Math.round(((feitas + puladas) / total) * 100) : 0;
  const atrasadas = lista.filter((t) => t.vence_em < hoje);
  const deHoje = lista.filter((t) => t.vence_em === hoje);
  estado.tarefasAbertas = lista.length; atualizarBadges();
  const semResposta = estado.contatos.filter(esperando).sort((a, b) => new Date(a.ultima_msg_em || a.atualizado_em) - new Date(b.ultima_msg_em || b.atualizado_em));
  const fimHoje = new Date(hoje + 'T23:59:59').getTime(), iniHoje = new Date(hoje + 'T00:00:00').getTime();
  const agendadosHoje = estado.contatos.filter((c) => c.agendado_em && new Date(c.agendado_em).getTime() >= iniHoje && new Date(c.agendado_em).getTime() <= fimHoje)
    .sort((a, b) => new Date(a.agendado_em) - new Date(b.agendado_em));
  const modo = telaRotina._modo || 'hoje';

  const linha = (t) => {
    const c = estado.contatos.find((x) => x.id === t.contato_id);
    const tp = TIPO_TAREFA[t.tipo] || TIPO_TAREFA.manual;

      <div class="info"><b>${esc(nome)} <span class="tag" style="color:${tp.c}; background:${tp.bg}">${tp.t}</span></b>
        <small>${t.nota ? `<span style="color:var(--alerta)">${esc(t.nota)}</span> · ` : ''}${esc(t.titulo || '')}${e ? ' · etapa: ' + esc(e.nome) : ''}${dd !== null ? ` · ${dd === 0 ? 'falou hoje' : `sem mandar mensagem há ${dd} ${dd === 1 ? 'dia' : 'dias'}`}` : ''}${t.vence_em < hoje ? ` · <span style="color:var(--alerta)">atrasada desde ${t.vence_em.split('-').reverse().join('/')}</span>` : ''}</small></div>

  // semana: 7 dias a partir de hoje, com tarefas + agendados de cada dia

        <div style="display:flex; justify-content:space-between; align-items:baseline"><b style="font-size:15px">${nomeDia(x, i)}</b><span style="font-size:12px; color:var(--tx3)">${x.iso.split('-').reverse().slice(0, 2).join('/')}</span></div>
        <div style="display:flex; align-items:center; gap:8px; margin:8px 0"><div class="barra" style="flex:1"><div style="width:${Math.round((x.n / maxDia) * 100)}%"></div></div><b style="font-size:18px">${x.n}</b></div>
        <div style="font-size:12px; color:var(--tx2); margin-bottom:6px">${x.ts.length} ${x.ts.length === 1 ? 'tarefa' : 'tarefas'} · ${x.ags.length} ${x.ags.length === 1 ? 'agendado' : 'agendados'}</div>
        ${x.ags.map((c) => `<button class="item-semana" data-abrir="${c.id}">🕒 ${new Date(c.agendado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · ${esc(c.nome || telefoneBonito(c.telefone))}</button>`).join('')}
        ${x.ts.slice(0, 8).map((t) => { const c = estado.contatos.find((y) => y.id === t.contato_id); const tp = TIPO_TAREFA[t.tipo] || TIPO_TAREFA.manual;
          return `<button class="item-semana" ${c ? `data-abrir="${c.id}"` : ''}>${tp.t} · ${esc(c ? (c.nome || telefoneBonito(c.telefone)) : (t.titulo || 'Tarefa'))}</button>`; }).join('')}
        ${x.ts.length > 8 ? `<div style="font-size:12px; color:var(--tx3)">+ ${x.ts.length - 8} tarefas</div>` : ''}
        ${!x.n ? '<div style="font-size:12px; color:var(--tx3)">Dia livre</div>' : ''}
      </div>`).join('')}</div></section>`;

  $('tela-rotina').innerHTML = `<div style="display:flex; flex-direction:column; gap:18px">
    <div class="chave" role="group" aria-label="Ver tarefas de" style="align-self:flex-start"><button data-modo-t="hoje" aria-pressed="${modo === 'hoje'}">Hoje</button><button data-modo-t="semana" aria-pressed="${modo === 'semana'}">Semana</button></div>
    ${modo === 'semana' ? htmlSemana : `
    <section class="card" style="display:flex; flex-direction:column; gap:10px">
      <h2 style="margin:0">Meta do dia</h2>
      <div style="font-size:22px; font-weight:800">${feitas + puladas} de ${total} ${total === 1 ? 'tarefa resolvida' : 'tarefas resolvidas'} <span style="color:var(--verde)">(${pctFeito}%)</span></div>
      <div class="barra" role="progressbar" aria-valuenow="${pctFeito}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pctFeito}%"></div></div>
      <div style="font-size:13px; color:var(--tx2)">${feitas} ${feitas === 1 ? 'feita' : 'feitas'} · ${puladas} ${puladas === 1 ? 'pulada' : 'puladas'} · ${lista.length} ${lista.length === 1 ? 'pendente' : 'pendentes'} (${atrasadas.length} ${atrasadas.length === 1 ? 'atrasada' : 'atrasadas'} + ${deHoje.length} de hoje)</div>
    </section>
    ${semResposta.length ? `<section class="card"><h2 style="margin:0 0 4px">Esperando resposta (${semResposta.length})</h2>${semResposta.slice(0, 15).map((c) => linhaContato(c, `mandou mensagem ${quando(c.ultima_msg_em || c.atualizado_em)}`)).join('')}${semResposta.length > 15 ? `<div style="font-size:12px; color:var(--tx3); padding-top:8px">Mostrando 15 de ${semResposta.length} · veja todos em Conversas › Sem resposta</div>` : ''}</section>` : ''}
    ${agendadosHoje.length ? `<section class="card"><h2 style="margin:0 0 4px">Agendados pra hoje (${agendadosHoje.length})</h2>${agendadosHoje.map((c) => linhaContato(c, 'às ' + new Date(c.agendado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }))).join('')}</section>` : ''}
    ${atrasadas.length ? `<section class="card"><h2 style="margin:0 0 4px; color:var(--alerta)">⚠ Atrasadas (${atrasadas.length})</h2>${atrasadas.map(linha).join('')}</section>` : ''}
    <section class="card"><h2 style="margin:0 0 4px">Hoje (${deHoje.length})</h2>${deHoje.length ? deHoje.map(linha).join('') : '<div class="vazio">Nenhuma tarefa pra hoje. As tarefas de follow-up e reativação aparecem sozinhas todo dia às 7h.</div>'}</section>
    ${(futuras || []).length ? `<section class="card"><h2 style="margin:0 0 4px">Próximos dias (${futuras.length})</h2>${futuras.map(linha).join('')}</section>` : ''}`}
    <section class="card" style="display:flex; flex-direction:column; gap:12px">
      <h2 style="margin:0">Nova tarefa</h2>

    const contato = Number($('nt-contato').value) || null; const titulo = $('nt-titulo').value.trim();
    if (!titulo) { st.textContent = 'Escreva o que fazer.'; st.style.color = 'var(--alerta)'; return; }
    const { error } = await sb.from('tarefas').insert({ site_id: estado.site, contato_id: contato, tipo: 'manual', titulo, vence_em: $('nt-data').value || hoje });
    if (error) { st.textContent = 'Erro: ' + error.message; st.style.color = 'var(--alerta)'; return; }
    toast('Tarefa criada.'); telaRotina();

// ---------- janela de envio (texto livre ou modelo) ----------
async function abrirEnvio(contatoId, tarefa) {
  const c = estado.contatos.find((x) => x.id === contatoId);
  if (!c) return;
  const dlg = $('modal-envio'); const corpo = $('me-corpo');
  let ultima = estado.ultimaEntrada && estado.ultimaEntrada[contatoId];
  if (ultima === undefined) {
    const { data } = await sb.from('mensagens').select('criado_em').eq('contato_id', contatoId).eq('direcao', 'entrada').order('criado_em', { ascending: false }).limit(1);
    ultima = data?.[0]?.criado_em || null;
  }
  const dentro24h = ultima && (Date.now() - new Date(ultima).getTime()) < 24 * 3600 * 1000;
  const nome = c.nome || telefoneBonito(c.telefone);
  const primeiroNome = (c.nome || '').trim().split(/\s+/)[0] || '';
  corpo.innerHTML = `<h2 style="margin:0" id="me-titulo">Enviar pra ${esc(nome)}</h2>
    <div style="font-size:13px; color:var(--tx2)">${dentro24h ? 'Falou nas últimas 24h: pode mandar mensagem livre (1 crédito) ou um modelo.' : 'Está há mais de 24h sem mandar mensagem: pela regra do WhatsApp, só dá pra enviar um <b>modelo aprovado</b>.'}</div>
    ${dentro24h ? `<div><label for="me-texto">Mensagem livre</label><textarea id="me-texto" rows="3" style="width:100%; background:var(--campo); border:1px solid var(--campo-bd); border-radius:10px; padding:10px 12px; font:inherit"></textarea>
      <div style="margin-top:8px"><button class="btn" id="me-enviar-texto">Enviar mensagem (1 crédito)</button></div></div>
      <div style="border-top:1px solid var(--line2); padding-top:10px; font-weight:700">Ou use um modelo</div>` : ''}
    <div id="me-modelos" style="font-size:13px">Carregando modelos aprovados…</div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap"><span id="me-status" style="font-size:13px; color:var(--tx2)"></span></div>
    <div style="display:flex; justify-content:flex-end"><button class="btn-sec" id="me-fechar">Fechar</button></div>`;
  $('me-fechar').addEventListener('click', () => fecharModal());
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');

  const status = (t, ok) => { $('me-status').textContent = t; $('me-status').style.color = ok === false ? 'var(--alerta)' : ok ? 'var(--verde)' : 'var(--tx2)'; };
  const depois = async (r) => {
    if (!r.ok) { status(r.erro || 'Não enviou.', false); return; }
    toast('Mensagem enviada.'); fecharModal();
    setTimeout(atualizarCreditos, 8000);
    if (estado.tela === 'rotina') telaRotina();
    if (estado.tela === 'conversas' && estado.chat && estado.chat.id === contatoId && r.mensagem && !document.querySelector(`[data-msg="${r.mensagem.id}"]`)) {
      if ($('msgs-vazio')) $('msgs-vazio').remove();
      $('msgs-lista').insertAdjacentHTML('beforeend', bolhaHTML(r.mensagem)); const box = $('msgs'); box.scrollTop = box.scrollHeight;
    }
  };
  if (dentro24h) $('me-enviar-texto').addEventListener('click', async () => {
    const texto = $('me-texto').value.trim(); if (!texto) { status('Escreva a mensagem.', false); return; }
    status('Enviando…'); depois(await chamarWhats({ acao: 'enviar', contato_id: contatoId, texto, tarefa_id: tarefa?.id }));
  });

  if (!estado.modelosCache || estado.modelosCache.site !== estado.site) {
    const r = await chamarWhats({ acao: 'listar_modelos', site_id: estado.site });
    estado.modelosCache = { site: estado.site, lista: r.ok ? r.modelos : [], erro: r.ok ? null : r.erro };
  }
  const aprovados = estado.modelosCache.lista.filter((m) => m.status === 'APPROVED');
  const alvo = $('me-modelos'); if (!alvo) return;
  if (estado.modelosCache.erro) { alvo.innerHTML = `<span style="color:var(--alerta)">${esc(estado.modelosCache.erro)}</span>`; return; }
  if (!aprovados.length) { alvo.innerHTML = 'Nenhum modelo aprovado ainda. Crie um em <b>Modelos de mensagem</b>.'; return; }
  alvo.innerHTML = `<label for="me-modelo">Modelo</label><select id="me-modelo">${aprovados.map((m, i) => `<option value="${i}">${esc(m.nome)} · ${m.categoria === 'MARKETING' ? 'Marketing (10 créditos)' : 'Utilidade (1 crédito)'}</option>`).join('')}</select>
    <div id="me-campos" class="linha" style="margin-top:8px"></div>
    <div id="me-previa" class="previa" style="margin-top:8px"></div>
    <div style="margin-top:8px"><button class="btn" id="me-enviar-modelo">Enviar modelo</button></div>`;
  const desenharCampos = () => {
    const m = aprovados[Number($('me-modelo').value)];
    const vars = [...new Set([...m.texto.matchAll(/\{\{(\d+)\}\}/g)].map((x) => Number(x[1])))].sort((a, b) => a - b);
    $('me-campos').innerHTML = vars.map((n) => `<div style="flex:1 1 160px"><label for="mv-${n}">Campo {{${n}}}</label><input id="mv-${n}" data-var="${n}" type="text" value="${n === 1 ? esc(primeiroNome) : ''}"></div>`).join('');
    const previa = () => {
      const v = {}; document.querySelectorAll('[data-var]').forEach((i) => { v[i.dataset.var] = i.value || `{{${i.dataset.var}}}`; });
      $('me-previa').textContent = m.texto.replace(/\{\{(\d+)\}\}/g, (_, n) => v[n] ?? '');
    };
    document.querySelectorAll('[data-var]').forEach((i) => i.addEventListener('input', previa)); previa();
    $('me-enviar-modelo').textContent = `Enviar modelo (${m.categoria === 'MARKETING' ? '10 créditos' : '1 crédito'})`;
  };
  $('me-modelo').addEventListener('change', desenharCampos); desenharCampos();
  $('me-enviar-modelo').addEventListener('click', async () => {
    const m = aprovados[Number($('me-modelo').value)];
    const parametros = [...document.querySelectorAll('[data-var]')].sort((a, b) => a.dataset.var - b.dataset.var).map((i) => i.value.trim());
    if (parametros.some((x) => !x)) { status('Preencha todos os campos.', false); return; }
    status('Enviando…');
    depois(await chamarWhats({ acao: 'enviar_modelo', contato_id: contatoId, nome: m.nome, idioma: m.idioma, parametros, tarefa_id: tarefa?.id }));
  });
}
function fecharModal() { const d = $('modal-envio'); if (d.close) d.close(); else d.removeAttribute('open'); }

// ================= ENVIAR MENSAGEM / MODELOS =================
async function chamarWhats(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return { erro: 'Faça login de novo.' }; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/radar-whatsapp`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY },

async function prepararArquivo(f) {
  // o WhatsApp só aceita foto em JPG/PNG até 5 MB: converte e reduz quando precisa
  if (f.type.startsWith('image/') && (!['image/jpeg', 'image/png'].includes(f.type) || f.size > 4.5 * 1024 * 1024)) {
    try {
      const img = await createImageBitmap(f);
      const esc2 = Math.min(1, 2560 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * esc2); cv.height = Math.round(img.height * esc2);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const blob = await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.85));
      return new File([blob], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (_) { toast('Não consegui converter essa foto. Tente JPG ou PNG.'); return null; }
  }
  if (f.size > 16 * 1024 * 1024 && !f.type.startsWith('application/')) { toast('Arquivo grande demais (máx. 16 MB).'); return null; }
  return f;
}
function definirAnexo(f) {
  estado.anexo = f || null;
  const box = $('anexo-box'); if (!box) return;
  if (!f) { box.innerHTML = ''; return; }
  const tipo = f.type.startsWith('image/') ? '📷' : f.type.startsWith('video/') ? '🎬' : f.type.startsWith('audio/') ? '🎙️' : '📄';
  box.innerHTML = `<span class="anexo-chip">${tipo} ${esc(f.name)} · ${(f.size / 1024 / 1024).toFixed(1)} MB <button type="button" id="anexo-tirar" aria-label="Tirar anexo">✕</button></span>`;
  $('anexo-tirar').addEventListener('click', () => definirAnexo(null));
  $('resp-texto').placeholder = f.type.startsWith('audio/') ? 'Clique em Enviar pra mandar o áudio' : 'Legenda (opcional)…';
}
let _grav = null;
function formatoAudio() {
  const ops = ['audio/ogg;codecs=opus', 'audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac'];
  return window.MediaRecorder ? ops.find((t) => MediaRecorder.isTypeSupported(t)) : null;
}
async function alternarGravacao(contatoId) {
  const bt = $('resp-mic');
  if (_grav) { _grav.rec.stop(); return; }
  const tipo = formatoAudio();
  if (!tipo) { toast('Esse navegador não grava áudio num formato que o WhatsApp aceita. Use o Chrome atualizado ou mande um arquivo de áudio.'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (_) { toast('Libere o microfone pro site no navegador pra gravar áudio.'); return; }
  const partes = []; const rec = new MediaRecorder(stream, { mimeType: tipo }); const inicio = Date.now();
  _grav = { rec, timer: setInterval(() => { const s2 = Math.floor((Date.now() - inicio) / 1000); bt.title = `Gravando ${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')} · clique pra parar`; $('resp-texto').placeholder = `● Gravando ${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')} — clique no ■ pra parar`; }, 500) };
  bt.classList.add('gravando'); bt.innerHTML = icone('parar', 20);
  rec.ondataavailable = (e) => { if (e.data.size) partes.push(e.data); };
  rec.onstop = () => {
    clearInterval(_grav.timer); _grav = null; stream.getTracks().forEach((t) => t.stop());
    bt.classList.remove('gravando'); bt.innerHTML = icone('mic', 20); bt.title = 'Gravar áudio';
    const base = tipo.split(';')[0]; const ext = base === 'audio/ogg' ? 'ogg' : 'm4a';
    const f = new File(partes, `audio_${Date.now()}.${ext}`, { type: base });
    if (f.size < 1500) { toast('Áudio muito curto.'); $('resp-texto').placeholder = 'Escreva uma mensagem…'; return; }
    definirAnexo(f);
  };
  rec.start();
}
async function enviarAnexo(contatoId) {
  const f = estado.anexo; const bt = $('resp-enviar'); const caixa = $('resp-texto');
  bt.disabled = true; bt.textContent = 'Enviando…';
  const nome = f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').slice(-80);
  const path = `${estado.site}/${contatoId}/env_${Date.now()}_${nome}`;

  if (up.error) { bt.disabled = false; bt.textContent = 'Enviar'; toast('Não consegui subir o arquivo: ' + up.error.message); return; }
  const r = await chamarWhats({ acao: 'enviar_midia', contato_id: contatoId, path, mime: f.type, nome: f.name, legenda: caixa.value.trim() });
  bt.disabled = false; bt.textContent = 'Enviar';

}
