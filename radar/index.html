<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F1F6F2; --card: #FFFFFF; --side: #F7FBF8; --line: #DDE7E0; --line2: #EAF1EC;
    --tx: #0F1A13; --tx2: #4D5B52; --tx3: #5F6E64; --verde: #15803D; --verde-bg: #EAF7EE; --verde-bd: #B7E4C7;
    --frio: #1D4ED8; --frio-bg: #E8F1FE; --frio-bd: #B9D3FB;
    --morno: #B45309; --morno-bg: #FEF3E2; --morno-bd: #F6D199;
    --quente: #B91C1C; --quente-bg: #FDECEC; --quente-bd: #F5B5B5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Inter', sans-serif; font-size: 14px; }
  h1, h2, .num { font-family: 'Space Grotesk', sans-serif; }
  button, input, select { font: inherit; }
  .oculto { display: none !important; }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--verde); display: flex; align-items: center; justify-content: center; }
  .logo span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=email], input[type=password], input[type=text], select {
    width: 100%; background: #F6FAF7; border: 1px solid #CFDCD3; border-radius: 10px; padding: 11px 13px; color: var(--tx);
  }
  .btn { background: var(--verde); color: #fff; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; min-height: 44px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-sec { background: #fff; color: var(--tx); border: 1px solid #CFDCD3; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .erro { color: var(--quente); font-size: 13px; min-height: 18px; }

  /* app */
  #app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 248px; background: var(--side); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; }
  nav .menu { display: flex; flex-direction: column; gap: 4px; }
  nav .menu button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: none; background: transparent; color: var(--tx2); font-weight: 500; cursor: pointer; text-align: left; }
  nav .menu button.ativo { background: #E3F5E9; color: var(--tx); font-weight: 600; box-shadow: inset 3px 0 0 var(--verde); }
  nav .rodape { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--tx2); }
  main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; }
  .topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .topo h1 { margin: 0; font-size: 28px; }
  .topo p { margin: 4px 0 0; color: var(--tx2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 17px; }
  .linha { display: flex; flex-wrap: wrap; gap: 16px; }
  .kpi { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; }
  .kpi .rot { color: var(--tx2); font-size: 13px; }
  .kpi .num { font-size: 30px; font-weight: 700; }
  .kpi .obs { color: var(--tx3); font-size: 12px; }
  .vazio { color: var(--tx3); padding: 18px 0; }

  /* funil */
  .funil-linha { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .funil-nome { width: 160px; flex-shrink: 0; display: flex; flex-direction: column; }
  .funil-nome b { font-size: 14px; } .funil-nome small { font-size: 11px; font-weight: 700; }
  .funil-trilho { flex: 1; min-width: 0; background: #F6FAF7; border-radius: 10px; height: 44px; display: flex; justify-content: center; }
  .funil-barra { height: 44px; border-radius: 10px; border: 1px solid; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 90px; }
  .funil-barra .num { font-size: 20px; font-weight: 700; }
  .barra-origem { margin-bottom: 12px; }
  .barra-origem .t { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .barra-origem .tr { height: 8px; border-radius: 4px; background: var(--line2); }
  .barra-origem .f { height: 8px; border-radius: 4px; }

  /* conversas */
  .conv { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .conv-lista { flex: 1 1 260px; max-width: 330px; padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
  .conv-lista .busca { padding: 12px; border-bottom: 1px solid var(--line); }
  .conv-lista .itens { overflow-y: auto; }
  .conv-item { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line2); padding: 12px 14px; cursor: pointer; color: inherit; }
  .conv-item.ativo { background: #E3F5E9; }
  .av { width: 36px; height: 36px; border-radius: 50%; background: #DDE7E0; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .conv-item .meio { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .conv-item .nome { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .conv-item .nome small { color: var(--tx3); font-weight: 400; font-size: 11px; }
  .conv-item .orig { font-size: 11px; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
  .bol { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chat { flex: 2 1 380px; min-width: 0; padding: 0; display: flex; flex-direction: column; max-height: 76vh; }
  .chat-topo { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-msgs { padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .bolha { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .bolha small { display: block; font-size: 10px; color: var(--tx3); text-align: right; margin-top: 4px; }
  .bolha.entrada { align-self: flex-start; background: #F1F4F2; border-bottom-left-radius: 4px; }
  .bolha.saida { align-self: flex-end; background: #D9F2E1; border-bottom-right-radius: 4px; }
  .detalhe { flex: 1 1 280px; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .dl { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line2); }
  .dl span:first-child { color: var(--tx3); } .dl span:last-child { text-align: right; word-break: break-word; }
  .etapas-bt { display: flex; flex-wrap: wrap; gap: 8px; }
  .etapas-bt button { border: 1px solid; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .hist { font-size: 12px; color: var(--tx2); display: flex; flex-direction: column; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 4px 10px; }

  /* crm */
  .crm { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .col { flex: 1 1 250px; min-width: 0; background: var(--side); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .col-topo { border: 1px solid; border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .col-topo b { display: block; } .col-topo small { font-size: 11px; font-weight: 700; }
  .col-topo .num { font-size: 22px; font-weight: 700; }
  .ccard { background: #fff; border: 1px solid #CFDCD3; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .ccard .n { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .ccard .n small { color: var(--tx3); font-weight: 400; }
  .ccard .o { font-size: 12px; color: var(--tx2); }
  .ccard select { padding: 7px 10px; font-size: 13px; }
  .aviso { background: var(--verde-bg); border: 1px solid var(--verde-bd); border-radius: 12px; padding: 12px 16px; color: #33433A; font-size: 13px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--tx); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; z-index: 10; }
  @media (max-width: 700px) { main { padding: 20px 16px; } .funil-nome { width: 110px; } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="oculto">
  <form class="login-box" id="form-login">
    <div class="logo"><div class="logo-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg></div><span>Radar</span></div>
    <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="bt-entrar">Entrar</button>
    <div class="erro" id="erro-login" role="alert"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" class="oculto">
  <nav aria-label="Menu principal">
    <div class="logo"><div class="logo-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg></div><span>Radar</span></div>
    <div id="bloco-cliente">
      <label for="sel-site">Cliente</label>
      <select id="sel-site"></select>
      <button class="btn-sec" id="bt-novo-cliente" style="width:100%; margin-top:8px">+ Novo cliente</button>
    </div>
    <div class="menu">
      <button data-tela="dashboard" class="ativo">Dashboard</button>
      <button data-tela="conversas">Conversas</button>
      <button data-tela="crm">CRM / Funil</button>
      <button data-tela="links">Links rastreáveis</button>
      <button data-tela="config" id="menu-config" class="oculto">Configurações</button>
    </div>
    <div class="rodape">
      <span id="quem"></span>
      <button class="btn-sec" id="bt-sair">Sair</button>
    </div>
  </nav>

  <main>
    <div class="topo">
      <div><h1 id="titulo">Dashboard</h1><p id="subtitulo"></p></div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
        <select id="sel-periodo" aria-label="Período" style="width:auto">
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
        <button class="btn-sec" id="bt-atualizar">Atualizar</button>
      </div>
    </div>

    <section id="tela-dashboard"></section>
    <section id="tela-conversas" class="oculto"></section>
    <section id="tela-crm" class="oculto"></section>
    <section id="tela-links" class="oculto"></section>
    <section id="tela-config" class="oculto"></section>
  </main>
</div>
<div id="toast" class="oculto" role="status"></div>

<script src="config.js?v=1"></script>
<script>
// A chave fica no arquivo config.js (assim este arquivo pode ser atualizado sem colar a chave de novo)
const SUPABASE_URL = (window.RADAR && window.RADAR.SUPABASE_URL) || 'https://dwjozttehrdkhbjzkkia.supabase.co';
const SUPABASE_KEY = (window.RADAR && window.RADAR.SUPABASE_KEY) || '';
const FN_MOVER = (window.RADAR && window.RADAR.FN_MOVER) || 'mover-etapa';
const FN_ADMIN = (window.RADAR && window.RADAR.FN_ADMIN) || 'radar-admin';
const TRACKER_URL = 'https://barbeariaquelucra.com/jota-tracker.js?v=1';
const ENDPOINT_TRACK = SUPABASE_URL + '/functions/v1/meta-capi/track';
if (!SUPABASE_KEY) alert('Falta o arquivo radar/config.js com a chave pública do Supabase.');

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const COR = {
  frio:   { c: 'var(--frio)',   bg: 'var(--frio-bg)',   bd: 'var(--frio-bd)' },
  morno:  { c: 'var(--morno)',  bg: 'var(--morno-bg)',  bd: 'var(--morno-bd)' },
  quente: { c: 'var(--quente)', bg: 'var(--quente-bg)', bd: 'var(--quente-bd)' },
};
const ORIGEM = {
  anuncio_meta: { nome: 'Anúncio Meta', cor: '#15803D' },
  site:         { nome: 'Site',          cor: '#B45309' },
  link:         { nome: 'Link rastreável', cor: '#7C3AED' },
  organico:     { nome: 'Orgânico / direto', cor: '#5F6E64' },
};

const estado = { perfil: null, site: null, tela: 'dashboard', etapas: [], contatos: [], aberto: null };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('oculto');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('oculto'), 3500);
}
function quando(iso) {
  const d = new Date(iso), hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                  : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
function telefoneBonito(t) {
  const d = String(t || '').replace(/^55/, '');
  return d.length >= 10 ? `(${d.slice(0, 2)}) ${d.slice(2, -4)}-${d.slice(-4)}` : t;
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

// ================= LOGIN =================
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('bt-entrar').disabled = true; $('erro-login').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
  $('bt-entrar').disabled = false;
  if (error) { $('erro-login').textContent = 'E-mail ou senha incorretos.'; return; }
  iniciar();
});
$('bt-sair').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!perfil) {
    $('login').classList.remove('oculto');
    $('erro-login').textContent = 'Seu usuário ainda não tem acesso ao Radar. Fale com o Jota.';
    await sb.auth.signOut(); return;
  }
  estado.perfil = perfil;
  $('quem').textContent = `${perfil.nome} · ${perfil.papel === 'admin' ? 'Administrador' : 'Cliente'}`;

  const { data: sites } = await sb.from('sites').select('id, nome, pixel_id, allowed_origins, whatsapp_phone_number_id').eq('ativo', true).order('nome');
  estado.sites = sites || [];
  const sel = $('sel-site');
  sel.innerHTML = (sites || []).map((s) => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  if (perfil.papel !== 'admin') $('bloco-cliente').classList.add('oculto');
  else $('menu-config').classList.remove('oculto');
  estado.site = perfil.papel === 'admin' ? (sites?.[0]?.id ?? null) : perfil.site_id;
  sel.value = estado.site || '';

  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  await carregar();
}

// ================= DADOS =================
async function carregar() {
  if (estado.novoCliente) { desenhar(); return; }
  if (!estado.site) { $('tela-dashboard').innerHTML = '<div class="card vazio">Nenhum cliente cadastrado ainda.</div>'; return; }
  const nomeSite = $('sel-site').selectedOptions[0]?.textContent ?? '';
  $('subtitulo').textContent = nomeSite;

  const [{ data: etapas }, { data: contatos }] = await Promise.all([
    sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem'),
    sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000),
  ]);
  estado.etapas = etapas || [];
  estado.contatos = contatos || [];
  const { data: links } = await sb.from('links').select('*').eq('site_id', estado.site).order('criado_em', { ascending: false });
  estado.links = links || [];
  desenhar();
}

function etapaDe(c) { return estado.etapas.find((e) => e.id === c.etapa_id) || null; }
function noPeriodo(lista) {
  const dias = Number($('sel-periodo').value);
  const corte = Date.now() - dias * 864e5;
  return lista.filter((c) => new Date(c.criado_em).getTime() >= corte);
}

function desenhar() {
  ['dashboard', 'conversas', 'crm', 'links', 'config'].forEach((t) => $('tela-' + t).classList.toggle('oculto', t !== estado.tela));
  $('titulo').textContent = { dashboard: 'Dashboard', conversas: 'Conversas', crm: 'CRM / Funil', links: 'Links rastreáveis', config: 'Configurações' }[estado.tela];
  if (estado.tela === 'dashboard') telaDashboard();
  if (estado.tela === 'conversas') telaConversas();
  if (estado.tela === 'crm') telaCRM();
  if (estado.tela === 'links') telaLinks();
  if (estado.tela === 'config') telaConfig();
}

// ================= DASHBOARD =================
function telaDashboard() {
  const lista = noPeriodo(estado.contatos);
  const total = lista.length;
  const etapas = estado.etapas;
  // quantos chegaram em cada etapa (ou passaram dela)
  const chegaram = etapas.map((e) => lista.filter((c) => (etapaDe(c)?.ordem ?? 0) >= e.ordem).length);

  const kpis = etapas.slice(1, 3).map((e, i) => {
    const n = chegaram[i + 1];
    return `<div class="card kpi"><span class="rot">${esc(e.nome)}</span><span class="num">${n}</span><span class="obs">${pct(n, total)}% · ${n} de ${total} conversas</span></div>`;
  }).join('');

  const max = Math.max(...chegaram, 1);
  const funil = etapas.map((e, i) => {
    const cor = COR[e.temperatura] || COR.frio;
    const w = Math.max(Math.round((chegaram[i] / max) * 100), 12);
    const queda = i < etapas.length - 1 ? chegaram[i] - chegaram[i + 1] : null;
    return `<div class="funil-linha">
      <div class="funil-nome"><b>${esc(e.nome)}</b><small style="color:${cor.c}">${e.temperatura.toUpperCase()}</small></div>
      <div class="funil-trilho"><div class="funil-barra" style="width:${w}%; background:${cor.bg}; border-color:${cor.bd}">
        <span class="num" style="color:${cor.c}">${chegaram[i]}</span><span style="color:#33433A; font-size:12px">pessoas</span></div></div>
    </div>${queda !== null && queda > 0 ? `<div style="font-size:12px; color:var(--tx3); margin:-6px 0 10px 174px">↓ ${queda} ainda não avançaram</div>` : ''}`;
  }).join('');

  const porOrigem = Object.keys(ORIGEM).map((k) => ({ k, n: lista.filter((c) => c.origem === k).length }))
    .sort((a, b) => b.n - a.n);
  const origens = porOrigem.map(({ k, n }) => `<div class="barra-origem">
      <div class="t"><span>${ORIGEM[k].nome}</span><span style="color:var(--tx2)">${n} ${n === 1 ? 'lead' : 'leads'} · ${pct(n, total)}%</span></div>
      <div class="tr"><div class="f" style="width:${pct(n, total)}%; background:${ORIGEM[k].cor}"></div></div></div>`).join('');

  const porAnuncio = {};
  lista.filter((c) => c.origem === 'anuncio_meta').forEach((c) => {
    const k = c.anuncio_titulo || c.anuncio_id || 'Anúncio sem título';
    porAnuncio[k] = porAnuncio[k] || { conversas: 0, avancou: 0 };
    porAnuncio[k].conversas++;
    if ((etapaDe(c)?.ordem ?? 0) >= 2) porAnuncio[k].avancou++;
  });
  const linhasAnuncio = Object.entries(porAnuncio).sort((a, b) => b[1].avancou - a[1].avancou).slice(0, 8)
    .map(([nome, v]) => `<tr style="border-top:1px solid var(--line2)"><td style="padding:10px 6px">${esc(nome)}</td><td style="padding:10px 6px">${v.conversas}</td><td style="padding:10px 6px">${v.avancou}</td></tr>`).join('');

  $('tela-dashboard').innerHTML = `
    <div class="linha">
      <div class="card kpi"><span class="rot">Conversas novas</span><span class="num">${total}</span><span class="obs">pelo WhatsApp no período</span></div>
      ${kpis}
    </div>
    <div class="linha">

// ================= CONVERSAS =================
function itemConversa(c) {
  const e = etapaDe(c); const cor = COR[e?.temperatura] || COR.frio; const o = ORIGEM[c.origem] || ORIGEM.organico;
  const nome = c.nome || telefoneBonito(c.telefone);
  return `<button class="conv-item ${estado.aberto === c.id ? 'ativo' : ''}" data-contato="${c.id}">
    <span class="av">${esc(nome.charAt(0).toUpperCase())}</span>
    <span class="meio"><span class="nome">${esc(nome)}<small>${quando(c.atualizado_em)}</small></span>
    <span class="orig"><span class="bol" style="background:${cor.c}"></span>${esc(e?.nome ?? 'Sem etapa')} · ${o.nome}</span></span>
  </button>`;
}

function telaConversas() {
  const filtro = (telaConversas._busca || '').toLowerCase();
  const lista = estado.contatos.filter((c) => !filtro || (c.nome || '').toLowerCase().includes(filtro) || c.telefone.includes(filtro));
  $('tela-conversas').innerHTML = `<div class="conv">
    <div class="card conv-lista">
      <div class="busca"><label for="busca">Buscar</label><input id="busca" type="text" placeholder="Nome ou telefone" value="${esc(telaConversas._busca || '')}"></div>
      <div class="itens">${lista.length ? lista.map(itemConversa).join('') : '<div class="vazio" style="padding:16px">Nenhuma conversa ainda.</div>'}</div>
    </div>
    <div class="card chat" id="chat"><div class="vazio" style="padding:24px">Escolha uma conversa à esquerda.</div></div>
    <aside class="card detalhe oculto" id="detalhe" aria-label="Detalhes do lead"></aside>
  </div>`;
  $('busca').addEventListener('input', (e) => {
    telaConversas._busca = e.target.value;
    const pos = e.target.selectionStart; telaConversas(); $('busca').focus(); $('busca').setSelectionRange(pos, pos);
  });
  document.querySelectorAll('[data-contato]').forEach((b) => b.addEventListener('click', () => abrirConversa(Number(b.dataset.contato))));
  if (estado.aberto) abrirConversa(estado.aberto, true);
}

const POR_PAGINA = 50;
function bolhaHTML(m) {
  return `<div class="bolha ${m.direcao}" data-msg="${m.id}">${esc(m.texto || '[' + (m.tipo || 'mídia') + ']')}<small>${new Date(m.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</small></div>`;
}

async function abrirConversa(id, semMarcar) {
  estado.aberto = id;
  if (!semMarcar) document.querySelectorAll('.conv-item').forEach((b) => b.classList.toggle('ativo', Number(b.dataset.contato) === id));
  const c = estado.contatos.find((x) => x.id === id); if (!c) return;

  // só as últimas 50 mensagens
  const [{ data: ult }, { data: hist }] = await Promise.all([
    sb.from('mensagens').select('*').eq('contato_id', id).order('id', { ascending: false }).limit(POR_PAGINA),
    sb.from('historico_etapas').select('*').eq('contato_id', id).order('criado_em', { ascending: false }),
  ]);
  if (estado.aberto !== id) return;
  const msgs = (ult || []).slice().reverse();
  estado.chat = { id, menorId: msgs[0]?.id ?? null, maiorId: msgs[msgs.length - 1]?.id ?? 0, temMais: (ult || []).length === POR_PAGINA };

  const e = etapaDe(c); const cor = COR[e?.temperatura] || COR.frio; const o = ORIGEM[c.origem] || ORIGEM.organico;

  $('chat').innerHTML = `<div class="chat-topo">
      <div><b>${esc(c.nome || telefoneBonito(c.telefone))}</b><div style="font-size:12px; color:var(--tx3)">${esc(telefoneBonito(c.telefone))}</div></div>
      <span class="pill" style="color:${cor.c}; background:${cor.bg}; border-color:${cor.bd}">Etapa: ${esc(e?.nome ?? '—')}</span>
    </div>
    <div class="chat-msgs" id="msgs">
      <div id="msgs-mais" style="text-align:center">${estado.chat.temMais ? '<button class="btn-sec" id="bt-mais">Carregar mensagens anteriores</button>' : ''}</div>
      <div id="msgs-lista" style="display:flex; flex-direction:column; gap:10px">${msgs.map(bolhaHTML).join('') || '<div class="vazio" id="msgs-vazio">Sem mensagens.</div>'}</div>
    </div>`;
  const box = $('msgs'); box.scrollTop = box.scrollHeight;
  if ($('bt-mais')) $('bt-mais').addEventListener('click', carregarAnteriores);

  const nomeEtapa = (eid) => estado.etapas.find((x) => x.id === eid)?.nome ?? '—';
  $('detalhe').classList.remove('oculto');
  $('detalhe').innerHTML = `
    <div><h2 style="margin:0 0 4px">Origem do lead</h2><span style="font-size:12px; color:var(--tx3)">Como essa pessoa chegou</span></div>
    <div style="display:flex; align-items:center; gap:10px; background:var(--verde-bg); border:1px solid var(--verde-bd); border-radius:10px; padding:12px">
      <span class="bol" style="width:10px; height:10px; background:${o.cor}"></span><b>${o.nome}</b></div>
    <div>
      ${c.anuncio_titulo ? `<div class="dl"><span>Anúncio</span><span>${esc(c.anuncio_titulo)}</span></div>` : ''}
      ${c.anuncio_id ? `<div class="dl"><span>ID do anúncio</span><span>${esc(c.anuncio_id)}</span></div>` : ''}
      ${c.anuncio_url ? `<div class="dl"><span>Link</span><span><a href="${esc(c.anuncio_url)}" target="_blank" rel="noopener">abrir</a></span></div>` : ''}
      ${c.link_id ? `<div class="dl"><span>Link</span><span>${esc((estado.links || []).find((l) => l.id === c.link_id)?.nome ?? 'Link rastreável')}</span></div>` : ''}
      ${c.ref_code ? `<div class="dl"><span>Código</span><span>${esc(c.ref_code)}</span></div>` : ''}
      <div class="dl"><span>Primeiro contato</span><span>${new Date(c.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span></div>
    </div>
    <div><b style="display:block; margin-bottom:8px">Etapa no funil</b><div class="etapas-bt">
      ${estado.etapas.map((x) => {
        const k = COR[x.temperatura] || COR.frio; const sel = x.id === c.etapa_id;
        return `<button data-mover="${x.id}" aria-pressed="${sel}" style="color:${sel ? '#fff' : k.c}; background:${sel ? k.c : k.bg}; border-color:${sel ? k.c : k.bd}; font-weight:${sel ? 700 : 500}">${esc(x.nome)}</button>`;
      }).join('')}
    </div></div>
    <div><b style="display:block; margin-bottom:8px">Histórico</b><div class="hist">
      ${(hist || []).map((h) => `<span>${quando(h.criado_em)} · ${esc(nomeEtapa(h.etapa_id))} <span style="color:var(--tx3)">(${esc(h.motivo || '')}${h.enviado_meta ? ' · enviado à Meta' : ''})</span></span>`).join('') || 'Sem histórico.'}
    </div></div>`;
  document.querySelectorAll('[data-mover]').forEach((b) => b.addEventListener('click', () => moverEtapa(c.id, Number(b.dataset.mover))));
}

async function carregarAnteriores() {
  const ch = estado.chat; if (!ch || !ch.menorId) return;
  const { data } = await sb.from('mensagens').select('*').eq('contato_id', ch.id).lt('id', ch.menorId).order('id', { ascending: false }).limit(POR_PAGINA);
  if (estado.chat !== ch) return;
  const antigas = (data || []).slice().reverse();
  const box = $('msgs'); const alturaAntes = box.scrollHeight;
  $('msgs-lista').insertAdjacentHTML('afterbegin', antigas.map(bolhaHTML).join(''));
  if (antigas.length) ch.menorId = antigas[0].id;
  ch.temMais = (data || []).length === POR_PAGINA;
  if (!ch.temMais) $('msgs-mais').innerHTML = '<span style="font-size:12px; color:var(--tx3)">Início da conversa</span>';
  box.scrollTop = box.scrollHeight - alturaAntes; // mantém a posição de leitura
}

// mensagens novas chegam sozinhas (a cada 4 segundos, só com a conversa aberta)
async function buscarNovas() {
  const ch = estado.chat;
  if (!ch || estado.tela !== 'conversas' || document.hidden || !$('msgs-lista')) return;
  const { data } = await sb.from('mensagens').select('*').eq('contato_id', ch.id).gt('id', ch.maiorId).order('id').limit(100);
  if (estado.chat !== ch || !data || !data.length) return;
  const box = $('msgs'); const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if ($('msgs-vazio')) $('msgs-vazio').remove();
  $('msgs-lista').insertAdjacentHTML('beforeend', data.map(bolhaHTML).join(''));
  ch.maiorId = data[data.length - 1].id;
  if (noFim) box.scrollTop = box.scrollHeight;
}
setInterval(buscarNovas, 4000);

// a lista de conversas atualiza sozinha sem fechar a conversa aberta
async function atualizarListaConversas() {
  if (estado.tela !== 'conversas' || document.hidden || !estado.site) return;
  const { data } = await sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000);
  if (!data) return;
  estado.contatos = data;
  const filtro = (telaConversas._busca || '').toLowerCase();
  const lista = data.filter((c) => !filtro || (c.nome || '').toLowerCase().includes(filtro) || c.telefone.includes(filtro));
  const itens = document.querySelector('.conv-lista .itens'); if (!itens) return;
  itens.innerHTML = lista.map(itemConversa).join('') || '<div class="vazio" style="padding:16px">Nenhuma conversa ainda.</div>';
  itens.querySelectorAll('[data-contato]').forEach((b) => b.addEventListener('click', () => abrirConversa(Number(b.dataset.contato))));
}
setInterval(atualizarListaConversas, 15000);

// ================= MOVER ETAPA =================
async function moverEtapa(contatoId, etapaId) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${FN_MOVER}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY },
      body: JSON.stringify({ contato_id: contatoId, etapa_id: etapaId }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) { toast(j.erro || 'Não foi possível mudar a etapa.'); return; }
    toast(j.enviado_meta ? 'Etapa atualizada e evento enviado à Meta.' : 'Etapa atualizada.');
    await carregar();
  } catch (_) { toast('Sem conexão. Tente de novo.'); }
}

// ================= CONFIGURAÇÕES (só admin) =================
async function chamarAdmin(corpo) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return { erro: 'Faça login de novo.' }; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${FN_ADMIN}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY },
      body: JSON.stringify(corpo),
    });
    return await res.json().catch(() => ({ erro: 'Resposta inválida do servidor.' }));
  } catch (_) { return { erro: 'Sem conexão com a função de configurações.' }; }
}

function slug(t) {
  return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

async function telaConfig() {
  const novo = !!estado.novoCliente;
  const site = novo ? { id: '', nome: '', pixel_id: '', allowed_origins: [], whatsapp_phone_number_id: '' }
                    : (estado.sites.find((x) => x.id === estado.site) || {});
  if (!estado.eventos) {
    const { data } = await sb.from('eventos_meta').select('*').order('ordem');
    estado.eventos = data || [];
  }
  if (!novo) {
    estado.funilEdit = estado.etapas.map((e) => ({ ...e, palavras_txt: (e.palavras_chave || []).join(', ') }));
  }
  const dominios = [...new Set((site.allowed_origins || []).map((o) => o.replace(/^https?:\/\/(www\.)?/, '')))].join('\n');

  $('subtitulo').textContent = novo ? 'Cadastrando um cliente novo' : (site.nome || '');
  $('tela-config').innerHTML = `
  <div style="display:flex; flex-direction:column; gap:18px">
    <section class="card" style="display:flex; flex-direction:column; gap:14px">
      <h2 style="margin:0">${novo ? 'Novo cliente' : 'Dados do cliente'}</h2>
      <div class="linha">
        <div style="flex:1 1 260px"><label for="cf-nome">Nome do cliente</label><input id="cf-nome" type="text" value="${esc(site.nome)}" placeholder="Ex.: Barbearia Avante"></div>
        <div style="flex:1 1 220px"><label for="cf-id">ID (aparece no código do site)</label><input id="cf-id" type="text" value="${esc(site.id)}" ${novo ? '' : 'disabled'} placeholder="barbearia-avante"></div>
      </div>
      <div class="linha">
        <div style="flex:1 1 260px"><label for="cf-pixel">ID do pixel</label><input id="cf-pixel" type="text" inputmode="numeric" value="${esc(site.pixel_id)}" placeholder="Gerenciador de Eventos › pixel › Configurações"></div>
        <div style="flex:1 1 260px"><label for="cf-token">Token da API de Conversões</label><input id="cf-token" type="password" autocomplete="off" placeholder="${novo ? 'Cole o token aqui' : 'Deixe vazio pra manter o atual'}"></div>
      </div>
      <div class="linha">
        <div style="flex:1 1 260px"><label for="cf-dom">Site(s) do cliente, um por linha</label><textarea id="cf-dom" rows="2" style="width:100%; background:#F6FAF7; border:1px solid #CFDCD3; border-radius:10px; padding:11px 13px; font:inherit; color:var(--tx)" placeholder="barbeariaavante.com.br">${esc(dominios)}</textarea></div>
        <div style="flex:1 1 260px"><label for="cf-wpp">ID do número do WhatsApp (phone_number_id)</label><input id="cf-wpp" type="text" inputmode="numeric" value="${esc(site.whatsapp_phone_number_id || '')}" placeholder="App na Meta › WhatsApp › Configuração da API"></div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center">
        <button class="btn" id="cf-salvar">${novo ? 'Cadastrar cliente' : 'Salvar dados'}</button>
        ${novo ? '<button class="btn-sec" id="cf-cancelar">Cancelar</button>' : '<button class="btn-sec" id="cf-testar">Testar conexão com a Meta</button>'}
        <span id="cf-status" style="font-size:13px; color:var(--tx2)"></span>
      </div>
    </section>

    ${novo ? '' : `
    <section class="card" style="display:flex; flex-direction:column; gap:12px">
      <h2 style="margin:0">Código do site</h2>
      <p style="margin:0; color:var(--tx2)">Cole uma vez no &lt;head&gt; do site do cliente (ou numa tag HTML personalizada do GTM). Ele cuida do pixel e do envio pelo servidor.</p>
      <pre id="cf-codigo" style="margin:0; overflow-x:auto; background:#F6FAF7; border:1px solid #CFDCD3; border-radius:10px; padding:14px; font-size:12px; line-height:1.6; white-space:pre">${esc(`<script src="${TRACKER_URL}"\n  data-site="${site.id}"\n  data-endpoint="${ENDPOINT_TRACK}"\n  data-pixel="${site.pixel_id}"\n  defer><\/script>`)}</pre>
      <div><button class="btn-sec" id="cf-copiar">Copiar código</button></div>
    </section>

    <section class="card" style="display:flex; flex-direction:column; gap:12px">
      <h2 style="margin:0">Funil do cliente</h2>
      <p style="margin:0; color:var(--tx2)">Cada etapa pode mandar um evento pra Meta quando o contato chega nela. Palavras-chave separadas por vírgula fazem o contato avançar sozinho.</p>
      <div id="cf-funil" style="display:flex; flex-direction:column; gap:10px"></div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center">
        <button class="btn-sec" id="cf-add-etapa">+ Adicionar etapa</button>
        <button class="btn" id="cf-salvar-funil">Salvar funil</button>
        <span id="cf-funil-status" style="font-size:13px; color:var(--tx2)"></span>
      </div>
    </section>

    <section class="card" style="display:flex; flex-direction:column; gap:12px">
      <h2 style="margin:0">Acesso do cliente ao painel</h2>
      <div id="cf-usuarios" style="font-size:13px; color:var(--tx2)">Carregando…</div>
      <div class="linha">
        <div style="flex:1 1 200px"><label for="us-nome">Nome</label><input id="us-nome" type="text" placeholder="Ex.: Victor"></div>
        <div style="flex:1 1 220px"><label for="us-email">E-mail</label><input id="us-email" type="email" autocomplete="off"></div>
        <div style="flex:1 1 180px"><label for="us-senha">Senha (mín. 8)</label><input id="us-senha" type="text" autocomplete="off"></div>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap"><button class="btn-sec" id="us-criar">Criar acesso</button><span id="us-status" style="font-size:13px; color:var(--tx2)"></span></div>
    </section>`}
  </div>`;

  if (novo) $('cf-nome').addEventListener('input', () => { $('cf-id').value = slug($('cf-nome').value); });
  $('cf-salvar').addEventListener('click', salvarCliente);
  if (novo) { $('cf-cancelar').addEventListener('click', () => { estado.novoCliente = false; estado.tela = 'dashboard'; marcarMenu(); carregar(); }); return; }

  $('cf-testar').addEventListener('click', async () => {
    $('cf-status').textContent = 'Testando…';
    const r = await chamarAdmin({ acao: 'testar_meta', site_id: site.id });
    $('cf-status').textContent = r.mensagem || r.erro || '';
    $('cf-status').style.color = r.ok ? 'var(--verde)' : 'var(--quente)';
  });
  $('cf-copiar').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('cf-codigo').textContent); $('cf-copiar').textContent = 'Copiado ✓'; }
    catch (_) { toast('Selecione o código e copie com Ctrl + C.'); }
  });
  desenharFunil();
  $('cf-add-etapa').addEventListener('click', () => {
    estado.funilEdit.push({ id: null, nome: '', temperatura: 'morno', evento_meta: null, valor_padrao: null, palavras_txt: '' });
    desenharFunil();
  });
  $('cf-salvar-funil').addEventListener('click', salvarFunil);
  $('us-criar').addEventListener('click', criarUsuario);
  listarUsuarios(site.id);
}

function desenharFunil() {
  const codigos = new Set(estado.eventos.map((e) => e.codigo));
  const opcoesEvento = (atual) => {
    const personalizado = atual && !codigos.has(atual);
    return `<option value="" ${!atual ? 'selected' : ''}>Nenhum (não envia)</option>` +
      estado.eventos.map((e) => `<option value="${esc(e.codigo)}" ${atual === e.codigo ? 'selected' : ''}>${esc(e.nome_pt)} (${esc(e.codigo)})</option>`).join('') +
      `<option value="__personalizado" ${personalizado ? 'selected' : ''}>Evento personalizado…</option>`;
  };
  $('cf-funil').innerHTML = estado.funilEdit.map((e, i) => {
    const cor = COR[e.temperatura] || COR.frio;
    const personalizado = e.evento_meta && !codigos.has(e.evento_meta);
    return `<div style="border:1px solid ${cor.bd}; background:${cor.bg}; border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
        <b style="color:${cor.c}">Etapa ${i + 1}</b>
        <div style="display:flex; gap:6px">
          <button class="btn-sec" data-acao="subir" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir etapa ${i + 1}">↑</button>
          <button class="btn-sec" data-acao="descer" data-i="${i}" ${i === estado.funilEdit.length - 1 ? 'disabled' : ''} aria-label="Descer etapa ${i + 1}">↓</button>
          <button class="btn-sec" data-acao="remover" data-i="${i}" aria-label="Remover etapa ${i + 1}">Remover</button>
        </div>
      </div>
      <div class="linha" style="gap:10px">
        <div style="flex:2 1 180px"><label for="et-nome-${i}">Nome</label><input id="et-nome-${i}" type="text" data-campo="nome" data-i="${i}" value="${esc(e.nome)}" placeholder="Ex.: Agendou"></div>
        <div style="flex:1 1 120px"><label for="et-temp-${i}">Temperatura</label><select id="et-temp-${i}" data-campo="temperatura" data-i="${i}">
          ${['frio', 'morno', 'quente'].map((t) => `<option value="${t}" ${e.temperatura === t ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}
        </select></div>
        <div style="flex:2 1 220px"><label for="et-ev-${i}">Evento enviado à Meta</label><select id="et-ev-${i}" data-campo="evento_sel" data-i="${i}">${opcoesEvento(e.evento_meta)}</select></div>
        <div style="flex:1 1 110px"><label for="et-valor-${i}">Valor (R$)</label><input id="et-valor-${i}" type="text" inputmode="decimal" data-campo="valor_padrao" data-i="${i}" value="${e.valor_padrao ?? ''}" placeholder="opcional"></div>
      </div>
      ${personalizado || e._personalizado ? `<div><label for="et-evp-${i}">Nome do evento personalizado (sem espaço)</label><input id="et-evp-${i}" type="text" data-campo="evento_meta" data-i="${i}" value="${esc(e.evento_meta || '')}" placeholder="Ex.: AgendouCorte"></div>` : ''}
      <div><label for="et-pal-${i}">Palavras-chave (separadas por vírgula)</label><input id="et-pal-${i}" type="text" data-campo="palavras_txt" data-i="${i}" value="${esc(e.palavras_txt || '')}" placeholder="agendado, confirmado, marcado"></div>
    </div>`;
  }).join('');

  document.querySelectorAll('#cf-funil [data-campo]').forEach((el) => {
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const e = estado.funilEdit[Number(el.dataset.i)];
      const campo = el.dataset.campo;
      if (campo === 'evento_sel') {
        if (el.value === '__personalizado') { e._personalizado = true; e.evento_meta = ''; }
        else { e._personalizado = false; e.evento_meta = el.value || null; }
        desenharFunil(); return;
      }
      e[campo] = el.value;
      if (campo === 'temperatura') desenharFunil();
    });
  });
  document.querySelectorAll('#cf-funil [data-acao]').forEach((b) => b.addEventListener('click', () => {
    const i = Number(b.dataset.i); const l = estado.funilEdit;
    if (b.dataset.acao === 'subir' && i > 0) [l[i - 1], l[i]] = [l[i], l[i - 1]];
    if (b.dataset.acao === 'descer' && i < l.length - 1) [l[i + 1], l[i]] = [l[i], l[i + 1]];
    if (b.dataset.acao === 'remover') {
      if (l.length === 1) { toast('O funil precisa de pelo menos 1 etapa.'); return; }
      if (!confirmarRemocao(l[i])) return;
      l.splice(i, 1);
    }
    desenharFunil();
  }));
}

function confirmarRemocao(etapa) {
  const qtd = estado.contatos.filter((c) => c.etapa_id === etapa.id).length;
  if (!qtd) return true;
  return window.confirm(`${qtd} ${qtd === 1 ? 'contato está' : 'contatos estão'} em "${etapa.nome}". Ao salvar, ${qtd === 1 ? 'ele volta' : 'eles voltam'} pra primeira etapa. Remover mesmo assim?`);
}

async function salvarFunil() {
  $('cf-funil-status').textContent = 'Salvando…'; $('cf-funil-status').style.color = 'var(--tx2)';
  const etapas = estado.funilEdit.map((e) => ({
    id: e.id, nome: e.nome, temperatura: e.temperatura, evento_meta: e.evento_meta || null,
    valor_padrao: e.valor_padrao, palavras_chave: String(e.palavras_txt || '').split(',').map((p) => p.trim()).filter(Boolean),
  }));
  const r = await chamarAdmin({ acao: 'salvar_funil', site_id: estado.site, etapas });
  if (!r.ok) { $('cf-funil-status').textContent = r.erro || 'Erro ao salvar.'; $('cf-funil-status').style.color = 'var(--quente)'; return; }
  const { data } = await sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem');
  estado.etapas = data || [];
  const { data: cts } = await sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000);
  estado.contatos = cts || [];
  telaConfig();
  toast('Funil salvo.');
}

async function salvarCliente() {
  const novo = !!estado.novoCliente;
  $('cf-status').textContent = 'Salvando…'; $('cf-status').style.color = 'var(--tx2)';
  const r = await chamarAdmin({
    acao: 'salvar_cliente', novo,
    id: $('cf-id').value.trim(), nome: $('cf-nome').value.trim(),
    pixel_id: $('cf-pixel').value.trim(), token: $('cf-token').value.trim(),
    origens: $('cf-dom').value.split('\n'), whatsapp_phone_number_id: $('cf-wpp').value.trim(),
  });
  if (!r.ok) { $('cf-status').textContent = r.erro || 'Erro ao salvar.'; $('cf-status').style.color = 'var(--quente)'; return; }
  const { data: sites } = await sb.from('sites').select('id, nome, pixel_id, allowed_origins, whatsapp_phone_number_id').eq('ativo', true).order('nome');
  estado.sites = sites || [];
  $('sel-site').innerHTML = estado.sites.map((s) => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  estado.site = r.id; $('sel-site').value = r.id; estado.novoCliente = false;
  toast(novo ? 'Cliente cadastrado. Agora teste a conexão e copie o código do site.' : 'Dados salvos.');
  await carregar();
}

async function listarUsuarios(siteId) {
  const { data } = await sb.from('perfis').select('nome, papel').eq('site_id', siteId);
  $('cf-usuarios').innerHTML = data && data.length
    ? 'Já têm acesso: ' + data.map((p) => `<b style="color:var(--tx)">${esc(p.nome)}</b>`).join(', ')
    : 'Nenhum acesso criado pra este cliente ainda.';
}

async function criarUsuario() {
  $('us-status').textContent = 'Criando…'; $('us-status').style.color = 'var(--tx2)';
  const r = await chamarAdmin({ acao: 'criar_usuario', site_id: estado.site, nome: $('us-nome').value, email: $('us-email').value, senha: $('us-senha').value });
  if (!r.ok) { $('us-status').textContent = r.erro || 'Erro.'; $('us-status').style.color = 'var(--quente)'; return; }
  $('us-status').textContent = 'Acesso criado. Mande o e-mail e a senha pro cliente.'; $('us-status').style.color = 'var(--verde)';
  $('us-senha').value = '';
  listarUsuarios(estado.site);
}

function marcarMenu() {
  document.querySelectorAll('[data-tela]').forEach((x) => x.classList.toggle('ativo', x.dataset.tela === estado.tela));
}
$('bt-novo-cliente').addEventListener('click', () => {
  estado.novoCliente = true; estado.tela = 'config'; marcarMenu(); desenhar();
});

// ================= NAVEGAÇÃO =================
document.querySelectorAll('[data-tela]').forEach((b) => b.addEventListener('click', () => {
  estado.tela = b.dataset.tela;
  if (estado.novoCliente) { estado.novoCliente = false; carregar(); }
  document.querySelectorAll('[data-tela]').forEach((x) => x.classList.toggle('ativo', x === b));
  desenhar();
}));
$('sel-site').addEventListener('change', (e) => { estado.site = e.target.value; estado.aberto = null; estado.novoCliente = false; carregar(); });
$('sel-periodo').addEventListener('change', desenhar);
$('bt-atualizar').addEventListener('click', carregar);
setInterval(() => { if (!document.hidden && estado.perfil && !['config', 'links', 'conversas'].includes(estado.tela)) carregar(); }, 30000);

iniciar();
</script>
</body>
</html>
