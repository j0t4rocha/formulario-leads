<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Radar</title>
<script>try { if (localStorage.getItem('radar-tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (_) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Geist:wght@500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #07080A; --card: rgba(20, 22, 26, 0.65); --card-solido: #121417; --side: rgba(12, 14, 16, 0.78);
    --line: rgba(255, 255, 255, 0.09); --line2: rgba(255, 255, 255, 0.06);
    --tx: #F4F6F5; --tx2: #A6B0AA; --tx3: #85908A;
    --verde: #10B981; --verde-claro: #34D399; --verde-bg: rgba(16, 185, 129, 0.12); --verde-bd: rgba(16, 185, 129, 0.38);
    --frio: #60A5FA; --frio-bg: rgba(96, 165, 250, 0.12); --frio-bd: rgba(96, 165, 250, 0.38);
    --morno: #FBBF24; --morno-bg: rgba(251, 191, 36, 0.12); --morno-bd: rgba(251, 191, 36, 0.38);
    --quente: #F87171; --quente-bg: rgba(248, 113, 113, 0.12); --quente-bd: rgba(248, 113, 113, 0.38);
    --campo: rgba(255, 255, 255, 0.04); --campo-bd: rgba(255, 255, 255, 0.13);
    --bolha-saida: rgba(16, 185, 129, 0.16); --bolha-entrada: rgba(255, 255, 255, 0.06);
    --vidro: blur(14px);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--tx); font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(16, 185, 129, 0.10), transparent 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(16, 185, 129, 0.07), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  h1, h2, .num, .logo span { font-family: 'Geist', 'DM Sans', sans-serif; letter-spacing: -0.025em; }
  .num, table, .tab { font-variant-numeric: tabular-nums; }
  code, .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  button, input, select, textarea { font: inherit; }
  ::selection { background: #10B981; color: #050807; }
  input, textarea, select { accent-color: #10B981; }
  .oculto { display: none !important; }
  a { color: var(--verde-claro); }

  /* foco: verde, nunca azul */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--verde-claro); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, .sel-bt:focus-visible {
    outline: none; border-color: #10B981 !important; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22);
  }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.45); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-ic { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, #34D399, #059669); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(16,185,129,.35); }
  .logo-ic svg { stroke: #04130C; }
  .logo span { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; }
  .logo span::after { content: '.'; color: var(--verde); }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--tx2); }
  input[type=email], input[type=password], input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; background: var(--campo); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 11px 13px; color: var(--tx);
  }
  input::placeholder, textarea::placeholder { color: #6E7973; }
  option { background: #121417; color: var(--tx); }
  .btn { background: var(--verde); color: #04130C; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; min-height: 44px; box-shadow: 0 0 0 1px rgba(52,211,153,.35), 0 8px 24px rgba(16,185,129,.18); }
  .btn:hover { background: var(--verde-claro); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-sec { background: rgba(255,255,255,.04); color: var(--tx); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
  .btn-sec:hover { border-color: var(--verde-bd); background: var(--verde-bg); }
  .btn-sec:disabled { opacity: .45; cursor: default; }
  .erro { color: var(--quente); font-size: 13px; min-height: 18px; }

  /* app */
  #app { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 248px; background: var(--side); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; }
  nav .menu { display: flex; flex-direction: column; gap: 4px; }
  nav .menu button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--tx2); font-weight: 500; cursor: pointer; text-align: left; }
  nav .menu button:hover { color: var(--tx); background: rgba(255,255,255,.04); }
  nav .menu button.ativo { background: var(--verde-bg); border-color: var(--verde-bd); color: var(--verde-claro); font-weight: 700; }
  nav .rodape { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--tx2); }
  main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; }
  .topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .topo h1 { margin: 0; font-size: 28px; }
  .topo p { margin: 4px 0 0; color: var(--tx2); }
  .card { background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .card h2 { margin: 0 0 14px; font-size: 17px; }
  .linha { display: flex; flex-wrap: wrap; gap: 16px; }
  .kpi { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(52, 211, 153, 0.45); }
  .kpi .rot { color: var(--tx2); font-size: 13px; }
  .kpi .num { font-size: 32px; font-weight: 700; }
  .kpi .obs { color: var(--tx3); font-size: 12px; }
  .vazio { color: var(--tx3); padding: 18px 0; }

  /* select próprio (sem o azul do navegador) */
  .sel { position: relative; width: 100%; }
  .sel.auto { width: auto; }
  .sel > select { position: absolute; inset: 0; opacity: 0; pointer-events: none; width: 100%; }
  .sel-bt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--campo); border: 1px solid var(--campo-bd); border-radius: 10px; padding: 11px 13px; color: var(--tx); cursor: pointer; text-align: left; }
  .sel-bt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-bt::after { content: ''; width: 8px; height: 8px; border-right: 2px solid var(--verde-claro); border-bottom: 2px solid var(--verde-claro); transform: rotate(45deg) translateY(-3px); flex-shrink: 0; }
  .sel.aberto .sel-bt { border-color: #10B981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22); }
  .sel-lista { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); min-width: 180px; max-height: 280px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: rgba(14, 16, 19, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .sel-lista li { padding: 9px 11px; border-radius: 8px; cursor: pointer; color: var(--tx); }
  .sel-lista li[aria-selected="true"] { background: rgba(16, 185, 129, 0.16); color: var(--verde-claro); font-weight: 600; }
  .sel-lista li.foco, .sel-lista li:hover { background: rgba(16, 185, 129, 0.10); }

  /* funil */
  .funil-linha { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .funil-nome { width: 160px; flex-shrink: 0; display: flex; flex-direction: column; }
  .funil-nome b { font-size: 14px; } .funil-nome small { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .funil-trilho { flex: 1; min-width: 0; background: rgba(255,255,255,.03); border-radius: 10px; height: 44px; display: flex; justify-content: center; }
  .funil-barra { height: 44px; border-radius: 10px; border: 1px solid; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 90px; }
  .funil-barra .num { font-size: 20px; font-weight: 700; }
  .barra-origem { margin-bottom: 12px; }
  .barra-origem .t { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .barra-origem .tr { height: 8px; border-radius: 4px; background: var(--line2); }
  .barra-origem .f { height: 8px; border-radius: 4px; }
  .arrastar { cursor: grab; color: var(--tx3); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; user-select: none; }
  .arrastar:hover { color: var(--verde-claro); background: var(--verde-bg); }
  .etapa-ed.arrastando { opacity: .5; }
  .etapa-ed.alvo { outline: 2px dashed var(--verde-claro); outline-offset: 3px; }

  /* conversas */
  .conv { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
  .conv-lista { flex: 1 1 260px; max-width: 330px; padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
  .conv-lista .busca { padding: 12px; border-bottom: 1px solid var(--line); }
  .conv-lista .itens { overflow-y: auto; }
  .conv-item { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--line2); padding: 12px 14px; cursor: pointer; color: inherit; }
  .conv-item:hover { background: rgba(255,255,255,.03); }
  .conv-item.ativo { background: var(--verde-bg); box-shadow: inset 3px 0 0 var(--verde); }
  .av { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
  .conv-item .meio { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .conv-item .nome { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .conv-item .nome small { color: var(--tx3); font-weight: 400; font-size: 11px; }
  .conv-item .orig { font-size: 11px; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
  .bol { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chat { flex: 2 1 380px; min-width: 0; padding: 0; display: flex; flex-direction: column; max-height: 76vh; }
  .chat-topo { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chat-msgs { padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .bolha { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
  .bolha small { display: block; font-size: 10.5px; color: var(--tx3); text-align: right; margin-top: 4px; }
  .bolha.entrada { align-self: flex-start; background: var(--bolha-entrada); border-bottom-left-radius: 4px; }
  .bolha.saida { align-self: flex-end; background: var(--bolha-saida); border-color: rgba(16,185,129,.28); border-bottom-right-radius: 4px; }
  .bolha.saida small b { color: var(--verde-claro); font-weight: 600; }
  .tarefa { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--line2); }
  .tarefa .info { flex: 1 1 240px; min-width: 0; }
  .tarefa .info b { display: block; }
  .tarefa .info small { color: var(--tx3); font-size: 12px; }
  .tarefa .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .tarefa .acoes button { padding: 7px 10px; font-size: 13px; min-height: 36px; }
  .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
  .barra { height: 10px; background: rgba(255,255,255,.07); border-radius: 999px; overflow: hidden; }
  .barra > div { height: 100%; background: linear-gradient(90deg, #059669, #34D399); border-radius: 999px; box-shadow: 0 0 12px rgba(52,211,153,.5); }
  dialog.modal { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(520px, 94vw); background: rgba(16, 18, 21, 0.96); color: var(--tx); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  dialog.modal::backdrop { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
  .modal .corpo { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .previa { white-space: pre-wrap; background: var(--bolha-saida); border: 1px solid rgba(16,185,129,.28); border-radius: 12px; padding: 10px 12px; }
  .creditos { margin: 4px 0 0; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); font-size: 12px; color: var(--tx3); display: flex; flex-direction: column; gap: 6px; }
  .creditos .cab { display: flex; justify-content: space-between; align-items: center; color: var(--tx2); font-size: 13px; }
  .creditos .cab span { font-size: 11px; font-weight: 700; color: var(--verde-claro); background: var(--verde-bg); border: 1px solid var(--verde-bd); border-radius: 999px; padding: 2px 8px; }
  .creditos .val { font-family: 'Geist', sans-serif; font-variant-numeric: tabular-nums; color: var(--tx3); }
  .creditos .val b { font-size: 22px; color: var(--verde-claro); letter-spacing: -0.025em; }
  .creditos.baixo .val b { color: var(--quente); }
  .creditos.baixo .cab span { color: var(--quente); background: var(--quente-bg); border-color: var(--quente-bd); }
  .creditos.baixo .barra > div { background: var(--quente); box-shadow: none; }
  .responder { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
  .responder textarea { flex: 1; resize: none; min-height: 42px; max-height: 140px; }
  .detalhe { flex: 1 1 280px; max-width: 340px; display: flex; flex-direction: column; gap: 16px; }
  .dl { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line2); }
  .dl span:first-child { color: var(--tx3); } .dl span:last-child { text-align: right; word-break: break-word; }
  .etapas-bt { display: flex; flex-wrap: wrap; gap: 8px; }
  .etapas-bt button { border: 1px solid; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .hist { font-size: 12px; color: var(--tx2); display: flex; flex-direction: column; gap: 6px; }
  .pill { font-size: 12px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 4px 10px; }
  pre, .codigo { background: #050507 !important; color: #A7F3D0 !important; border: 1px solid var(--line) !important; }

  /* crm */
  .crm { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .col { flex: 1 1 250px; min-width: 0; background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .col-topo { border: 1px solid; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
  .col-topo b { display: block; } .col-topo small { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .col-topo .num { font-size: 22px; font-weight: 700; }
  .ccard { background: var(--card); backdrop-filter: var(--vidro); -webkit-backdrop-filter: var(--vidro); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .ccard .n { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
  .ccard .n small { color: var(--tx3); font-weight: 400; }
  .ccard .o { font-size: 12px; color: var(--tx2); }
  .ccard .sel-bt, .ccard select { padding: 7px 10px; font-size: 13px; }
  .aviso { background: var(--verde-bg); border: 1px solid var(--verde-bd); border-radius: 12px; padding: 12px 16px; color: var(--tx2); font-size: 13px; }
  .barra-salvar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; background: rgba(10, 12, 14, 0.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--verde-bd); }
  table th { color: var(--tx3); }
  table td, table th { border-color: var(--line2) !important; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(16, 18, 21, 0.96); border: 1px solid var(--verde-bd); color: var(--tx); padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 50; box-shadow: 0 12px 40px rgba(0,0,0,.5); }

  /* ===== tema claro (opcional) ===== */
  html[data-tema="claro"] {
    color-scheme: light;
    --bg: #F2F7F3; --card: rgba(255, 255, 255, 0.78); --card-solido: #FFFFFF; --side: rgba(255, 255, 255, 0.72);
    --line: rgba(15, 26, 19, 0.10); --line2: rgba(15, 26, 19, 0.06);
    --tx: #0F1A13; --tx2: #4D5B52; --tx3: #5F6E64;
    --verde: #10B981; --verde-claro: #047857; --verde-bg: rgba(16, 185, 129, 0.12); --verde-bd: rgba(5, 150, 105, 0.35);
    --frio: #1D4ED8; --frio-bg: #E8F1FE; --frio-bd: #B9D3FB;
    --morno: #B45309; --morno-bg: #FEF3E2; --morno-bd: #F6D199;
    --quente: #B91C1C; --quente-bg: #FDECEC; --quente-bd: #F5B5B5;
    --campo: #FFFFFF; --campo-bd: #CFDCD3;
    --bolha-saida: #D9F2E1; --bolha-entrada: #F1F4F2;
  }
  html[data-tema="claro"] body {
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(16, 185, 129, 0.14), transparent 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(16, 185, 129, 0.10), transparent 60%),
      var(--bg);
  }
  html[data-tema="claro"] ::selection { background: #10B981; color: #FFFFFF; }
  html[data-tema="claro"] input::placeholder, html[data-tema="claro"] textarea::placeholder { color: #7A877F; }
  html[data-tema="claro"] option { background: #FFFFFF; color: var(--tx); }
  html[data-tema="claro"] .card, html[data-tema="claro"] .ccard { box-shadow: 0 1px 2px rgba(15,26,19,.04), inset 0 1px 0 rgba(255,255,255,.7); }
  html[data-tema="claro"] .btn-sec { background: #FFFFFF; }
  html[data-tema="claro"] .sel-lista { background: rgba(255, 255, 255, 0.96); box-shadow: 0 18px 50px rgba(15,26,19,.15); }
  html[data-tema="claro"] dialog.modal { background: rgba(255, 255, 255, 0.98); box-shadow: 0 30px 80px rgba(15,26,19,.25); }
  html[data-tema="claro"] dialog.modal::backdrop { background: rgba(15, 26, 19, 0.35); }
  html[data-tema="claro"] #toast { background: #0F1A13; color: #FFFFFF; }
  html[data-tema="claro"] .barra-salvar { background: rgba(255, 255, 255, 0.9); }
  html[data-tema="claro"] pre, html[data-tema="claro"] .codigo { background: #0F1A13 !important; color: #A7F3D0 !important; }
  html[data-tema="claro"] .barra, html[data-tema="claro"] .funil-trilho { background: #E6EEE8; }
  html[data-tema="claro"] .av { background: #E3ECE6; }
  html[data-tema="claro"] .col { background: rgba(255,255,255,.5); }
  html[data-tema="claro"] nav .menu button:hover, html[data-tema="claro"] .conv-item:hover { background: rgba(15,26,19,.04); }
  html[data-tema="claro"] .creditos { background: rgba(255,255,255,.7); }
  .bt-tema { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .bt-tema .bola { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--verde); }
  html[data-tema="claro"] .bt-tema .bola { background: #0F1A13; }
  html:not([data-tema="claro"]) .bt-tema .bola { background: #FFFFFF; }
  @media (max-width: 700px) { main { padding: 20px 16px; } .funil-nome { width: 110px; } nav { max-width: none; } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="oculto">
  <form class="login-box" id="form-login">
    <div class="logo"><div class="logo-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg></div><span>Radar</span></div>
    <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit" id="bt-entrar">Entrar</button>
    <div class="erro" id="erro-login" role="alert"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<div id="app" class="oculto">
  <nav aria-label="Menu principal">
    <div class="logo"><div class="logo-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg></div><span>Radar</span></div>
    <div id="bloco-cliente">
      <label for="sel-site">Cliente</label>
      <select id="sel-site"></select>
      <button class="btn-sec" id="bt-novo-cliente" style="width:100%; margin-top:8px">+ Novo cliente</button>
    </div>
    <div id="saldo-creditos" class="creditos oculto" title="Créditos pra enviar mensagens pelo Radar"></div>
    <div class="menu">
      <button data-tela="dashboard" class="ativo">Dashboard</button>
      <button data-tela="rotina">Rotina</button>
      <button data-tela="conversas">Conversas</button>
      <button data-tela="crm">CRM / Funil</button>
      <button data-tela="links">Links rastreáveis</button>
      <button data-tela="modelos">Modelos de mensagem</button>
      <button data-tela="config" id="menu-config" class="oculto">Configurações</button>
    </div>
    <div class="rodape">
      <span id="quem"></span>
      <button class="btn-sec bt-tema" id="bt-tema" type="button"><span class="bola" aria-hidden="true"></span><span id="bt-tema-txt">Tema claro</span></button>
      <button class="btn-sec" id="bt-sair">Sair</button>
    </div>
  </nav>

  <main>
    <div class="topo">
      <div><h1 id="titulo">Dashboard</h1><p id="subtitulo"></p></div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
        <select id="sel-periodo" aria-label="Período" style="width:auto">
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>
        <button class="btn-sec" id="bt-atualizar">Atualizar</button>
      </div>
    </div>

    <section id="tela-dashboard"></section>
    <section id="tela-rotina" class="oculto"></section>
    <section id="tela-conversas" class="oculto"></section>
    <section id="tela-crm" class="oculto"></section>
    <section id="tela-links" class="oculto"></section>
    <section id="tela-modelos" class="oculto"></section>
    <section id="tela-config" class="oculto"></section>
  </main>
</div>
<div id="toast" class="oculto" role="status"></div>
<dialog class="modal" id="modal-envio" aria-labelledby="me-titulo"><div class="corpo" id="me-corpo"></div></dialog>

<script src="config.js?v=1"></script>
<script>
// A chave fica no arquivo config.js (assim este arquivo pode ser atualizado sem colar a chave de novo)
const SUPABASE_URL = (window.RADAR && window.RADAR.SUPABASE_URL) || 'https://dwjozttehrdkhbjzkkia.supabase.co';
const SUPABASE_KEY = (window.RADAR && window.RADAR.SUPABASE_KEY) || '';
const FN_MOVER = (window.RADAR && window.RADAR.FN_MOVER) || 'mover-etapa';
const FN_ADMIN = (window.RADAR && window.RADAR.FN_ADMIN) || 'radar-admin';
const TRACKER_URL = 'https://barbeariaquelucra.com/jota-tracker.js?v=1';
const ENDPOINT_TRACK = SUPABASE_URL + '/functions/v1/meta-capi/track';
if (!SUPABASE_KEY) alert('Falta o arquivo radar/config.js com a chave pública do Supabase.');

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const COR = {
  frio:   { c: 'var(--frio)',   bg: 'var(--frio-bg)',   bd: 'var(--frio-bd)' },
  morno:  { c: 'var(--morno)',  bg: 'var(--morno-bg)',  bd: 'var(--morno-bd)' },
  quente: { c: 'var(--quente)', bg: 'var(--quente-bg)', bd: 'var(--quente-bd)' },
};
const ORIGEM = {
  anuncio_meta: { nome: 'Anúncio Meta', cor: '#34D399' },
  site:         { nome: 'Site',          cor: '#FBBF24' },
  link:         { nome: 'Link rastreável', cor: '#A78BFA' },
  organico:     { nome: 'Orgânico / direto', cor: '#8B9690' },
};

const estado = { perfil: null, site: null, tela: 'dashboard', etapas: [], contatos: [], aberto: null };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('oculto');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('oculto'), 3500);
}
function quando(iso) {
  const d = new Date(iso), hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                  : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}
function telefoneBonito(t) {
  const d = String(t || '').replace(/^55/, '');
  return d.length >= 10 ? `(${d.slice(0, 2)}) ${d.slice(2, -4)}-${d.slice(-4)}` : t;
}
function pct(n, total) { return total ? Math.round((n / total) * 100) : 0; }

// ================= LOGIN =================
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('bt-entrar').disabled = true; $('erro-login').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
  $('bt-entrar').disabled = false;
  if (error) { $('erro-login').textContent = 'E-mail ou senha incorretos.'; return; }
  iniciar();
});
$('bt-sair').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('login').classList.remove('oculto'); $('app').classList.add('oculto'); return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!perfil) {
    $('login').classList.remove('oculto');
    $('erro-login').textContent = 'Seu usuário ainda não tem acesso ao Radar. Fale com o Jota.';
    await sb.auth.signOut(); return;
  }
  estado.perfil = perfil;
  $('quem').textContent = `${perfil.nome} · ${perfil.papel === 'admin' ? 'Administrador' : 'Cliente'}`;

  const { data: sites } = await sb.from('sites').select('id, nome, pixel_id, allowed_origins, whatsapp_phone_number_id, whatsapp_waba_id, whatsapp_conectado_em, creditos_mensal, rotina_followup_dias, rotina_reativacao_dias').eq('ativo', true).order('nome');
  estado.sites = sites || [];
  const sel = $('sel-site');
  sel.innerHTML = (sites || []).map((s) => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  if (perfil.papel !== 'admin') $('bloco-cliente').classList.add('oculto');
  else $('menu-config').classList.remove('oculto');
  estado.site = perfil.papel === 'admin' ? (sites?.[0]?.id ?? null) : perfil.site_id;
  sel.value = estado.site || '';

  $('login').classList.add('oculto'); $('app').classList.remove('oculto');
  await carregar();
}

// ================= DADOS =================
async function carregar() {
  if (estado.novoCliente) { desenhar(); return; }
  if (!estado.site) { $('tela-dashboard').innerHTML = '<div class="card vazio">Nenhum cliente cadastrado ainda.</div>'; return; }
  const nomeSite = $('sel-site').selectedOptions[0]?.textContent ?? '';
  $('subtitulo').textContent = nomeSite;

  const [{ data: etapas }, { data: contatos }] = await Promise.all([
    sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem'),
    sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000),
  ]);
  estado.etapas = etapas || [];
  estado.contatos = contatos || [];
  const { data: links } = await sb.from('links').select('*').eq('site_id', estado.site).order('criado_em', { ascending: false });
  estado.links = links || [];
  await atualizarCreditos();
  desenhar();
}

// ================= CRÉDITOS =================
async function atualizarCreditos() {
  const { data } = await sb.from('sites').select('creditos_mensal, creditos_saldo_mensal, creditos_extra').eq('id', estado.site).maybeSingle();
  estado.creditos = data || null;
  const el = $('saldo-creditos'); if (!el) return;
  if (!data) { el.classList.add('oculto'); return; }
  const mensal = data.creditos_mensal || 0, saldoMes = data.creditos_saldo_mensal || 0, extra = data.creditos_extra || 0;
  const total = saldoMes + extra;
  const baixo = total < Math.max(50, mensal * 0.1);
  const pctBarra = mensal ? Math.max(0, Math.min(100, Math.round((saldoMes / mensal) * 100))) : (total ? 100 : 0);
  el.classList.remove('oculto');
  el.classList.toggle('baixo', baixo);
  el.innerHTML = `<div class="cab">Créditos <span>${baixo ? 'Baixo' : 'Ativo'}</span></div>
    <div class="val"><b>${total.toLocaleString('pt-BR')}</b> / ${mensal.toLocaleString('pt-BR')}</div>
    <div class="barra" role="progressbar" aria-label="Créditos do mês" aria-valuenow="${pctBarra}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pctBarra}%"></div></div>
    <div>${extra ? `+ ${extra.toLocaleString('pt-BR')} extras · ` : ''}Renova dia 1º</div>`;
}

function etapaDe(c) { return estado.etapas.find((e) => e.id === c.etapa_id) || null; }
function noPeriodo(lista) {
  const dias = Number($('sel-periodo').value);
  const corte = Date.now() - dias * 864e5;
  return lista.filter((c) => new Date(c.criado_em).getTime() >= corte);
}

function desenhar() {
  ['dashboard', 'rotina', 'conversas', 'crm', 'links', 'modelos', 'config'].forEach((t) => $('tela-' + t).classList.toggle('oculto', t !== estado.tela));
  $('titulo').textContent = { dashboard: 'Dashboard', rotina: 'Rotina', conversas: 'Conversas', crm: 'CRM / Funil', links: 'Links rastreáveis', modelos: 'Modelos de mensagem', config: 'Configurações' }[estado.tela];
  if (estado.tela === 'dashboard') telaDashboard();
  if (estado.tela === 'rotina') telaRotina();
  if (estado.tela === 'conversas') telaConversas();
  if (estado.tela === 'crm') telaCRM();
  if (estado.tela === 'links') telaLinks();
  if (estado.tela === 'modelos') telaModelos();
  if (estado.tela === 'config') telaConfig();
}

// ================= DASHBOARD =================
function telaDashboard() {
  const lista = noPeriodo(estado.contatos);
  const total = lista.length;
  const etapas = estado.etapas;
  // quantos chegaram em cada etapa (ou passaram dela)
  const chegaram = etapas.map((e) => lista.filter((c) => (etapaDe(c)?.ordem ?? 0) >= e.ordem).length);

  const kpis = etapas.slice(1, 3).map((e, i) => {
    const n = chegaram[i + 1];
    return `<div class="card kpi"><span class="rot">${esc(e.nome)}</span><span class="num">${n}</span><span class="obs">${pct(n, total)}% · ${n} de ${total} conversas</span></div>`;
  }).join('');

  const max = Math.max(...chegaram, 1);
  const funil = etapas.map((e, i) => {
    const cor = COR[e.temperatura] || COR.frio;
    const w = Math.max(Math.round((chegaram[i] / max) * 100), 12);
    const queda = i < etapas.length - 1 ? chegaram[i] - chegaram[i + 1] : null;
    return `<div class="funil-linha">
      <div class="funil-nome"><b>${esc(e.nome)}</b><small style="color:${cor.c}">${e.temperatura.toUpperCase()}</small></div>
      <div class="funil-trilho"><div class="funil-barra" style="width:${w}%; background:${cor.bg}; border-color:${cor.bd}">
        <span class="num" style="color:${cor.c}">${chegaram[i]}</span><span style="color:var(--tx2); font-size:12px">pessoas</span></div></div>
    </div>${queda !== null && queda > 0 ? `<div style="font-size:12px; color:var(--tx3); margin:-6px 0 10px 174px">↓ ${queda} ainda não avançaram</div>` : ''}`;
  }).join('');

  const porOrigem = Object.keys(ORIGEM).map((k) => ({ k, n: lista.filter((c) => c.origem === k).length }))
    .sort((a, b) => b.n - a.n);
  const origens = porOrigem.map(({ k, n }) => `<div class="barra-origem">
      <div class="t"><span>${ORIGEM[k].nome}</span><span style="color:var(--tx2)">${n} ${n === 1 ? 'lead' : 'leads'} · ${pct(n, total)}%</span></div>
      <div class="tr"><div class="f" style="width:${pct(n, total)}%; background:${ORIGEM[k].cor}"></div></div></div>`).join('');

  const porAnuncio = {};
  lista.filter((c) => c.origem === 'anuncio_meta').forEach((c) => {
    const k = c.anuncio_titulo || c.anuncio_id || 'Anúncio sem título';
    porAnuncio[k] = porAnuncio[k] || { conversas: 0, avancou: 0 };
    porAnuncio[k].conversas++;
    if ((etapaDe(c)?.ordem ?? 0) >= 2) porAnuncio[k].avancou++;
  });
  const linhasAnuncio = Object.entries(porAnuncio).sort((a, b) => b[1].avancou - a[1].avancou).slice(0, 8)
    .map(([nome, v]) => `<tr style="border-top:1px solid var(--line2)"><td style="padding:10px 6px">${esc(nome)}</td><td style="padding:10px 6px">${v.conversas}</td><td style="padding:10px 6px">${v.avancou}</td></tr>`).join('');

  $('tela-dashboard').innerHTML = `
    <div class="linha">
      <div class="card kpi"><span class="rot">Conversas novas</span><span class="num">${total}</span><span class="obs">pelo WhatsApp no período</span></div>
      ${kpis}
    </div>
    <div class="linha">
      <div class="card" style="flex:3 1 460px"><h2>Funil de aquisição</h2>${etapas.length ? funil : '<div class="vazio">Nenhuma etapa configurada.</div>'}</div>
      <div class="card" style="flex:2 1 300px"><h2>De onde vieram os leads</h2>${origens}<span style="font-size:12px; color:var(--tx3)">Total: ${total} ${total === 1 ? 'lead' : 'leads'}</span></div>
    </div>
    <div class="card"><h2>Anúncios da Meta que mais avançaram no funil</h2>
      ${linhasAnuncio ? `<div style="overflow-x:auto"><table style="width:100%; border-collapse:collapse; min-width:420px">
        <thead><tr style="color:var(--tx3); text-align:left"><th style="padding:8px 6px; font-weight:500">Anúncio</th><th style="padding:8px 6px; font-weight:500">Conversas</th><th style="padding:8px 6px; font-weight:500">Avançaram</th></tr></thead>
        <tbody>${linhasAnuncio}</tbody></table></div>`
      : '<div class="vazio">Ainda não chegou conversa de anúncio de WhatsApp neste período.</div>'}
    </div>`;
}

// ================= CONVERSAS =================
function itemConversa(c) {
  const e = etapaDe(c); const cor = COR[e?.temperatura] || COR.frio; const o = ORIGEM[c.origem] || ORIGEM.organico;
  const nome = c.nome || telefoneBonito(c.telefone);
  return `<button class="conv-item ${estado.aberto === c.id ? 'ativo' : ''}" data-contato="${c.id}">
    <span class="av">${esc(nome.charAt(0).toUpperCase())}</span>
    <span class="meio"><span class="nome">${esc(nome)}<small>${quando(c.atualizado_em)}</small></span>
    <span class="orig"><span class="bol" style="background:${cor.c}"></span>${esc(e?.nome ?? 'Sem etapa')} · ${o.nome}</span></span>
  </button>`;
}

function telaConversas() {
  const filtro = (telaConversas._busca || '').toLowerCase();
  const lista = estado.contatos.filter((c) => !filtro || (c.nome || '').toLowerCase().includes(filtro) || c.telefone.includes(filtro));
  $('tela-conversas').innerHTML = `<div class="conv">
    <div class="card conv-lista">
      <div class="busca"><label for="busca">Buscar</label><input id="busca" type="text" placeholder="Nome ou telefone" value="${esc(telaConversas._busca || '')}"></div>
      <div class="itens">${lista.length ? lista.map(itemConversa).join('') : '<div class="vazio" style="padding:16px">Nenhuma conversa ainda.</div>'}</div>
    </div>
    <div class="card chat" id="chat"><div class="vazio" style="padding:24px">Escolha uma conversa à esquerda.</div></div>
    <aside class="card detalhe oculto" id="detalhe" aria-label="Detalhes do lead"></aside>
  </div>`;
  $('busca').addEventListener('input', (e) => {
    telaConversas._busca = e.target.value;
    const pos = e.target.selectionStart; telaConversas(); $('busca').focus(); $('busca').setSelectionRange(pos, pos);
  });
  document.querySelectorAll('[data-contato]').forEach((b) => b.addEventListener('click', () => abrirConversa(Number(b.dataset.contato))));
  if (estado.aberto) abrirConversa(estado.aberto, true);
}

const POR_PAGINA = 50;
function bolhaHTML(m) {
  const quando = new Date(m.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const rotulo = m.direcao === 'entrada' ? 'Recebido · grátis'
    : m.tipo === 'template' ? '<b>Modelo enviado pelo Radar</b>'
    : '<b>Enviado pelo Radar</b> · 1 crédito';
  return `<div class="bolha ${m.direcao}" data-msg="${m.id}">${esc(m.texto || '[' + (m.tipo || 'mídia') + ']')}<small>${quando} · ${rotulo}</small></div>`;
}

async function abrirConversa(id, semMarcar) {
  estado.aberto = id;
  if (!semMarcar) document.querySelectorAll('.conv-item').forEach((b) => b.classList.toggle('ativo', Number(b.dataset.contato) === id));
  const c = estado.contatos.find((x) => x.id === id); if (!c) return;

  // só as últimas 50 mensagens
  const [{ data: ult }, { data: hist }] = await Promise.all([
    sb.from('mensagens').select('*').eq('contato_id', id).order('id', { ascending: false }).limit(POR_PAGINA),
    sb.from('historico_etapas').select('*').eq('contato_id', id).order('criado_em', { ascending: false }),
  ]);
  if (estado.aberto !== id) return;
  const msgs = (ult || []).slice().reverse();
  estado.chat = { id, menorId: msgs[0]?.id ?? null, maiorId: msgs[msgs.length - 1]?.id ?? 0, temMais: (ult || []).length === POR_PAGINA };

  const e = etapaDe(c); const cor = COR[e?.temperatura] || COR.frio; const o = ORIGEM[c.origem] || ORIGEM.organico;

  $('chat').innerHTML = `<div class="chat-topo">
      <div><b>${esc(c.nome || telefoneBonito(c.telefone))}</b><div style="font-size:12px; color:var(--tx3)">${esc(telefoneBonito(c.telefone))}</div></div>
      <span class="pill" style="color:${cor.c}; background:${cor.bg}; border-color:${cor.bd}">Etapa: ${esc(e?.nome ?? '—')}</span>
    </div>
    <div class="chat-msgs" id="msgs">
      <div id="msgs-mais" style="text-align:center">${estado.chat.temMais ? '<button class="btn-sec" id="bt-mais">Carregar mensagens anteriores</button>' : ''}</div>
      <div id="msgs-lista" style="display:flex; flex-direction:column; gap:10px">${msgs.map(bolhaHTML).join('') || '<div class="vazio" id="msgs-vazio">Sem mensagens.</div>'}</div>
    </div>
    <form class="responder" id="form-responder">
      <label for="resp-texto" class="oculto">Mensagem</label>
      <textarea id="resp-texto" rows="1" placeholder="Escreva uma mensagem…" title="Enter envia · Shift+Enter pula linha"></textarea>
      <button class="btn-sec" id="resp-modelo" type="button" title="Mandar um modelo aprovado (pra quem está há mais de 24h sem falar)">Modelo</button>
      <button class="btn" id="resp-enviar" type="submit">Enviar</button>
    </form>
    <div style="padding:0 14px 10px; font-size:11px; color:var(--tx3)">Cada mensagem enviada pelo Radar usa 1 crédito. Responder pelo celular não gasta crédito.</div>`;
  $('resp-modelo').addEventListener('click', () => abrirEnvio(id, null));
  $('form-responder').addEventListener('submit', (ev) => { ev.preventDefault(); enviarMensagem(id); });
  $('resp-texto').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); enviarMensagem(id); } });
  const box = $('msgs'); box.scrollTop = box.scrollHeight;
  if ($('bt-mais')) $('bt-mais').addEventListener('click', carregarAnteriores);

  const nomeEtapa = (eid) => estado.etapas.find((x) => x.id === eid)?.nome ?? '—';
  $('detalhe').classList.remove('oculto');
  $('detalhe').innerHTML = `
    <div><h2 style="margin:0 0 4px">Origem do lead</h2><span style="font-size:12px; color:var(--tx3)">Como essa pessoa chegou</span></div>
    <div style="display:flex; align-items:center; gap:10px; background:var(--verde-bg); border:1px solid var(--verde-bd); border-radius:10px; padding:12px">
      <span class="bol" style="width:10px; height:10px; background:${o.cor}"></span><b>${o.nome}</b></div>
    <div>
      ${c.anuncio_titulo ? `<div class="dl"><span>Anúncio</span><span>${esc(c.anuncio_titulo)}</span></div>` : ''}
      ${c.anuncio_id ? `<div class="dl"><span>ID do anúncio</span><span>${esc(c.anuncio_id)}</span></div>` : ''}
      ${c.anuncio_url ? `<div class="dl"><span>Link</span><span><a href="${esc(c.anuncio_url)}" target="_blank" rel="noopener">abrir</a></span></div>` : ''}

async function carregarAnteriores() {

// mensagens novas chegam sozinhas (a cada 4 segundos, só com a conversa aberta)
async function buscarNovas() {
  const ch = estado.chat;
  if (!ch || estado.tela !== 'conversas' || document.hidden || !$('msgs-lista')) return;
  const { data } = await sb.from('mensagens').select('*').eq('contato_id', ch.id).gt('id', ch.maiorId).order('id').limit(100);
  if (estado.chat !== ch || !data || !data.length) return;

// ================= MOVER ETAPA =================
async function moverEtapa(contatoId, etapaId) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.reload(); return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${FN_MOVER}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_KEY },
      body: JSON.stringify({ contato_id: contatoId, etapa_id: etapaId }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) { toast(j.erro || 'Não foi possível mudar a etapa.'); return; }
    toast(j.enviado_meta ? 'Etapa atualizada e evento enviado à Meta.' : 'Etapa atualizada.');
    await carregar();
  } catch (_) { toast('Sem conexão. Tente de novo.'); }
}

// ================= ROTINA =================
const TIPO_TAREFA = {
  follow_up: { t: 'Follow-up', c: 'var(--morno)', bg: 'var(--morno-bg)' },
  reativacao: { t: 'Reativação', c: 'var(--frio)', bg: 'var(--frio-bg)' },
  manual: { t: 'Manual', c: 'var(--tx2)', bg: 'rgba(255,255,255,.07)' },
};
function hojeISO() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function diasDesde(iso) { return iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null; }

async function telaRotina() {
  const hoje = hojeISO();
  const inicioHoje = new Date(hoje + 'T00:00:00').toISOString();
  const [{ data: abertas }, { data: feitasHoje }] = await Promise.all([
    sb.from('tarefas').select('*').eq('site_id', estado.site).eq('status', 'aberta').lte('vence_em', hoje).order('vence_em').limit(500),
    sb.from('tarefas').select('id, status').eq('site_id', estado.site).neq('status', 'aberta').gte('concluida_em', inicioHoje).limit(1000),
  ]);
  const { data: futuras } = await sb.from('tarefas').select('*').eq('site_id', estado.site).eq('status', 'aberta').gt('vence_em', hoje).order('vence_em').limit(100);
  if (estado.tela !== 'rotina') return;
  const lista = abertas || [];
  const ids = [...new Set([...lista, ...(futuras || [])].map((t) => t.contato_id).filter(Boolean))];
  const ultimaEntrada = {};
  if (ids.length) {
    const { data: msgs } = await sb.from('mensagens').select('contato_id, criado_em').eq('direcao', 'entrada').in('contato_id', ids).order('criado_em', { ascending: false }).limit(2000);
    (msgs || []).forEach((m) => { if (!ultimaEntrada[m.contato_id]) ultimaEntrada[m.contato_id] = m.criado_em; });
  }
  estado.ultimaEntrada = ultimaEntrada;
  const feitas = (feitasHoje || []).filter((t) => t.status === 'feita').length;
  const puladas = (feitasHoje || []).filter((t) => t.status === 'pulada').length;
  const total = lista.length + feitas + puladas;
  const pctFeito = total ? Math.round(((feitas + puladas) / total) * 100) : 0;
  const atrasadas = lista.filter((t) => t.vence_em < hoje);
  const deHoje = lista.filter((t) => t.vence_em === hoje);

  const linha = (t) => {
    const c = estado.contatos.find((x) => x.id === t.contato_id);
    const tp = TIPO_TAREFA[t.tipo] || TIPO_TAREFA.manual;
    const e = c ? etapaDe(c) : null;
    const dd = diasDesde(ultimaEntrada[t.contato_id]);
    const nome = c ? (c.nome || telefoneBonito(c.telefone)) : 'Sem contato';
    return `<div class="tarefa">
      <div class="info"><b>${esc(nome)} <span class="tag" style="color:${tp.c}; background:${tp.bg}">${tp.t}</span></b>
        <small>${esc(t.titulo || '')}${e ? ' · etapa: ' + esc(e.nome) : ''}${dd !== null ? ` · ${dd === 0 ? 'falou hoje' : `sem mandar mensagem há ${dd} ${dd === 1 ? 'dia' : 'dias'}`}` : ''}${t.vence_em < hoje ? ` · <span style="color:var(--quente)">atrasada desde ${t.vence_em.split('-').reverse().join('/')}</span>` : ''}</small></div>
      <div class="acoes">
        ${c ? `<button class="btn-sec" data-abrir="${c.id}">Abrir conversa</button><button class="btn" data-enviar="${t.id}">Enviar</button>` : ''}
        <button class="btn-sec" data-feita="${t.id}" title="Resolvi por fora (sem gastar crédito)">Feita</button>
        <button class="btn-sec" data-pular="${t.id}">Pular</button>
      </div></div>`;
  };

  $('tela-rotina').innerHTML = `<div style="display:flex; flex-direction:column; gap:18px">
    <section class="card" style="display:flex; flex-direction:column; gap:10px">
      <h2 style="margin:0">Meta do dia</h2>
      <div style="font-size:22px; font-weight:800">${feitas + puladas} de ${total} ${total === 1 ? 'tarefa resolvida' : 'tarefas resolvidas'} <span style="color:var(--verde)">(${pctFeito}%)</span></div>
      <div class="barra" role="progressbar" aria-valuenow="${pctFeito}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pctFeito}%"></div></div>
      <div style="font-size:13px; color:var(--tx2)">${feitas} ${feitas === 1 ? 'feita' : 'feitas'} · ${puladas} ${puladas === 1 ? 'pulada' : 'puladas'} · ${lista.length} ${lista.length === 1 ? 'pendente' : 'pendentes'} (${atrasadas.length} ${atrasadas.length === 1 ? 'atrasada' : 'atrasadas'} + ${deHoje.length} de hoje)</div>
    </section>
    ${atrasadas.length ? `<section class="card"><h2 style="margin:0 0 4px; color:var(--quente)">Atrasadas (${atrasadas.length})</h2>${atrasadas.map(linha).join('')}</section>` : ''}
    <section class="card"><h2 style="margin:0 0 4px">Hoje (${deHoje.length})</h2>${deHoje.length ? deHoje.map(linha).join('') : '<div class="vazio">Nenhuma tarefa pra hoje. As tarefas de follow-up e reativação aparecem sozinhas todo dia às 7h.</div>'}</section>
    ${(futuras || []).length ? `<section class="card"><h2 style="margin:0 0 4px">Próximos dias (${futuras.length})</h2>${futuras.map(linha).join('')}</section>` : ''}
    <section class="card" style="display:flex; flex-direction:column; gap:12px">
      <h2 style="margin:0">Nova tarefa</h2>
      <div class="linha">
        <div style="flex:2 1 220px"><label for="nt-contato">Contato</label><select id="nt-contato"><option value="">Escolha…</option>${estado.contatos.map((c) => `<option value="${c.id}">${esc(c.nome || telefoneBonito(c.telefone))}</option>`).join('')}</select></div>
        <div style="flex:3 1 260px"><label for="nt-titulo">O que fazer</label><input id="nt-titulo" type="text" placeholder="Ex.: ligar pra confirmar o horário de sexta"></div>
        <div style="flex:1 1 150px"><label for="nt-data">Quando</label><input id="nt-data" type="date" value="${hoje}"></div>
      </div>
      <div style="display:flex; gap:10px; align-items:center"><button class="btn-sec" id="nt-criar">Criar tarefa</button><span id="nt-status" style="font-size:13px; color:var(--tx2)"></span></div>
    </section>
  </div>`;

  const atualizar = async (id, status) => {
    const { error } = await sb.from('tarefas').update({ status, concluida_em: new Date().toISOString() }).eq('id', id);
    if (error) { toast('Não consegui salvar: ' + error.message); return; }
    telaRotina();
  };
  document.querySelectorAll('[data-feita]').forEach((b) => b.addEventListener('click', () => atualizar(Number(b.dataset.feita), 'feita')));
  document.querySelectorAll('[data-pular]').forEach((b) => b.addEventListener('click', () => atualizar(Number(b.dataset.pular), 'pulada')));
  document.querySelectorAll('[data-abrir]').forEach((b) => b.addEventListener('click', () => {
    estado.aberto = Number(b.dataset.abrir); estado.tela = 'conversas'; marcarMenu(); desenhar();
  }));
  document.querySelectorAll('[data-enviar]').forEach((b) => b.addEventListener('click', () => {
    const t = [...lista, ...(futuras || [])].find((x) => x.id === Number(b.dataset.enviar));
    if (t) abrirEnvio(t.contato_id, t);
  }));
  $('nt-criar').addEventListener('click', async () => {
    const st = $('nt-status'); st.style.color = 'var(--tx2)';
    const contato = Number($('nt-contato').value) || null; const titulo = $('nt-titulo').value.trim();
    if (!titulo) { st.textContent = 'Escreva o que fazer.'; st.style.color = 'var(--quente)'; return; }
    const { error } = await sb.from('tarefas').insert({ site_id: estado.site, contato_id: contato, tipo: 'manual', titulo, vence_em: $('nt-data').value || hoje });
    if (error) { st.textContent = 'Erro: ' + error.message; st.style.color = 'var(--quente)'; return; }
    toast('Tarefa criada.'); telaRotina();
  });
}

// ---------- janela de envio (texto livre ou modelo) ----------
async function abrirEnvio(contatoId, tarefa) {
  const c = estado.contatos.find((x) => x.id === contatoId);
  if (!c) return;
  const dlg = $('modal-envio'); const corpo = $('me-corpo');
  let ultima = estado.ultimaEntrada && estado.ultimaEntrada[contatoId];
  if (ultima === undefined) {
    const { data } = await sb.from('mensagens').select('criado_em').eq('contato_id', contatoId).eq('direcao', 'entrada').order('criado_em', { ascending: false }).limit(1);
    ultima = data?.[0]?.criado_em || null;
  }
  const dentro24h = ultima && (Date.now() - new Date(ultima).getTime()) < 24 * 3600 * 1000;
  const nome = c.nome || telefoneBonito(c.telefone);
  const primeiroNome = (c.nome || '').trim().split(/\s+/)[0] || '';
  corpo.innerHTML = `<h2 style="margin:0" id="me-titulo">Enviar pra ${esc(nome)}</h2>
    <div style="font-size:13px; color:var(--tx2)">${dentro24h ? 'Falou nas últimas 24h: pode mandar mensagem livre (1 crédito) ou um modelo.' : 'Está há mais de 24h sem mandar mensagem: pela regra do WhatsApp, só dá pra enviar um <b>modelo aprovado</b>.'}</div>
    ${dentro24h ? `<div><label for="me-texto">Mensagem livre</label><textarea id="me-texto" rows="3" style="width:100%; background:var(--campo); border:1px solid var(--campo-bd); border-radius:10px; padding:10px 12px; font:inherit"></textarea>
      <div style="margin-top:8px"><button class="btn" id="me-enviar-texto">Enviar mensagem (1 crédito)</button></div></div>
      <div style="border-top:1px solid var(--line2); padding-top:10px; font-weight:700">Ou use um modelo</div>` : ''}
    <div id="me-modelos" style="font-size:13px">Carregando modelos aprovados…</div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap"><span id="me-status" style="font-size:13px; color:var(--tx2)"></span></div>
    <div style="display:flex; justify-content:flex-end"><button class="btn-sec" id="me-fechar">Fechar</button></div>`;
  $('me-fechar').addEventListener('click', () => fecharModal());
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');

  const status = (t, ok) => { $('me-status').textContent = t; $('me-status').style.color = ok === false ? 'var(--quente)' : ok ? 'var(--verde)' : 'var(--tx2)'; };
  const depois = async (r) => {
    if (!r.ok) { status(r.erro || 'Não enviou.', false); return; }
    toast('Mensagem enviada.'); fecharModal();
    setTimeout(atualizarCreditos, 8000);
    if (estado.tela === 'rotina') telaRotina();
    if (estado.tela === 'conversas' && estado.chat && estado.chat.id === contatoId && r.mensagem && !document.querySelector(`[data-msg="${r.mensagem.id}"]`)) {
      if ($('msgs-vazio')) $('msgs-vazio').remove();
      $('msgs-lista').insertAdjacentHTML('beforeend', bolhaHTML(r.mensagem)); const box = $('msgs'); box.scrollTop = box.scrollHeight;
    }
  };
  if (dentro24h) $('me-enviar-texto').addEventListener('click', async () => {
    const texto = $('me-texto').value.trim(); if (!texto) { status('Escreva a mensagem.', false); return; }
    status('Enviando…'); depois(await chamarWhats({ acao: 'enviar', contato_id: contatoId, texto, tarefa_id: tarefa?.id }));
  });

  if (!estado.modelosCache || estado.modelosCache.site !== estado.site) {
    const r = await chamarWhats({ acao: 'listar_modelos', site_id: estado.site });
    estado.modelosCache = { site: estado.site, lista: r.ok ? r.modelos : [], erro: r.ok ? null : r.erro };
  }
  const aprovados = estado.modelosCache.lista.filter((m) => m.status === 'APPROVED');
  const alvo = $('me-modelos'); if (!alvo) return;
  if (estado.modelosCache.erro) { alvo.innerHTML = `<span style="color:var(--quente)">${esc(estado.modelosCache.erro)}</span>`; return; }
  if (!aprovados.length) { alvo.innerHTML = 'Nenhum modelo aprovado ainda. Crie um em <b>Modelos de mensagem</b>.'; return; }
  alvo.innerHTML = `<label for="me-modelo">Modelo</label><select id="me-modelo">${aprovados.map((m, i) => `<option value="${i}">${esc(m.nome)} · ${m.categoria === 'MARKETING' ? 'Marketing (10 créditos)' : 'Utilidade (1 crédito)'}</option>`).join('')}</select>
    <div id="me-campos" class="linha" style="margin-top:8px"></div>
    <div id="me-previa" class="previa" style="margin-top:8px"></div>
    <div style="margin-top:8px"><button class="btn" id="me-enviar-modelo">Enviar modelo</button></div>`;
  const desenharCampos = () => {
    const m = aprovados[Number($('me-modelo').value)];
    const vars = [...new Set([...m.texto.matchAll(/\{\{(\d+)\}\}/g)].map((x) => Number(x[1])))].sort((a, b) => a - b);

const META_APP_ID = '1658120649115593';
const META_CONFIG_ID = '1422937496496428';
function carregarSdkMeta() {
  if (window.FB) return Promise.resolve();
  return new Promise((ok, falha) => {
    window.fbAsyncInit = function () {
      FB.init({ appId: META_APP_ID, autoLogAppEvents: true, xfbml: false, version: 'v25.0' });
      ok();
    };
    const sc = document.createElement('script');
    sc.src = 'https://connect.facebook.net/pt_BR/sdk.js'; sc.async = true; sc.defer = true; sc.crossOrigin = 'anonymous';
    sc.onerror = () => falha(new Error('sdk'));
    document.body.appendChild(sc);
  });
}

async function conectarWhatsapp(siteId) {
  const st = $('wa-status');
  st.style.color = 'var(--tx2)'; st.textContent = 'Abrindo a janela da Meta…';
  try { await carregarSdkMeta(); } catch (_) { st.textContent = 'Não consegui carregar o login da Meta. Desative bloqueadores e tente de novo.'; st.style.color = 'var(--quente)'; return; }

  let sessao = null;
  const ouvir = (ev) => {
    if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
    try {
      const d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
      if (d && d.type === 'WA_EMBEDDED_SIGNUP') {
        if (String(d.event || '').startsWith('FINISH')) sessao = d.data || {};
        else if (d.event === 'CANCEL') sessao = { cancelado: true, etapa: d.data?.current_step };
        else if (d.event === 'ERROR') sessao = { erro: d.data?.error_message };
      }
    } catch (_) {}
  };
  window.addEventListener('message', ouvir);

  // o SDK da Meta não aceita função async direto no callback
  FB.login((resp) => { (async () => {
    const code = resp && resp.authResponse && resp.authResponse.code;
    // espera até 8s a Meta mandar o número e a conta
    for (let i = 0; i < 16 && !sessao; i++) await new Promise((r) => setTimeout(r, 500));
    window.removeEventListener('message', ouvir);
    if (!code || sessao?.cancelado) { st.textContent = 'Conexão cancelada.'; return; }
    if (sessao?.erro) { st.textContent = 'A Meta informou um erro: ' + sessao.erro; st.style.color = 'var(--quente)'; return; }
    st.textContent = 'Finalizando a conexão…';
    const r = await chamarAdmin({ acao: 'conectar_whatsapp', site_id: siteId, code, waba_id: sessao?.waba_id, phone_number_id: sessao?.phone_number_id });
    if (!r.ok) { st.textContent = r.erro || 'Erro ao conectar.'; st.style.color = 'var(--quente)'; return; }
    toast('WhatsApp conectado! As novas conversas vão chegar no Radar.');
    const { data: sites } = await sb.from('sites').select('id, nome, pixel_id, allowed_origins, whatsapp_phone_number_id, whatsapp_waba_id, whatsapp_conectado_em, creditos_mensal, rotina_followup_dias, rotina_reativacao_dias').eq('ativo', true).order('nome');
    estado.sites = sites || [];
    telaConfig();
  })(); }, {
    config_id: META_CONFIG_ID,
    response_type: 'code',
    override_default_response_type: true,
    extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' },
  });
}

function desenharFunil() {
  const codigos = new Set(estado.eventos.map((e) => e.codigo));
  const opcoesEvento = (atual) => {
    const personalizado = atual && !codigos.has(atual);
    return `<option value="" ${!atual ? 'selected' : ''}>Nenhum (não envia)</option>` +
      estado.eventos.map((e) => `<option value="${esc(e.codigo)}" ${atual === e.codigo ? 'selected' : ''}>${esc(e.nome_pt)} (${esc(e.codigo)})</option>`).join('') +
      `<option value="__personalizado" ${personalizado ? 'selected' : ''}>Evento personalizado…</option>`;
  };
  $('cf-funil').innerHTML = estado.funilEdit.map((e, i) => {
    const cor = COR[e.temperatura] || COR.frio;
    const personalizado = e.evento_meta && !codigos.has(e.evento_meta);
    return `<div class="etapa-ed" data-pos="${i}" style="border:1px solid ${cor.bd}; background:${cor.bg}; border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
        <b style="color:${cor.c}; display:flex; align-items:center; gap:8px"><span class="arrastar" data-alca="${i}" title="Arraste pra mudar a ordem" aria-hidden="true">⠿</span>Etapa ${i + 1}</b>
        <div style="display:flex; gap:6px">
          <button class="btn-sec" data-acao="subir" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir etapa ${i + 1}">↑</button>
          <button class="btn-sec" data-acao="descer" data-i="${i}" ${i === estado.funilEdit.length - 1 ? 'disabled' : ''} aria-label="Descer etapa ${i + 1}">↓</button>
          <button class="btn-sec" data-acao="remover" data-i="${i}" aria-label="Remover etapa ${i + 1}">Remover</button>
        </div>
      </div>
      <div class="linha" style="gap:10px">
        <div style="flex:2 1 180px"><label for="et-nome-${i}">Nome</label><input id="et-nome-${i}" type="text" data-campo="nome" data-i="${i}" value="${esc(e.nome)}" placeholder="Ex.: Agendou"></div>
        <div style="flex:1 1 120px"><label for="et-temp-${i}">Temperatura</label><select id="et-temp-${i}" data-campo="temperatura" data-i="${i}">
          ${['frio', 'morno', 'quente'].map((t) => `<option value="${t}" ${e.temperatura === t ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}
        </select></div>
        <div style="flex:2 1 220px"><label for="et-ev-${i}">Evento enviado à Meta</label><select id="et-ev-${i}" data-campo="evento_sel" data-i="${i}">${opcoesEvento(e.evento_meta)}</select></div>
        <div style="flex:1 1 110px"><label for="et-valor-${i}">Valor (R$)</label><input id="et-valor-${i}" type="text" inputmode="decimal" data-campo="valor_padrao" data-i="${i}" value="${e.valor_padrao ?? ''}" placeholder="opcional"></div>
      </div>
      ${personalizado || e._personalizado ? `<div><label for="et-evp-${i}">Nome do evento personalizado (sem espaço)</label><input id="et-evp-${i}" type="text" data-campo="evento_meta" data-i="${i}" value="${esc(e.evento_meta || '')}" placeholder="Ex.: AgendouCorte"></div>` : ''}
      <div><label for="et-pal-${i}">Palavras-chave (separadas por vírgula)</label><input id="et-pal-${i}" type="text" data-campo="palavras_txt" data-i="${i}" value="${esc(e.palavras_txt || '')}" placeholder="agendado, confirmado, marcado"></div>
    </div>`;
  }).join('');

  document.querySelectorAll('#cf-funil [data-campo]').forEach((el) => {
    const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const e = estado.funilEdit[Number(el.dataset.i)];
      const campo = el.dataset.campo;
      if (campo === 'evento_sel') {
        if (el.value === '__personalizado') { e._personalizado = true; e.evento_meta = ''; }
        else { e._personalizado = false; e.evento_meta = el.value || null; }
        desenharFunil(); return;
      }
      e[campo] = el.value;
      if (campo === 'temperatura') desenharFunil();
    });
  });
  // arrastar e soltar pra reordenar
  let origem = null;
  document.querySelectorAll('#cf-funil .etapa-ed').forEach((card) => {
    const alca = card.querySelector('[data-alca]');
    alca.addEventListener('pointerdown', () => { card.draggable = true; });
    card.addEventListener('dragstart', (ev) => { origem = Number(card.dataset.pos); card.classList.add('arrastando'); ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', String(origem)); } catch (_) {} });
    card.addEventListener('dragend', () => { card.draggable = false; card.classList.remove('arrastando'); document.querySelectorAll('#cf-funil .alvo').forEach((x) => x.classList.remove('alvo')); });
    card.addEventListener('dragover', (ev) => { if (origem === null) return; ev.preventDefault(); card.classList.add('alvo'); });
    card.addEventListener('dragleave', () => card.classList.remove('alvo'));
    card.addEventListener('drop', (ev) => {
      ev.preventDefault(); const destino = Number(card.dataset.pos);
      if (origem === null || origem === destino) return;
      const l = estado.funilEdit; const [item] = l.splice(origem, 1); l.splice(destino, 0, item);
      origem = null; desenharFunil();
    });
  });
  document.querySelectorAll('#cf-funil [data-acao]').forEach((b) => b.addEventListener('click', () => {
    const i = Number(b.dataset.i); const l = estado.funilEdit;
    if (b.dataset.acao === 'subir' && i > 0) [l[i - 1], l[i]] = [l[i], l[i - 1]];
    if (b.dataset.acao === 'descer' && i < l.length - 1) [l[i + 1], l[i]] = [l[i], l[i + 1]];
    if (b.dataset.acao === 'remover') {
      if (l.length === 1) { toast('O funil precisa de pelo menos 1 etapa.'); return; }
      if (!confirmarRemocao(l[i])) return;
      l.splice(i, 1);
    }
    desenharFunil();
  }));
}

function confirmarRemocao(etapa) {
  const qtd = estado.contatos.filter((c) => c.etapa_id === etapa.id).length;
  if (!qtd) return true;
  return window.confirm(`${qtd} ${qtd === 1 ? 'contato está' : 'contatos estão'} em "${etapa.nome}". Ao salvar, ${qtd === 1 ? 'ele volta' : 'eles voltam'} pra primeira etapa. Remover mesmo assim?`);
}

async function salvarFunil() {
  $('cf-funil-status').textContent = 'Salvando…'; $('cf-funil-status').style.color = 'var(--tx2)';
  const etapas = estado.funilEdit.map((e) => ({
    id: e.id, nome: e.nome, temperatura: e.temperatura, evento_meta: e.evento_meta || null,
    valor_padrao: e.valor_padrao, palavras_chave: String(e.palavras_txt || '').split(',').map((p) => p.trim()).filter(Boolean),
  }));
  const r = await chamarAdmin({ acao: 'salvar_funil', site_id: estado.site, etapas });
  if (!r.ok) { $('cf-funil-status').textContent = r.erro || 'Erro ao salvar.'; $('cf-funil-status').style.color = 'var(--quente)'; return false; }
  const { data } = await sb.from('etapas').select('*').eq('site_id', estado.site).order('ordem');
  estado.etapas = data || [];
  const { data: cts } = await sb.from('contatos').select('*').eq('site_id', estado.site).order('atualizado_em', { ascending: false }).limit(1000);
  estado.contatos = cts || [];
  telaConfig();
  toast('Funil salvo.');
  return true;
}

async function salvarCliente() {
  const novo = !!estado.novoCliente;
  $('cf-status').textContent = 'Salvando…'; $('cf-status').style.color = 'var(--tx2)';
  const r = await chamarAdmin({
    acao: 'salvar_cliente', novo,
    id: $('cf-id').value.trim(), nome: $('cf-nome').value.trim(),
    pixel_id: $('cf-pixel').value.trim(), token: $('cf-token').value.trim(),
    origens: $('cf-dom').value.split('\n'), whatsapp_phone_number_id: $('cf-wpp').value.trim(),
    whatsapp_waba_id: $('cf-waba') ? $('cf-waba').value.trim() : undefined,
    wa_token: $('cf-watoken') ? $('cf-watoken').value.trim() : '',
  });
  if (!r.ok) { $('cf-status').textContent = r.erro || 'Erro ao salvar.'; $('cf-status').style.color = 'var(--quente)'; return false; }
  const { data: sites } = await sb.from('sites').select('id, nome, pixel_id, allowed_origins, whatsapp_phone_number_id, whatsapp_waba_id, whatsapp_conectado_em, creditos_mensal, rotina_followup_dias, rotina_reativacao_dias').eq('ativo', true).order('nome');
  estado.sites = sites || [];
  $('sel-site').innerHTML = estado.sites.map((s) => `<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('');
  estado.site = r.id; $('sel-site').value = r.id; estado.novoCliente = false;
  toast(novo ? 'Cliente cadastrado. Agora teste a conexão e copie o código do site.' : 'Dados salvos.');
  await carregar();
  return true;
}

// Salva cliente + WhatsApp, rotina, créditos e funil de uma vez
async function salvarTudo() {
  const bt = $('bt-salvar-tudo'); const st = $('st-salvar-tudo');
  bt.disabled = true; st.style.color = 'var(--tx2)'; st.textContent = 'Salvando tudo…';
  const site = estado.site; const erros = [];
  const fu = Number($('ro-fu').value), re = Number($('ro-re').value);
  const cr = { mensal: $('cr-mensal').value, adicionar: $('cr-add').value || 0, motivo: $('cr-motivo').value };
  const etapas = estado.funilEdit.map((e) => ({
    id: e.id, nome: e.nome, temperatura: e.temperatura, evento_meta: e.evento_meta || null,
    valor_padrao: e.valor_padrao, palavras_chave: String(e.palavras_txt || '').split(',').map((p) => p.trim()).filter(Boolean),
  }));
  const { error: eRot } = await sb.rpc('salvar_rotina', { p_site: site, p_followup: fu, p_reativacao: re });
  if (eRot) erros.push('Rotina: ' + eRot.message);
  const rCr = await chamarAdmin({ acao: 'creditos', site_id: site, ...cr });
  if (!rCr.ok) erros.push('Créditos: ' + (rCr.erro || 'erro'));
  const rFu = await chamarAdmin({ acao: 'salvar_funil', site_id: site, etapas });
  if (!rFu.ok) erros.push('Funil: ' + (rFu.erro || 'erro'));
  const okCliente = await salvarCliente();
  if (!okCliente) erros.push('Dados do cliente: veja a mensagem no bloco 1');
  await atualizarCreditos();
  if (erros.length) { toast('Algumas partes não salvaram: ' + erros.join(' · ')); }
  else toast('Tudo salvo.');
  const b2 = $('bt-salvar-tudo'); if (b2) b2.disabled = false;
}

}
$('bt-novo-cliente').addEventListener('click', () => {
  estado.novoCliente = true; estado.tela = 'config'; marcarMenu(); desenhar();
});


// ================= SELECT PRÓPRIO (troca o menu nativo, sem azul) =================
function melhorarSelect(sel) {
  if (sel.dataset.enh || sel.multiple || sel.closest('.sel')) return;
  sel.dataset.enh = '1';
  const caixa = document.createElement('div');
  caixa.className = 'sel' + (sel.style.width === 'auto' ? ' auto' : '');
  sel.parentNode.insertBefore(caixa, sel);
  caixa.appendChild(sel);
  sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
  const bt = document.createElement('button');
  bt.type = 'button'; bt.className = 'sel-bt'; bt.setAttribute('aria-haspopup', 'listbox'); bt.setAttribute('aria-expanded', 'false');
  const rotulo = sel.id && document.querySelector(`label[for="${sel.id}"]`);
  const nomeAcess = sel.getAttribute('aria-label') || (rotulo && rotulo.textContent.trim()) || '';
  if (rotulo) { rotulo.addEventListener('click', (ev) => { ev.preventDefault(); bt.focus(); }); }
  caixa.appendChild(bt);
  const lista = document.createElement('ul');
  lista.className = 'sel-lista oculto'; lista.setAttribute('role', 'listbox');
  if (nomeAcess) lista.setAttribute('aria-label', nomeAcess);
  caixa.appendChild(lista);
  let foco = -1;
  const texto = () => {
    const o = sel.options[sel.selectedIndex];
    bt.innerHTML = `<span>${esc(o ? o.textContent : '')}</span>`;
    bt.setAttribute('aria-label', (nomeAcess ? nomeAcess + ': ' : '') + (o ? o.textContent : ''));
    bt.disabled = sel.disabled;
  };
  const montar = () => {
    lista.innerHTML = [...sel.options].map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}">${esc(o.textContent)}</li>`).join('');
  };
  const fechar = () => { caixa.classList.remove('aberto'); lista.classList.add('oculto'); bt.setAttribute('aria-expanded', 'false'); };
  const abrir = () => {
    document.querySelectorAll('.sel.aberto').forEach((x) => x !== caixa && x._fechar && x._fechar());
    montar(); foco = sel.selectedIndex; marcarFoco();
    caixa.classList.add('aberto'); lista.classList.remove('oculto'); bt.setAttribute('aria-expanded', 'true');
  };
  const marcarFoco = () => {
    lista.querySelectorAll('li').forEach((li, i) => li.classList.toggle('foco', i === foco));
    const li = lista.querySelector('li.foco'); if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
  };
  const escolher = (i) => {
    if (i < 0 || i >= sel.options.length) return;
    const mudou = sel.selectedIndex !== i;
    sel.selectedIndex = i; texto(); fechar(); bt.focus();
    if (mudou) sel.dispatchEvent(new Event('change', { bubbles: true }));
  };
  caixa._fechar = fechar;
  bt.addEventListener('click', () => (caixa.classList.contains('aberto') ? fechar() : abrir()));
  lista.addEventListener('mousedown', (ev) => ev.preventDefault());
  lista.addEventListener('click', (ev) => { const li = ev.target.closest('li'); if (li) escolher(Number(li.dataset.i)); });
  bt.addEventListener('keydown', (ev) => {
    const aberto = caixa.classList.contains('aberto');
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!aberto) { abrir(); return; }
      foco = Math.max(0, Math.min(sel.options.length - 1, foco + (ev.key === 'ArrowDown' ? 1 : -1))); marcarFoco();
    } else if ((ev.key === 'Enter' || ev.key === ' ') && aberto) { ev.preventDefault(); escolher(foco); }
    else if (ev.key === 'Escape' && aberto) { ev.preventDefault(); fechar(); }
    else if (ev.key === 'Tab' && aberto) fechar();
  });
  sel.addEventListener('change', texto);
  // quando o código troca as opções ou o valor por fora
  new MutationObserver(texto).observe(sel, { childList: true, subtree: true, attributes: true });
  const desc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  Object.defineProperty(sel, 'value', { configurable: true, get() { return desc.get.call(this); }, set(v) { const i = [...this.options].findIndex((op) => op.value === String(v)); if (i >= 0) this.selectedIndex = i; else desc.set.call(this, v); texto(); } });
  texto();
}
document.addEventListener('click', (ev) => { if (!ev.target.closest('.sel')) document.querySelectorAll('.sel.aberto').forEach((x) => x._fechar && x._fechar()); });
document.querySelectorAll('select').forEach(melhorarSelect);
new MutationObserver((muts) => {
  for (const m of muts) m.addedNodes.forEach((n) => {
    if (n.nodeType !== 1) return;
    if (n.tagName === 'SELECT') melhorarSelect(n); else n.querySelectorAll && n.querySelectorAll('select').forEach(melhorarSelect);
  });
}).observe(document.body, { childList: true, subtree: true });


// ================= TEMA (escuro padrão / claro opcional) =================
function aplicarTema(t) {
  if (t === 'claro') document.documentElement.dataset.tema = 'claro'; else delete document.documentElement.dataset.tema;
  const txt = document.getElementById('bt-tema-txt'); if (txt) txt.textContent = t === 'claro' ? 'Tema escuro' : 'Tema claro';
  const bt = document.getElementById('bt-tema'); if (bt) bt.setAttribute('aria-label', t === 'claro' ? 'Mudar pro tema escuro' : 'Mudar pro tema claro');
  try { localStorage.setItem('radar-tema', t); } catch (_) {}
}
aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'claro' : 'escuro');
document.getElementById('bt-tema').addEventListener('click', () => aplicarTema(document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro'));

// ================= NAVEGAÇÃO =================
document.querySelectorAll('[data-tela]').forEach((b) => b.addEventListener('click', () => {
  estado.tela = b.dataset.tela;
  if (estado.novoCliente) { estado.novoCliente = false; carregar(); }
  document.querySelectorAll('[data-tela]').forEach((x) => x.classList.toggle('ativo', x === b));
  desenhar();
}));
$('sel-site').addEventListener('change', (e) => { estado.site = e.target.value; estado.aberto = null; estado.novoCliente = false; carregar(); });
$('sel-periodo').addEventListener('change', desenhar);
$('bt-atualizar').addEventListener('click', carregar);
setInterval(() => { if (!document.hidden && estado.perfil && !['config', 'links', 'conversas', 'modelos', 'rotina'].includes(estado.tela)) carregar(); }, 30000);

iniciar();
</script>
